name: Monthly India OEM Supply Chain Intelligence Refresh

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-supply-intel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Gemini Search-grounded refresh with 2-stage dedup & trust merge
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/refresh-supply-intel.mjs

      - name: Commit updated public/mdc_supply_intel.json if changed
        run: |
          git config user.name "mdc-supply-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet public/mdc_supply_intel.json; then
            git add public/mdc_supply_intel.json
            git commit -m "chore(supply-intel): monthly Gemini search-grounded OEM refresh"
            git push
          else
            echo "No supply chain updates detected."
          fi
