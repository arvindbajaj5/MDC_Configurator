  <script>
    (function setupOfflinePwa() {
      try {
        const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#002870"/><rect x="88" y="136" width="336" height="240" rx="24" fill="none" stroke="#38BDF8" stroke-width="24"/><line x1="168" y1="136" x2="168" y2="376" stroke="#38BDF8" stroke-width="14"/><line x1="256" y1="136" x2="256" y2="376" stroke="#38BDF8" stroke-width="14"/><line x1="344" y1="136" x2="344" y2="376" stroke="#38BDF8" stroke-width="14"/><circle cx="396" cy="116" r="44" fill="#FF5539"/></svg>`;
        const iconUrl = 'data:image/svg+xml;base64,' + btoa(svgIcon);

        const manifest = {
          name: 'AI Modular Data Center Configurator',
          short_name: 'AI MDC CAD',
          description: 'Parametric AI Modular Data Center Designer, Container Shell Isometric CAD, SLD & Commercial CPQ Engine',
          start_url: './',
          display: 'standalone',
          background_color: '#002870',
          theme_color: '#002870',
          orientation: 'any',
          icons: [
            { src: iconUrl, sizes: '192x192', type: 'image/svg+xml' },
            { src: iconUrl, sizes: '512x512', type: 'image/svg+xml' }
          ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);

        const appleIcon = document.createElement('link');
        appleIcon.rel = 'apple-touch-icon';
        appleIcon.href = iconUrl;
        document.head.appendChild(appleIcon);

        if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
          const swCode = `
            const CACHE_NAME = 'ai-mdc-cad-v2';
            self.addEventListener('install', (e) => {
              self.skipWaiting();
              e.waitUntil(
                caches.open(CACHE_NAME).then((cache) => cache.addAll(['./']).catch(() => {}))
              );
            });
            self.addEventListener('activate', (e) => {
              e.waitUntil(self.clients.claim());
            });
            self.addEventListener('fetch', (e) => {
              if (e.request.method !== 'GET') return;
              e.respondWith(
                fetch(e.request)
                  .then((res) => {
                    const copy = res.clone();
                    caches.open(CACHE_NAME).then((cache) => cache.put(e.request, copy)).catch(() => {});
                    return res;
                  })
                  .catch(() => caches.match(e.request).then((cached) => cached || caches.match('./')))
              );
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
        }
      } catch (err) {
        console.warn('PWA init skipped:', err);
      }
    })();
  </script>

    const STORAGE_KEY = 'ai_mdc_configurator_state_v2';

    // ========================================================================
    // MAIN APPLICATION COMPONENT
    // ========================================================================
    function App() {
      // Load persisted offline state from LocalStorage
      const loadSavedState = () => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      };
      const saved = useMemo(() => loadSavedState(), []);

      const [activeTab, setActiveTab] = useState('configurator');
      const [cadDarkTheme, setCadDarkTheme] = useState(true);
      const [logoDataUrl, setLogoDataUrl] = useState(saved?.logoDataUrl || null);
      const [isOffline, setIsOffline] = useState(!navigator.onLine);
      const [statusToast, setStatusToast] = useState('');
      const [isExportingPdf, setIsExportingPdf] = useState(false);

      // Multi-Project Workspace State
      const [projects, setProjects] = useState(saved?.projects || createInitialProjects);
      const [activeProjectId, setActiveProjectId] = useState(saved?.activeProjectId || 'proj-alpha');

      // Global Master Parameters, Container Shell Metallurgy & Rate Card
      const [skus, setSkus] = useState(saved?.skus || INITIAL_SKUS);
      const [rateCard, setRateCard] = useState(saved?.rateCard || INITIAL_RATE_CARD);
      const [globalParams, setGlobalParams] = useState(
        saved?.globalParams || {
          raisedFloorMm: 700,
          torClearanceMm: 950,
          coldAisleMm: 1350,
          hotAisleMm: 1100,
          floorPointRatingKn: 10.0,
          floorUdlRatingKnM2: 22.0,
          spreaderReductionFactor: 0.38,
          emiShielding: 'RF/EMI-Shielded Enclosure (80 dB Attenuation)',
          regulatoryProfile: 'India (BIS / CEA / CPCB IV+ / PESO / NBC / IS 1893)',
          moduleCaps: { ac05: 500, dlc10: 1000, dlc20: 2000 },
          // Container Shell Structural Engineering Parameters
          shellMaterial: 'Corten-A Weathering Steel (SPA-H / ISO 1496) + Marine Zinc Primer',
          sideWallThicknessMm: 2.0,
          roofPlateThicknessMm: 3.0,
          subFloorThicknessMm: 4.5,
          cornerFrameThicknessMm: 6.0,
          insulationSpec: '120mm High-Density Rockwool / PUF (Fire Class A1, U=0.22 W/m²K)',
          airlockDoorDimsMm: '1400 × 2750',
          riggingHatchDimsMm: '1600 × 2800 (Removable Bolted End-Wall Panel)'
        }
      );

      // Google OAuth 2.0 & Google Drive Sync State
      const [googleClientId, setGoogleClientId] = useState(saved?.googleClientId || '');
      const [googleUser, setGoogleUser] = useState(null);
      const [googleToken, setGoogleToken] = useState(null);
      const [isSyncingDrive, setIsSyncingDrive] = useState(false);

      // New Make/Model Form State in Rate Card (Tab 2)
      const [newModelEntry, setNewModelEntry] = useState({
        bomKey: 'ext_cdu',
        make: '',
        model: '',
        standardCostUsd: 90000,
        notes: ''
      });

      // Blueprint Viewer State (Tab 4)
      const [selectedBlueprint, setSelectedBlueprint] = useState('yard');
      const [selectedModuleView, setSelectedModuleView] = useState(0);
      const [bpZoom, setBpZoom] = useState(1);
      const [bpLayers, setBpLayers] = useState({
        piping: true,
        power: true,
        expansion: true
      });

      const fileInputRef = useRef(null);
      const jsonImportRef = useRef(null);

      // Persist all state offline automatically
      useEffect(() => {
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              projects,
              activeProjectId,
              skus,
              rateCard,
              globalParams,
              logoDataUrl,
              googleClientId
            })
          );
        } catch (e) {
          console.warn('LocalStorage quota warning:', e);
        }
      }, [projects, activeProjectId, skus, rateCard, globalParams, logoDataUrl, googleClientId]);

      useEffect(() => {
        const handleOnline = () => setIsOffline(false);
        const handleOffline = () => setIsOffline(true);
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      const showToast = (msg) => {
        setStatusToast(msg);
        setTimeout(() => setStatusToast(''), 3400);
      };

      // Google OAuth 2.0 Sign-In (Google Identity Services Token Client)
      const handleGoogleSignIn = () => {
        if (!googleClientId.trim()) {
          setActiveTab('parameters');
          showToast('Enter your Google OAuth 2.0 Client ID in Tab 2 first.');
          return;
        }
        if (!window.google || !window.google.accounts) {
          showToast('Google Identity library still loading or offline.');
          return;
        }
        try {
          const tokenClient = window.google.accounts.oauth2.initTokenClient({
            client_id: googleClientId.trim(),
            scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email',
            callback: async (tokenResponse) => {
              if (tokenResponse && tokenResponse.access_token) {
                setGoogleToken(tokenResponse.access_token);
                try {
                  const profileRes = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                    headers: { Authorization: `Bearer ${tokenResponse.access_token}` }
                  });
                  const profile = await profileRes.json();
                  setGoogleUser(profile);
                  showToast(`Signed in as ${profile.email || profile.name}`);
                } catch {
                  setGoogleUser({ name: 'Google Workspace User' });
                  showToast('Google OAuth connected');
                }
              }
            }
          });
          tokenClient.requestAccessToken({ prompt: 'consent' });
        } catch (err) {
          showToast('OAuth error: Verify Client ID & Authorized JavaScript Origins in Google Cloud.');
        }
      };

      // Sync Workspace to Google Drive
      const handleSaveToGoogleDrive = async () => {
        if (!googleToken) {
          handleGoogleSignIn();
          return;
        }
        setIsSyncingDrive(true);
        try {
          const fileName = 'AI_MDC_Configurator_Workspace.json';
          const searchRes = await fetch(
            `https://www.googleapis.com/drive/v3/files?q=name='${fileName}' and trashed=false&fields=files(id,name)`,
            { headers: { Authorization: `Bearer ${googleToken}` } }
          );
          const searchData = await searchRes.json();
          const existingFileId = searchData.files?.[0]?.id;

          const workspacePayload = JSON.stringify({
            syncedAt: new Date().toISOString(),
            projects,
            activeProjectId,
            skus,
            rateCard,
            globalParams,
            logoDataUrl
          });

          const metadata = { name: fileName, mimeType: 'application/json' };
          const form = new FormData();
          form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
          form.append('file', new Blob([workspacePayload], { type: 'application/json' }));

          const endpoint = existingFileId
            ? `https://www.googleapis.com/upload/drive/v3/files/${existingFileId}?uploadType=multipart`
            : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';

          await fetch(endpoint, {
            method: existingFileId ? 'PATCH' : 'POST',
            headers: { Authorization: `Bearer ${googleToken}` },
            body: form
          });
          showToast('Synced all projects, rate cards & logo to Google Drive');
        } catch (e) {
          showToast('Drive sync failed — check token or network');
        } finally {
          setIsSyncingDrive(false);
        }
      };

      const handleLoadFromGoogleDrive = async () => {
        if (!googleToken) {
          handleGoogleSignIn();
          return;
        }
        setIsSyncingDrive(true);
        try {
          const fileName = 'AI_MDC_Configurator_Workspace.json';
          const searchRes = await fetch(
            `https://www.googleapis.com/drive/v3/files?q=name='${fileName}' and trashed=false&fields=files(id,name)`,
            { headers: { Authorization: `Bearer ${googleToken}` } }
          );
          const searchData = await searchRes.json();
          const fileId = searchData.files?.[0]?.id;
          if (!fileId) {
            showToast('No saved workspace found in Google Drive yet.');
            setIsSyncingDrive(false);
            return;
          }
          const dlRes = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
            headers: { Authorization: `Bearer ${googleToken}` }
          });
          const data = await dlRes.json();
          if (data.projects) setProjects(data.projects);
          if (data.activeProjectId) setActiveProjectId(data.activeProjectId);
          if (data.skus) setSkus(data.skus);
          if (data.rateCard) setRateCard(data.rateCard);
          if (data.globalParams) setGlobalParams(data.globalParams);
          if (data.logoDataUrl) setLogoDataUrl(data.logoDataUrl);
          showToast('Restored workspace from Google Drive');
        } catch {
          showToast('Failed to load workspace from Google Drive');
        } finally {
          setIsSyncingDrive(false);
        }
      };

      // Active Project Helper & Mutator
      const activeProject = useMemo(
        () => projects.find((p) => p.id === activeProjectId) || projects[0],
        [projects, activeProjectId]
      );

      const updateActiveProject = (updater) => {
        setProjects((prev) =>
          prev.map((p) => (p.id === activeProject.id ? (typeof updater === 'function' ? updater(p) : { ...p, ...updater }) : p))
        );
      };

      const updateDesignConfig = (patch) => {
        updateActiveProject((p) => ({
          ...p,
          designConfig: { ...p.designConfig, ...patch }
        }));
      };

      const updateCommercialTerms = (patch) => {
        updateActiveProject((p) => ({
          ...p,
          commercialTerms: { ...(p.commercialTerms || { marginPct: 20, contingencyPct: 5, gstPct: 18 }), ...patch }
        }));
      };

      // Multi-Project Actions
      const handleCreateProject = () => {
        const num = projects.length + 1;
        const newProj = {
          ...JSON.parse(JSON.stringify(activeProject)),
          id: `proj-${Date.now()}`,
          projectName: `Project ${String.fromCharCode(64 + num)} — Custom AI MDC Pod`,
          revision: 'REV-0',
          costOverrides: {}
        };
        setProjects((prev) => [...prev, newProj]);
        setActiveProjectId(newProj.id);
        showToast(`Created new project: ${newProj.projectName}`);
      };

      const handleDuplicateProject = () => {
        const dup = {
          ...JSON.parse(JSON.stringify(activeProject)),
          id: `proj-${Date.now()}`,
          projectName: `${activeProject.projectName} (Copy)`
        };
        setProjects((prev) => [...prev, dup]);
        setActiveProjectId(dup.id);
        showToast('Duplicated project configuration & pricing');
      };

      const handleDeleteProject = () => {
        if (projects.length <= 1) {
          showToast('At least one project must remain in the workspace.');
          return;
        }
        const remaining = projects.filter((p) => p.id !== activeProject.id);
        setProjects(remaining);
        setActiveProjectId(remaining[0].id);
        showToast('Project deleted');
      };

      const handleExportProjectJson = () => {
        const payload = {
          exportedAt: new Date().toISOString(),
          project: activeProject,
          globalParams,
          skus,
          rateCard,
          logoDataUrl
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${activeProject.projectName.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Exported Project JSON package');
      };

      const handleImportProjectJson = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target?.result);
            if (parsed.project) {
              const imported = {
                ...parsed.project,
                id: `proj-${Date.now()}`,
                projectName: `${parsed.project.projectName} (Imported)`
              };
              setProjects((prev) => [...prev, imported]);
              setActiveProjectId(imported.id);
              if (parsed.rateCard) setRateCard(parsed.rateCard);
              if (parsed.skus) setSkus(parsed.skus);
              if (parsed.globalParams) setGlobalParams(parsed.globalParams);
              if (parsed.logoDataUrl) setLogoDataUrl(parsed.logoDataUrl);
              showToast(`Imported project: ${imported.projectName}`);
            }
          } catch {
            showToast('Invalid project JSON file');
          }
        };
        reader.readAsText(file);
      };

      // Logo Upload Handler (Now located on Tab 2: Parameters Screen)
      const handleLogoUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          setLogoDataUrl(ev.target?.result);
          showToast(`Company logo "${file.name}" applied to top-left header & all CAD sheets`);
        };
        reader.readAsDataURL(file);
      };

      // Currency Formatter
      const currCfg = CURRENCY_CONFIG[activeProject.currency] || CURRENCY_CONFIG.INR;
      const fxRate = Number(activeProject.fxRate) || currCfg.rate;

      const formatMoney = (amountInProjectCurrency) => {
        const val = Math.round(Number(amountInProjectCurrency) || 0);
        if (activeProject.currency === 'INR') {
          return `₹${val.toLocaleString('en-IN')}`;
        }
        return `${currCfg.symbol}${val.toLocaleString('en-US')}`;
      };

      // ======================================================================
      // 4. PARAMETRIC ENGINEERING, SHELL STRUCTURAL & COMMERCIAL ENGINE
      // ======================================================================
      const engineering = useMemo(() => {
        const designConfig = activeProject.designConfig;
        const rackGroups = activeProject.rackGroups;
        const terms = activeProject.commercialTerms || { marginPct: 20, contingencyPct: 5, gstPct: 18 };
        const marginPct = Number(terms.marginPct) || 0;
        const contingencyPct = Number(terms.contingencyPct) || 0;
        const gstPct = Number(terms.gstPct) || 0;

        // 1. Expand Rack Groups
        const expandedGroups = rackGroups
          .map((rg) => {
            const sku = skus.find((s) => s.id === rg.skuId) || skus[0];
            const count = Math.max(0, Number(rg.count) || 0);
            const designKwPerRack = Number(rg.overrideDesignKw) || sku.designKw;
            const utilPct = Number(rg.actualUtilPct) || sku.actualUtilPct;
            const actualKwPerRack = designKwPerRack * (utilPct / 100);
            const totalDesignKw = count * designKwPerRack;
            const totalActualKw = count * actualKwPerRack;
            const liqFrac = sku.liquidCapturePct / 100;
            const designLiqKw = totalDesignKw * liqFrac;
            const designAirKw = totalDesignKw * (1 - liqFrac);
            const actualLiqKw = totalActualKw * liqFrac;
            const actualAirKw = totalActualKw * (1 - liqFrac);
            const totalFlowLpm = count * sku.flowLpm;
            const wetWeightPerRackKg = sku.dryWeightKg + sku.fluidWeightKg;
            const bayPitchEquiv = sku.widthMm >= 1100 ? 2 : 1;

            const rawPointLoadKn = (wetWeightPerRackKg * 9.81) / 1000 / Math.max(1, sku.feetCount);
            const footprintAreaM2 = (sku.widthMm / 1000) * (sku.depthMm / 1000);
            const rawUdlKnM2 = (wetWeightPerRackKg * 9.81) / 1000 / Math.max(0.2, footprintAreaM2);
            const needsSpreader = rawPointLoadKn > globalParams.floorPointRatingKn * 0.75 || wetWeightPerRackKg > 1300;
            const effectivePointLoadKn = needsSpreader
              ? rawPointLoadKn * globalParams.spreaderReductionFactor
              : rawPointLoadKn;
            const effectiveUdlKnM2 = needsSpreader ? rawUdlKnM2 * 0.78 : rawUdlKnM2;

            return {
              ...rg,
              sku,
              count,
              designKwPerRack,
              actualKwPerRack,
              totalDesignKw,
              totalActualKw,
              designLiqKw,
              designAirKw,
              actualLiqKw,
              actualAirKw,
              totalFlowLpm,
              wetWeightPerRackKg,
              bayPitchEquiv,
              rawPointLoadKn,
              rawUdlKnM2,
              needsSpreader,
              effectivePointLoadKn,
              effectiveUdlKnM2
            };
          })
          .filter((g) => g.count > 0);

        const totalDesignItKw = expandedGroups.reduce((acc, g) => acc + g.totalDesignKw, 0);
        const totalActualItKw = expandedGroups.reduce((acc, g) => acc + g.totalActualKw, 0);
        const totalDesignLiqKw = expandedGroups.reduce((acc, g) => acc + g.designLiqKw, 0);
        const totalDesignAirKw = expandedGroups.reduce((acc, g) => acc + g.designAirKw, 0);
        const totalActualLiqKw = expandedGroups.reduce((acc, g) => acc + g.actualLiqKw, 0);
        const totalActualAirKw = expandedGroups.reduce((acc, g) => acc + g.actualAirKw, 0);
        const totalCoolantFlowLpm = expandedGroups.reduce((acc, g) => acc + g.totalFlowLpm, 0);
        const totalCoolantFlowM3Hr = (totalCoolantFlowLpm * 60) / 1000;
        const maxRackDpBar = expandedGroups.reduce((max, g) => Math.max(max, g.sku.pressureDropBar), 0);
        const totalRacksCount = expandedGroups.reduce((acc, g) => acc + g.count, 0);
        const totalSpreaderFrames = expandedGroups.reduce((acc, g) => acc + (g.needsSpreader ? g.count : 0), 0);

        // 2. External CDU Validation
        const extCduGroups = expandedGroups.filter((g) => g.sku.cduType === 'External');
        const extCduDesignLiqKw = extCduGroups.reduce((acc, g) => acc + g.designLiqKw, 0);
        const extCduRackCount = extCduGroups.reduce((acc, g) => acc + g.count, 0);
        const cduCapKw = Math.max(250, Number(designConfig.externalCduUnitKw) || 1350);
        const cduMaxPorts = Math.max(2, Number(designConfig.externalCduMaxPorts) || 8);

        const activeCdusByKw = extCduDesignLiqKw > 0 ? Math.ceil(extCduDesignLiqKw / cduCapKw) : 0;
        const activeCdusByPorts = extCduRackCount > 0 ? Math.ceil(extCduRackCount / cduMaxPorts) : 0;
        const activeCdusRequired = Math.max(activeCdusByKw, activeCdusByPorts);
        const redundantCdusTotal =
          activeCdusRequired === 0
            ? 0
            : designConfig.uptimeTier === 'Tier IV'
            ? activeCdusRequired * 2
            : activeCdusRequired + 1;
        const cduUtilizationPct =
          activeCdusRequired > 0 ? Math.min(100, (extCduDesignLiqKw / (activeCdusRequired * cduCapKw)) * 100) : 0;

        // 3. Container Bin-Packing & Shell Structural Engineering
        const acGroups = expandedGroups.filter((g) => g.sku.category === 'AC');
        const dlcGroups = expandedGroups.filter((g) => g.sku.category === 'DLC');
        const totalAcDesignKw = acGroups.reduce((acc, g) => acc + g.totalDesignKw, 0);
        const totalDlcDesignKw = dlcGroups.reduce((acc, g) => acc + g.totalDesignKw, 0);

        const computeShellSpecs = (internalL, internalW, internalH, rackWetKg, fitoutKg) => {
          const extL = internalL + 320; // 160mm insulated structural wall + corner posts each end
          const extW = internalW + 300; // 150mm insulated side walls
          const extH = internalH + 340; // 180mm RHS base chassis + 160mm cambered insulated roof
          const surfaceAreaM2 = 2 * ((extL / 1000) * (extW / 1000) + (extL / 1000) * (extH / 1000) + (extW / 1000) * (extH / 1000));
          // Steel density 7850 kg/m3 + RHS frame + PUF insulation
          const wallSteelKg = surfaceAreaM2 * (globalParams.sideWallThicknessMm / 1000) * 7850 * 1.15;
          const floorSteelKg = ((extL / 1000) * (extW / 1000)) * ((globalParams.subFloorThicknessMm + 3) / 1000) * 7850;
          const frameAndRoofKg = (extL / 1000) * 620;
          const emptyShellTareKg = Math.round(wallSteelKg + floorSteelKg + frameAndRoofKg);
          const totalGrossWeightKg = Math.round(emptyShellTareKg + fitoutKg + rackWetKg);

          return {
            extL,
            extW,
            extH,
            emptyShellTareKg,
            fitoutKg: Math.round(fitoutKg),
            rackWetKg: Math.round(rackWetKg),
            totalGrossWeightKg,
            openings: [
              `1× Pressurized Vestibule Airlock Door (${globalParams.airlockDoorDimsMm} mm, EMI Gasketed)`,
              `1× Removable End-Wall Equipment Rigging Hatch (${globalParams.riggingHatchDimsMm} mm)`,
              `4× Underfloor SS316L Pipe Penetration Sleeves (DN150/DN200 Sealed Bulkhead)`,
              `2× Roof/Wall Busduct Entry Flanges with Type 1+2 EMI Line Filters`,
              `2× Clean-Agent Over-Pressure Relief Louvers + Honeycomb Waveguide Vents`
            ]
          };
        };

        const modules = [];

        if (acGroups.length > 0) {
          const acModulesCount = Math.max(1, Math.ceil(totalAcDesignKw / globalParams.moduleCaps.ac05));
          const itemsPerMod = Array.from({ length: acModulesCount }, () => []);
          let idx = 0;
          acGroups.forEach((g) => {
            for (let r = 0; r < g.count; r++) {
              itemsPerMod[idx % acModulesCount].push({
                sku: g.sku,
                designKw: g.designKwPerRack,
                actualKw: g.actualKwPerRack,
                baySpan: g.bayPitchEquiv,
                needsSpreader: g.needsSpreader,
                wetWeightKg: g.wetWeightPerRackKg
              });
              idx++;
            }
          });

          itemsPerMod.forEach((racks, mIdx) => {
            if (racks.length === 0) return;
            const modDesignKw = racks.reduce((a, r) => a + r.designKw, 0);
            const modActualKw = racks.reduce((a, r) => a + r.actualKw, 0);
            const maxH = racks.reduce((m, r) => Math.max(m, r.sku.heightMm), 2200);
            const maxD = racks.reduce((m, r) => Math.max(m, r.sku.depthMm), 1100);
            const totalBays = racks.reduce((a, r) => a + r.baySpan, 0);
            const avgKwPerRack = modDesignKw / racks.length;

            const airCoolingTech =
              avgKwPerRack > 35
                ? 'Rear-Door Heat Exchangers (RDHx)'
                : avgKwPerRack > 20
                ? 'In-Row Chilled-Water Coolers'
                : 'Perimeter Precision Air Conditioning (PAC / CRAH)';

            const acUnitsActive = Math.max(1, Math.ceil(modDesignKw / 120));
            const acUnitsTotal = designConfig.uptimeTier === 'Tier IV' ? acUnitsActive * 2 : acUnitsActive + 1;

            const internalWidthMm = maxD * 2 + globalParams.coldAisleMm + globalParams.hotAisleMm + 400;
            const internalHeightMm = globalParams.raisedFloorMm + maxH + globalParams.torClearanceMm;
            const rowSlots = Math.max(6, Math.ceil(totalBays / 2) + Math.ceil(acUnitsTotal / 2));
            const internalLengthMm = Math.max(9140, rowSlots * 650 + 2400);

            const totalRackWetKg = racks.reduce((a, r) => a + r.wetWeightKg, 0);
            const fitoutKg = acUnitsTotal * 450 + 1850;
            const shell = computeShellSpecs(internalLengthMm, internalWidthMm, internalHeightMm, totalRackWetKg, fitoutKg);

            modules.push({
              id: `MOD-AC-${mIdx + 1}`,
              code: `AC-05-${String(mIdx + 1).padStart(2, '0')}`,
              type: '0.5 MW Air-Cooled Module',
              bomKey: 'mod_ac_05',
              category: 'AC',
              nominalKw: globalParams.moduleCaps.ac05,
              designKw: modDesignKw,
              actualKw: modActualKw,
              designLiqKw: 0,
              designAirKw: modDesignKw,
              racks,
              cdusCount: 0,
              airCoolersCount: acUnitsTotal,
              airCoolingTech,
              dimensionsMm: {
                length: internalLengthMm,
                width: internalWidthMm,
                height: internalHeightMm,
                maxRackH: maxH,
                maxRackD: maxD
              },
              shell,
              odcFlag: shell.extW > 3000 || shell.extH + designConfig.floodPlinthMm > 4500,
              totalWetWeightKg: shell.totalGrossWeightKg
            });
          });
        }

        if (dlcGroups.length > 0) {
          let remainingKw = totalDlcDesignKw;
          const dlcSpecs = [];
          while (remainingKw > 0.1) {
            if (remainingKw > globalParams.moduleCaps.dlc10 * 1.15) {
              dlcSpecs.push({ type: '2.0 MW Large DLC Module', bomKey: 'mod_dlc_20', cap: globalParams.moduleCaps.dlc20, prefix: 'DLC-20' });
              remainingKw -= globalParams.moduleCaps.dlc20;
            } else {
              dlcSpecs.push({ type: '1.0 MW Small DLC Module', bomKey: 'mod_dlc_10', cap: globalParams.moduleCaps.dlc10, prefix: 'DLC-10' });
              remainingKw -= globalParams.moduleCaps.dlc10;
            }
          }
          if (dlcSpecs.length === 0) {
            dlcSpecs.push({ type: '1.0 MW Small DLC Module', bomKey: 'mod_dlc_10', cap: globalParams.moduleCaps.dlc10, prefix: 'DLC-10' });
          }

          const modBuckets = dlcSpecs.map((spec, idx) => ({ ...spec, index: idx, racks: [], currentKw: 0 }));
          const flatDlcRacks = [];
          dlcGroups.forEach((g) => {
            for (let r = 0; r < g.count; r++) {
              flatDlcRacks.push({
                sku: g.sku,
                designKw: g.designKwPerRack,
                actualKw: g.actualKwPerRack,
                liqKw: g.designKwPerRack * (g.sku.liquidCapturePct / 100),
                airKw: g.designKwPerRack * (1 - g.sku.liquidCapturePct / 100),
                baySpan: g.bayPitchEquiv,
                needsSpreader: g.needsSpreader,
                wetWeightKg: g.wetWeightPerRackKg
              });
            }
          });

          flatDlcRacks.forEach((rackItem) => {
            let bestBucket = modBuckets[0];
            let lowestRatio = bestBucket.currentKw / bestBucket.cap;
            modBuckets.forEach((b) => {
              const ratio = b.currentKw / b.cap;
              if (ratio < lowestRatio) {
                lowestRatio = ratio;
                bestBucket = b;
              }
            });
            bestBucket.racks.push(rackItem);
            bestBucket.currentKw += rackItem.designKw;
          });

          modBuckets.forEach((b, mIdx) => {
            if (b.racks.length === 0) return;
            const modDesignKw = b.racks.reduce((a, r) => a + r.designKw, 0);
            const modActualKw = b.racks.reduce((a, r) => a + r.actualKw, 0);
            const modLiqKw = b.racks.reduce((a, r) => a + r.liqKw, 0);
            const modResidualAirKw = b.racks.reduce((a, r) => a + r.airKw, 0);

            const maxH = b.racks.reduce((m, r) => Math.max(m, r.sku.heightMm), 2400);
            const maxD = b.racks.reduce((m, r) => Math.max(m, r.sku.depthMm), 1200);
            const totalBays = b.racks.reduce((a, r) => a + r.baySpan, 0);

            const extRacksInMod = b.racks.filter((r) => r.sku.cduType === 'External').length;
            const modCdus =
              extRacksInMod > 0 && extCduRackCount > 0
                ? Math.max(1, Math.round((extRacksInMod / extCduRackCount) * redundantCdusTotal))
                : 0;

            const highCaptureOnly = modResidualAirKw <= modDesignKw * 0.03;
            const roomTrimKw = Math.max(15, Math.ceil(modResidualAirKw + 12));
            const airCoolersCount = highCaptureOnly ? 2 : Math.max(2, Math.ceil(roomTrimKw / 65) + 1);
            const airCoolingTech = highCaptureOnly
              ? '20°C Room-Trim Chilled Coil + Dehumidifier (2% Metal Heat)'
              : 'In-Row Chilled-Water Coolers (Residual Air Split)';

            const internalWidthMm = maxD * 2 + globalParams.coldAisleMm + globalParams.hotAisleMm + 500;
            const internalHeightMm = globalParams.raisedFloorMm + maxH + globalParams.torClearanceMm;
            const effectiveBays = totalBays + modCdus * 2 + (highCaptureOnly ? 0 : airCoolersCount);
            const rowSlots = Math.max(6, Math.ceil(effectiveBays / 2));
            const internalLengthMm = Math.max(10500, rowSlots * 700 + 2600);

            const totalRackWetKg = b.racks.reduce((a, r) => a + r.wetWeightKg, 0);
            const fitoutKg = modCdus * 820 + airCoolersCount * 350 + 2400;
            const shell = computeShellSpecs(internalLengthMm, internalWidthMm, internalHeightMm, totalRackWetKg, fitoutKg);

            modules.push({
              id: `MOD-DLC-${mIdx + 1}`,
              code: `${b.prefix}-${String(mIdx + 1).padStart(2, '0')}`,
              type: b.type,
              bomKey: b.bomKey,
              category: 'DLC',
              nominalKw: b.cap,
              designKw: modDesignKw,
              actualKw: modActualKw,
              designLiqKw: modLiqKw,
              designAirKw: modResidualAirKw,
              racks: b.racks,
              cdusCount: modCdus,
              airCoolersCount,
              airCoolingTech,
              dimensionsMm: {
                length: internalLengthMm,
                width: internalWidthMm,
                height: internalHeightMm,
                maxRackH: maxH,
                maxRackD: maxD
              },
              shell,
              odcFlag: shell.extW > 3000 || shell.extH + designConfig.floodPlinthMm > 4500,
              totalWetWeightKg: shell.totalGrossWeightKg
            });
          });
        }

        // 4. Seasonal Climate & Water-Availability Advisor
        const climate = CLIMATE_PRESETS[designConfig.climatePreset] || CLIMATE_PRESETS.mumbai;
        const peakWetBulb = Math.max(...climate.wetBulb);
        const waterMode = designConfig.waterAvailability;
        const warmWaterThresholdC = 32;

        const monthlyProfile = MONTHS.map((m, i) => {
          const db = climate.dryBulb[i];
          const wb = climate.wetBulb[i];
          let mode = 'Dry Free-Cooling';
          let waterM3Day = 0;
          let mechCoolingKw = totalActualAirKw * 0.32;

          if (waterMode === 'Zero Water') {
            if (db <= warmWaterThresholdC) {
              mode = 'Dry Cooler (100% Sensible)';
              mechCoolingKw += totalActualLiqKw * 0.04;
            } else {
              mode = 'Dry Cooler + Air-Cooled Trim Chiller';
              const trimFraction = Math.min(1, (db - warmWaterThresholdC) / 12);
              mechCoolingKw += totalActualLiqKw * (0.04 + trimFraction * 0.24);
            }
          } else {
            if (db <= warmWaterThresholdC) {
              mode = 'Dry Cooler Mode (Zero Water)';
              mechCoolingKw += totalActualLiqKw * 0.04;
            } else if (wb <= 24.5 && (waterMode === 'Abundant' || db >= 36)) {
              mode = 'Adiabatic Spray-Assisted Mode';
              mechCoolingKw += totalActualLiqKw * 0.055;
              waterM3Day = ((totalActualLiqKw * 0.75 * 1.8 * 24) / 1000) * 1.15;
            } else {
              mode = 'Hybrid Adiabatic + Trim Chiller';
              mechCoolingKw += totalActualLiqKw * 0.19;
              waterM3Day = ((totalActualLiqKw * 0.45 * 1.8 * 24) / 1000) * 1.15;
            }
          }

          const pumpAndAuxKw = totalActualItKw * 0.025;
          const upsLossKw = designConfig.includeUps ? totalActualItKw * 0.02 : 0;
          const totalFacilityActualKw = totalActualItKw + mechCoolingKw + pumpAndAuxKw + upsLossKw;
          const pue = totalActualItKw > 0 ? totalFacilityActualKw / totalActualItKw : 1.0;

          return { month: m, db, wb, mode, waterM3Day: Number(waterM3Day.toFixed(1)), pue: Number(pue.toFixed(3)) };
        });

        const annualizedPue = monthlyProfile.reduce((a, m) => a + m.pue, 0) / 12;
        const peakWaterM3Day = monthlyProfile.reduce((max, m) => Math.max(max, m.waterM3Day), 0);
        const annualWaterM3 = monthlyProfile.reduce((a, m) => a + m.waterM3Day * 30.4, 0);

        const coolingArchitecture =
          waterMode === 'Zero Water'
            ? 'Zero-Water Dry Fluid Coolers + Air-Cooled Trim Chiller'
            : peakWetBulb >= 26
            ? 'Hybrid Adiabatic Fluid Coolers + Air-Cooled Trim Chiller (Monsoon High-RH Assist)'
            : 'Adiabatic Spray-Assisted Fluid Coolers + Compact Trim Chiller';

        // 5. Hydraulic Pump Skid & Pipe Header Sizing
        const designFlowM3Hr = Math.max(12, totalCoolantFlowM3Hr + totalDesignAirKw * 0.172);
        const systemHeadBar = Number((maxRackDpBar + 1.45).toFixed(2));
        const pumpType =
          designFlowM3Hr > 140
            ? 'VFD End-Suction Split-Case Centrifugal Pump Skid'
            : 'VFD Vertical Multistage Centrifugal Pump Skid (SS316)';
        const pumpMotorKwEach = Math.ceil((designFlowM3Hr * systemHeadBar * 100) / (3600 * 0.74 * 0.92));
        const activePumps = designFlowM3Hr > 160 ? 2 : 1;
        const totalPumps = designConfig.uptimeTier === 'Tier IV' ? activePumps * 2 : activePumps + 1;
        const headerDnSize =
          designFlowM3Hr > 220 ? 'DN200 (8")' : designFlowM3Hr > 120 ? 'DN150 (6")' : designFlowM3Hr > 55 ? 'DN125 (5")' : 'DN100 (4")';

        // 6. Electrical Plant, UPS, Battery & Generator Sizing
        const totalCoolingDesignKw = totalDesignAirKw * 0.35 + totalDesignLiqKw * 0.16 + totalDesignItKw * 0.03;
        const totalFacilityDesignKw = totalDesignItKw + totalCoolingDesignKw;
        const totalFacilityDesignKva = Math.ceil(totalFacilityDesignKw / 0.92);

        const standardTrafoRatings = [630, 1000, 1250, 1600, 2000, 2500, 3150, 4000];
        const reqTrafoKva = designConfig.uptimeTier === 'Tier IV' ? totalFacilityDesignKva : totalFacilityDesignKva * 1.15;
        const selectedTrafoKva = standardTrafoRatings.find((r) => r >= reqTrafoKva) || Math.ceil(reqTrafoKva / 500) * 500;
        const trafoCount = designConfig.uptimeTier === 'Tier II' ? 1 : 2;

        const upsLoadKw = totalDesignItKw + totalCoolingDesignKw * 0.35;
        const upsRequiredKva = Math.ceil(upsLoadKw / 0.95);
        const upsUnitKva = upsRequiredKva > 1200 ? 600 : 500;
        const upsActiveUnits = designConfig.includeUps ? Math.max(1, Math.ceil(upsRequiredKva / upsUnitKva)) : 0;
        const upsTotalUnits = !designConfig.includeUps
          ? 0
          : designConfig.uptimeTier === 'Tier IV'
          ? upsActiveUnits * 2
          : upsActiveUnits + 1;

        const batteryKwhRequired = designConfig.includeUps
          ? Math.ceil((upsLoadKw * (designConfig.upsRuntimeMins / 60)) / 0.88)
          : 0;
        const isLfp = designConfig.batteryChemistry.includes('LFP');
        const batteryCabinetCount = designConfig.includeUps ? Math.max(2, Math.ceil(batteryKwhRequired / (isLfp ? 180 : 95))) : 0;
        const batteryWeightKg = batteryCabinetCount * (isLfp ? 1450 : 2100);
        const batteryRoomCoolingKw = designConfig.includeUps ? Math.max(10, Math.ceil(batteryKwhRequired * 0.015)) : 0;

        const standardDgRatings = [500, 750, 1010, 1250, 1500, 2000, 2250, 2500, 3000];
        const dgRequiredKva = Math.ceil(totalFacilityDesignKva * 1.15);
        const selectedDgKva = standardDgRatings.find((r) => r >= dgRequiredKva) || Math.ceil(dgRequiredKva / 250) * 250;
        const dgCount =
          designConfig.backupGenType === 'None'
            ? 0
            : designConfig.uptimeTier === 'Tier IV' || designConfig.uptimeTier === 'Tier III'
            ? 2
            : 1;

        const fuelBurnLitersHr = Math.round(totalActualItKw * annualizedPue * 0.215);
        const totalFuelStorageLiters = fuelBurnLitersHr * designConfig.fuelAutonomyHours;
        const pesoLicenseRequired = totalFuelStorageLiters > 1000;
        const totalYardAreaM2 = Math.round((modules.length * 65 + 240) * (1 + designConfig.expansionReservePct / 100));

        // 7. COMMERCIAL BOM & FULL PRICE SHEET BUILDER (COST -> CONTINGENCY -> MARGIN -> GST)
        const countDlc20 = modules.filter((m) => m.bomKey === 'mod_dlc_20').length;
        const countDlc10 = modules.filter((m) => m.bomKey === 'mod_dlc_10').length;
        const countAc05 = modules.filter((m) => m.bomKey === 'mod_ac_05').length;
        const totalInPodAirCoolers = modules.reduce((a, m) => a + m.airCoolersCount, 0);

        const qtyByBomKey = {
          mod_dlc_20: countDlc20,
          mod_dlc_10: countDlc10,
          mod_ac_05: countAc05,
          floor_spreader: Math.max(totalRacksCount, totalSpreaderFrames),
          ext_cdu: redundantCdusTotal,
          adiabatic_cooler: totalDesignLiqKw > 0 ? 2 : 0,
          trim_chiller: 2,
          pump_skid: 1,
          air_coolers: totalInPodAirCoolers,
          transformer: designConfig.includeTransformer ? trafoCount : 0,
          ups_system: designConfig.includeUps ? upsTotalUnits : 0,
          battery_bank: designConfig.includeUps ? batteryCabinetCount : 0,
          generator: dgCount,
          busway_cabling: modules.length,
          civil_monsoon: modules.length
        };

        const bomLines = rateCard
          .map((rc) => {
            const qty = qtyByBomKey[rc.bomKey] ?? 0;
            if (qty <= 0) return null;

            const chosenModelId = activeProject.selectedModels?.[rc.bomKey] || rc.models[0].id;
            const chosenModel = rc.models.find((m) => m.id === chosenModelId) || rc.models[0];

            const standardUnitCost = Math.round(chosenModel.standardCostUsd * fxRate);
            const overrideVal = activeProject.costOverrides?.[rc.bomKey];
            const hasOverride = overrideVal !== undefined && overrideVal !== null && overrideVal !== '';
            const effectiveUnitCost = hasOverride ? Number(overrideVal) : standardUnitCost;

            const totalBaseCost = qty * effectiveUnitCost;
            const contingencyAmt = totalBaseCost * (contingencyPct / 100);
            const costWithContingency = totalBaseCost + contingencyAmt;

            // Convert Cost + Contingency into Selling Price using Target Gross Margin %
            // Selling Price = Cost / (1 - Margin%) [or Cost * (1 + Margin%) if >= 95%]
            const marginDivisor = marginPct < 95 ? 1 - marginPct / 100 : 1;
            const totalPreTaxPrice = marginPct < 95 ? costWithContingency / marginDivisor : costWithContingency * (1 + marginPct / 100);
            const unitSellingPrice = qty > 0 ? totalPreTaxPrice / qty : 0;
            const grossMarginAmt = totalPreTaxPrice - costWithContingency;
            const gstAmt = totalPreTaxPrice * (gstPct / 100);
            const grandTotalInclGst = totalPreTaxPrice + gstAmt;

            return {
              bomKey: rc.bomKey,
              skuCode: rc.skuCode,
              category: rc.category,
              itemName: rc.itemName,
              unit: rc.unit,
              qty,
              models: rc.models,
              chosenModel,
              standardUnitCost,
              effectiveUnitCost,
              hasOverride,
              totalBaseCost,
              contingencyPct,
              contingencyAmt,
              marginPct,
              grossMarginAmt,
              unitSellingPrice,
              totalPreTaxPrice,
              gstPct,
              gstAmt,
              grandTotalInclGst
            };
          })
          .filter(Boolean);

        const sumBaseCost = bomLines.reduce((a, l) => a + l.totalBaseCost, 0);
        const sumContingency = bomLines.reduce((a, l) => a + l.contingencyAmt, 0);
        const sumGrossMargin = bomLines.reduce((a, l) => a + l.grossMarginAmt, 0);
        const sumPreTaxPrice = bomLines.reduce((a, l) => a + l.totalPreTaxPrice, 0);
        const sumGstAmt = bomLines.reduce((a, l) => a + l.gstAmt, 0);
        const sumGrandTotalInclGst = bomLines.reduce((a, l) => a + l.grandTotalInclGst, 0);
        const sellPricePerItKw = totalDesignItKw > 0 ? sumPreTaxPrice / totalDesignItKw : 0;

        return {
          expandedGroups,
          totalDesignItKw,
          totalActualItKw,
          totalDesignLiqKw,
          totalDesignAirKw,
          totalActualLiqKw,
          totalActualAirKw,
          totalCoolantFlowLpm,
          totalCoolantFlowM3Hr,
          maxRackDpBar,
          totalRacksCount,
          totalSpreaderFrames,
          extCduDesignLiqKw,
          extCduRackCount,
          activeCdusRequired,
          redundantCdusTotal,
          cduUtilizationPct,
          modules,
          monthlyProfile,
          annualizedPue,
          peakWaterM3Day,
          annualWaterM3,
          coolingArchitecture,
          designFlowM3Hr,
          systemHeadBar,
          pumpType,
          pumpMotorKwEach,
          totalPumps,
          headerDnSize,
          totalFacilityDesignKw,
          totalFacilityDesignKva,
          selectedTrafoKva,
          trafoCount,
          upsRequiredKva,
          upsUnitKva,
          upsTotalUnits,
          batteryKwhRequired,
          batteryCabinetCount,
          batteryWeightKg,
          batteryRoomCoolingKw,
          selectedDgKva,
          dgCount,
          fuelBurnLitersHr,
          totalFuelStorageLiters,
          pesoLicenseRequired,
          totalYardAreaM2,
          bomLines,
          sumBaseCost,
          sumContingency,
          sumGrossMargin,
          sumPreTaxPrice,
          sumGstAmt,
          sumGrandTotalInclGst,
          sellPricePerItKw
        };
      }, [activeProject, skus, globalParams, rateCard, fxRate]);

      // ======================================================================
      // 5. DUAL EXPORTERS: (A) ENGINEERING BOM CSV & (B) FULL PRICE SHEET CSV
      // ======================================================================
      const triggerCsvDownload = (rowsArray, filename) => {
        const escapeCsv = (val) => `"${String(val ?? '').replace(/"/g, '""')}"`;
        const csvString = rowsArray.map((r) => r.map(escapeCsv).join(',')).join('\n');
        const blob = new Blob([csvString], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleExportEngineeringBomCsv = () => {
        const meta = [
          ['AI MODULAR DATA CENTER — TECHNICAL ENGINEERING BILL OF MATERIALS (BOM)'],
          ['Project Name', activeProject.projectName],
          ['Client', activeProject.clientName],
          ['Site Location', activeProject.siteLocation],
          ['Uptime Tier', activeProject.designConfig.uptimeTier],
          ['Design IT Load (kW)', engineering.totalDesignItKw],
          ['Actual Operating Load (kW)', Math.round(engineering.totalActualItKw)],
          ['Enclosure Shell Spec', `${globalParams.shellMaterial} | Wall ${globalParams.sideWallThicknessMm}mm | Roof ${globalParams.roofPlateThicknessMm}mm | Floor ${globalParams.subFloorThicknessMm}mm`],
          []
        ];
        const headers = ['Line #', 'SKU Code', 'Subsystem Category', 'Equipment Description', 'Selected Make', 'Selected Model', 'Quantity', 'Unit', 'Technical Specification Notes'];
        const rows = engineering.bomLines.map((l, idx) => [
          idx + 1,
          l.skuCode,
          l.category,
          l.itemName,
          l.chosenModel.make,
          l.chosenModel.model,
          l.qty,
          l.unit,
          l.chosenModel.notes
        ]);
        triggerCsvDownload(
          [...meta, headers, ...rows],
          `Engineering_BOM_${activeProject.projectName.replace(/[^a-z0-9]/gi, '_')}_${activeProject.revision}.csv`
        );
        showToast('Exported Engineering BOM (.CSV)');
      };

      const handleExportFullPriceSheetCsv = () => {
        const curr = activeProject.currency;
        const meta = [
          ['AI MODULAR DATA CENTER — ITEMIZED COMMERCIAL PRICE SHEET (PER SKU)'],
          ['Project Name', activeProject.projectName],
          ['Client', activeProject.clientName],
          ['Site Location', activeProject.siteLocation],
          ['Revision', activeProject.revision],
          ['Currency & FX', `${curr} (1 USD = ${fxRate} ${curr})`],
          ['Commercial Parameters', `Contingency: ${engineering.bomLines[0]?.contingencyPct ?? 0}% | Gross Margin: ${engineering.bomLines[0]?.marginPct ?? 0}% | GST/Tax: ${engineering.bomLines[0]?.gstPct ?? 0}%`],
          []
        ];

        const headers = [
          'Item Code / SKU',
          'Category',
          'Description',
          'Make & Model',
          'Quantity',
          'Unit',
          `Unit Cost (${curr})`,
          `Total Base Cost (${curr})`,
          'Contingency (%)',
          `Contingency Amount (${curr})`,
          'Margin (%)',
          `Margin Amount (${curr})`,
          `Unit Selling Price (${curr})`,
          `Total Pre-Tax Price (${curr})`,
          'GST / Tax (%)',
          `GST Amount (${curr})`,
          `Grand Total Price Incl. GST (${curr})`
        ];

        const rows = engineering.bomLines.map((l) => [
          l.skuCode,
          l.category,
          l.itemName,
          `${l.chosenModel.make} ${l.chosenModel.model}`,
          l.qty,
          l.unit,
          Math.round(l.effectiveUnitCost),
          Math.round(l.totalBaseCost),
          l.contingencyPct.toFixed(1),
          Math.round(l.contingencyAmt),
          l.marginPct.toFixed(1),
          Math.round(l.grossMarginAmt),
          Math.round(l.unitSellingPrice),
          Math.round(l.totalPreTaxPrice),
          l.gstPct.toFixed(1),
          Math.round(l.gstAmt),
          Math.round(l.grandTotalInclGst)
        ]);

        const totals = [
          [],
          [
            '',
            '',
            'TOTALS',
            '',
            '',
            '',
            '',
            Math.round(engineering.sumBaseCost),
            '',
            Math.round(engineering.sumContingency),
            '',
            Math.round(engineering.sumGrossMargin),
            '',
            Math.round(engineering.sumPreTaxPrice),
            '',
            Math.round(engineering.sumGstAmt),
            Math.round(engineering.sumGrandTotalInclGst)
          ]
        ];

        triggerCsvDownload(
          [...meta, headers, ...rows, ...totals],

        if (!mod) return null;
        const sh = mod.shell;

        // True 3D Isometric Projection Helper (30 deg X and Z axes, vertical Y axis)
        const originX = 330;
        const originY = 445;
        const scale = 0.032; // scales ~12,000mm length neatly to ~380px
        const cos30 = 0.866;
        const sin30 = 0.5;
        const iso = (xMm, yMm, zMm) => {
          const sx = originX + (xMm - zMm) * cos30 * scale;
          const sy = originY + (xMm + zMm) * sin30 * scale - yMm * scale;
          return `${sx.toFixed(1)},${sy.toFixed(1)}`;
        };
        const isoPt = (xMm, yMm, zMm) => ({
          x: originX + (xMm - zMm) * cos30 * scale,
          y: originY + (xMm + zMm) * sin30 * scale - yMm * scale
        });

        const L = sh.extL;
        const W = sh.extW;
        const H = sh.extH;

        const p000 = isoPt(0, 0, 0);
        const pL00 = isoPt(L, 0, 0);
        const pLW0 = isoPt(L, 0, W);
        const p0W0 = isoPt(0, 0, W);

        const p0H0 = isoPt(0, H, 0);
        const pLH0 = isoPt(L, H, 0);
        const pLWH = isoPt(L, H, W);
        const p0WH = isoPt(0, H, W);

        // Corrugation ribs along side wall (z = W face)
        const ribCount = 16;
        const ribs = Array.from({ length: ribCount }, (_, i) => {
          const rx = ((i + 1) * L) / (ribCount + 1);
          return {
            top: isoPt(rx, H - 180, W),
            bot: isoPt(rx, 180, W)
          };
        });

        return (
          <svg viewBox="0 0 1200 700" className="w-full h-auto border border-slate-400">

                          <td className="p-2.5 text-right font-mono">{formatMoney(engineering.sumContingency)}</td>
                          <td className="p-2.5 text-right font-mono">—</td>
                          <td className="p-2.5 text-right font-mono">{formatMoney(engineering.sumPreTaxPrice)}</td>
                          <td className="p-2.5 text-right font-mono">{formatMoney(engineering.sumGstAmt)}</td>
                          <td className="p-2.5 text-right font-mono text-sm">{formatMoney(engineering.sumGrandTotalInclGst)}</td>
                        </tr>
                      </tfoot>
                    </table>
                  </div>
                </section>

                {/* 2. Container Shell Structural & Mass Schedule */}
                <section className="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
                  <h3 className="text-base font-extrabold text-[#002870] mb-3">
                    2. Container Shell Structural Engineering, Openings & Rigging Weight Schedule
                  </h3>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse text-xs">
                      <thead>
                        <tr className="bg-slate-100 text-slate-600 border-b border-slate-200">
                          <th className="p-2.5 font-bold">Pod Code & Class</th>
                          <th className="p-2.5 font-bold">Internal Clear (L×W×H)</th>
                          <th className="p-2.5 font-bold">External Overall (L×W×H)</th>
                          <th className="p-2.5 font-bold">Empty Shell Tare</th>
                          <th className="p-2.5 font-bold">MEP + Wet Rack Mass</th>
                          <th className="p-2.5 font-bold">Total Gross Rigging Weight</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {engineering.modules.map((m) => (
                          <tr key={m.id}>
                            <td className="p-2.5 font-extrabold text-[#002870]">{m.code} • {m.type}</td>
                            <td className="p-2.5 font-mono">{m.dimensionsMm.length} × {m.dimensionsMm.width} × {m.dimensionsMm.height} mm</td>
                            <td className="p-2.5 font-mono font-bold">{m.shell.extL} × {m.shell.extW} × {m.shell.extH} mm</td>
                            <td className="p-2.5">{(m.shell.emptyShellTareKg / 1000).toFixed(2)} T</td>
                            <td className="p-2.5">{((m.shell.fitoutKg + m.shell.rackWetKg) / 1000).toFixed(2)} T</td>
                            <td className="p-2.5 font-extrabold text-[#FF5539]">{(m.shell.totalGrossWeightKg / 1000).toFixed(2)} Tonnes</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </section>
              </div>
            )}

            {/* ============================================================== */}
            {/* TAB 4: LEVEL 2 — 6 CAD BLUEPRINTS, ISOMETRIC SHELL & SLDs      */}
            {/* ============================================================== */}
            {activeTab === 'level2' && (
              <div className="space-y-4">
                <div className="no-print bg-white rounded-xl border border-slate-200 shadow-sm p-3.5 flex flex-wrap items-center justify-between gap-3">
                  <div className="flex flex-wrap gap-1.5">
                    {[
                      { id: 'yard', label: 'A-101: Master Yard CAD' },
                      { id: 'floorplan', label: 'A-102: Floor Plan CAD' },
                      { id: 'elevation', label: 'A-103: Section A-A' },
                      { id: 'isometric', label: 'A-104: Shell Isometric 3D' },
                      { id: 'sld_elec', label: 'E-201: Electrical SLD' },
                      { id: 'sld_cool', label: 'M-301: Cooling P&ID' }
                    ].map((bp) => (
                      <button
                        key={bp.id}
                        onClick={() => setSelectedBlueprint(bp.id)}
                        className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                          selectedBlueprint === bp.id ? 'bg-[#002870] text-white shadow-sm' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                        }`}
                      >
                        {bp.label}
                      </button>
                    ))}
                  </div>

                  <div className="flex flex-wrap items-center gap-2 text-xs">
                    {(selectedBlueprint === 'floorplan' || selectedBlueprint === 'elevation' || selectedBlueprint === 'isometric') &&
                      engineering.modules.length > 0 && (
                        <select
                          value={selectedModuleView}
                          onChange={(e) => setSelectedModuleView(Number(e.target.value))}
                          className="border border-slate-300 rounded-lg px-2.5 py-1.5 font-bold text-[#002870] bg-slate-50"
                        >
                          {engineering.modules.map((m, idx) => (
                            <option key={m.id} value={idx}>{m.code} ({m.type})</option>
                          ))}
                        </select>
                      )}

                    {selectedBlueprint === 'yard' && (
                      <div className="flex items-center gap-2 px-2 py-1 rounded-lg bg-slate-50 border border-slate-200">
                        <label className="flex items-center gap-1 cursor-pointer font-semibold">
                          <input type="checkbox" checked={bpLayers.piping} onChange={(e) => setBpLayers({ ...bpLayers, piping: e.target.checked })} />
                          Piping
                        </label>
                        <label className="flex items-center gap-1 cursor-pointer font-semibold">
                          <input type="checkbox" checked={bpLayers.power} onChange={(e) => setBpLayers({ ...bpLayers, power: e.target.checked })} />
                          Cabling
                        </label>
                        <label className="flex items-center gap-1 cursor-pointer font-semibold">
                          <input type="checkbox" checked={bpLayers.expansion} onChange={(e) => setBpLayers({ ...bpLayers, expansion: e.target.checked })} />
                          Expansion
                        </label>
                      </div>
                    )}

                    <div className="flex items-center border border-slate-300 rounded-lg overflow-hidden bg-white">
                      <button onClick={() => setBpZoom((z) => Math.max(0.75, Number((z - 0.15).toFixed(2))))} className="px-2.5 py-1 hover:bg-slate-100 font-bold">
                        -
                      </button>
                      <span className="px-2 font-mono font-bold">{Math.round(bpZoom * 100)}%</span>
                      <button onClick={() => setBpZoom((z) => Math.min(1.75, Number((z + 0.15).toFixed(2))))} className="px-2.5 py-1 hover:bg-slate-100 font-bold">
                        +
                      </button>
                      <button onClick={() => setBpZoom(1)} className="px-2 py-1 hover:bg-slate-100 border-l border-slate-200 font-semibold">
                        Reset
                      </button>
                    </div>
                  </div>
                </div>

                <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-3 overflow-auto">
                  <div style={{ transform: `scale(${bpZoom})`, transformOrigin: 'top left', width: bpZoom > 1 ? `${bpZoom * 100}%` : '100%' }}>
                    {selectedBlueprint === 'yard' && renderYardBlueprint('view-yard')}
                    {selectedBlueprint === 'floorplan' && renderContainerFloorPlan('view-fp')}
                    {selectedBlueprint === 'elevation' && renderVerticalCrossSection('view-sec')}
                    {selectedBlueprint === 'isometric' && renderContainerShellIsometric('view-iso')}
                    {selectedBlueprint === 'sld_elec' && renderElectricalSld('view-elec')}
                    {selectedBlueprint === 'sld_cool' && renderCoolingSld('view-cool')}
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
