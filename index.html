                  </div>
                </div>
              )}

              {/* 5. 360° 3D STUDIO */}
              {screen === "studio3d" && (
                <ThreeDStudio project={currentProject} eng={eng} />
              )}

              {/* 6. OUTPUTS, BRANDED .PPTX SLIDE DECK & CAD CENTER */}
              {screen === "outputs" && (
                <div className="space-y-6">
                  <div className="bg-white rounded-xl card-shadow border border-slate-200 p-5 space-y-4">
                    <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-200 pb-4">
                      <div>
                        <h2 className="text-xl font-bold navy-text">Executive Slide Deck (.PPTX), CAD Blueprints & Schedules</h2>
                        <p className="text-xs text-slate-500">Exports native PowerPoint (.PPTX) adhering strictly to Tosh A Black 24pt / Roshna Black 22pt headers, Roboto ≤12pt body, native shapes, native tables & 3.1" blank footer</p>
                      </div>
                      <button onClick={() => exportNativePptxDeck(currentProject, eng, standards, logoDataUrl)} className="touch-btn px-5 py-2.5 rounded-xl coral-bg text-white text-sm font-bold shadow">
                        ⬇ Download Branded Slide Deck (.PPTX)
                      </button>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <button onClick={exportEngineeringBomCsv} className="p-4 rounded-xl border border-slate-200 hover:border-blue-600 text-left bg-slate-50">
                        <div className="text-xs font-bold text-blue-700">CSV SCHEDULE</div>
                        <div className="font-bold navy-text mt-1">Engineering BOM (.CSV)</div>
                      </button>
                      <button onClick={exportCommercialPriceCsv} className="p-4 rounded-xl border border-slate-200 hover:border-blue-600 text-left bg-slate-50">
                        <div className="text-xs font-bold text-emerald-700">COMMERCIAL CSV</div>
                        <div className="font-bold navy-text mt-1">Commercial Price Sheet (.CSV)</div>
                      </button>
                      <button onClick={() => setScreen("studio3d")} className="p-4 rounded-xl border border-slate-200 hover:border-blue-600 text-left bg-slate-50">
                        <div className="text-xs font-bold text-indigo-700">INTERACTIVE 3D</div>
                        <div className="font-bold navy-text mt-1">360° 3D Container / Hall Twin</div>
                      </button>
                    </div>
                  </div>

                  <CadBlueprintViewer project={currentProject} eng={eng} />
                </div>
              )}

              {/* 7. INDIA SUPPLY CHAIN INTELLIGENCE PLACEHOLDER */}
              {screen === "supply_intel" && (
                <div className="bg-white rounded-2xl card-shadow border border-slate-200 p-6 space-y-4 text-xs">
                  <span className="px-2.5 py-1 rounded bg-amber-400 text-slate-950 font-black uppercase">Phase B Roadmap</span>
                  <h2 className="text-2xl font-bold navy-text">India Non-IT Supply Chain & OEM Intelligence Engine</h2>
                  <p className="text-slate-600">Scheduled 6-monthly & on-demand ingestion of Indian OEM UPS, Transformer, CPCB IV+ DG, Pump Skid & CDU price books with N+1 Best-Fit scoring.</p>
                </div>
              )}

              {/* 8. GLOBAL PARAMETERS & MASTER CATALOGS */}
              {screen === "parameters" && (
                <div className="bg-white rounded-xl card-shadow border border-slate-200 overflow-hidden">
                  <div className="navy-bg text-white p-5">
                    <h2 className="text-xl font-bold">Global Parameters & Standard Catalogs</h2>
                    <div className="flex flex-wrap gap-1.5 mt-4">
                      {[
                        ["skus", "1. Rack SKU Library (LPM & ΔP)"],
                        ["containers", "2. Standard & Saved Containers"],
                        ["rates", "3. Master OEM Rate Card & OpEx"],
                        ["branding", "4. Company Logo & Drive OAuth"]
                      ].map(([k, lbl]) => (
                        <button key={k} onClick={() => setParamTab(k)} className={`px-3.5 py-2 rounded-lg text-xs font-bold ${paramTab === k ? "coral-bg text-white" : "bg-white/15 text-slate-200"}`}>
                          {lbl}
                        </button>
                      ))}
                    </div>
                  </div>

                  {paramTab === "skus" && (
                    <div className="p-5 space-y-3 text-xs">
                      <div className="overflow-x-auto border border-slate-200 rounded-xl">
                        <table className="w-full text-left border-collapse">
                          <thead>
                            <tr className="bg-slate-100 border-b border-slate-200">
                              <th className="p-3">Rack SKU</th>
                              <th className="p-3">Peak kW</th>
                              <th className="p-3">Flow (LPM/kW)</th>
                              <th className="p-3">Req ΔP (bar)</th>
                              <th className="p-3">Unit Cost (₹)</th>
                              <th className="p-3">Action</th>
                            </tr>
                          </thead>
                          <tbody>
                            {skus.map((s, idx) => (
                              <tr key={s.id} className="border-b border-slate-200">
                                <td className="p-3 font-bold navy-text">{s.name}</td>
                                <td className="p-3"><input type="number" value={s.peakKw} onChange={e => setSkus(prev => prev.map((x, i) => i === idx ? { ...x, peakKw: Number(e.target.value) } : x))} className="w-20 border rounded px-2 py-1" /></td>
                                <td className="p-3"><input type="number" step="0.05" value={s.flowLpmPerKw} onChange={e => setSkus(prev => prev.map((x, i) => i === idx ? { ...x, flowLpmPerKw: Number(e.target.value) } : x))} className="w-20 border rounded px-2 py-1" /></td>
                                <td className="p-3"><input type="number" step="0.1" value={s.reqDeltaPBar} onChange={e => setSkus(prev => prev.map((x, i) => i === idx ? { ...x, reqDeltaPBar: Number(e.target.value) } : x))} className="w-20 border rounded px-2 py-1" /></td>
                                <td className="p-3"><input type="number" value={s.unitCostInr} onChange={e => setSkus(prev => prev.map((x, i) => i === idx ? { ...x, unitCostInr: Number(e.target.value) } : x))} className="w-28 border rounded px-2 py-1 font-mono" /></td>
                                <td className="p-3 text-slate-400">{s.cduMode} CDU</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {paramTab === "containers" && (
                    <div className="p-5 space-y-3 text-xs">
                      <p className="text-slate-600">Standard and promoted bespoke containers available for future customer deals:</p>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        {containerCatalog.map(c => (
                          <div key={c.id} className="p-4 rounded-xl bg-slate-50 border border-slate-200">
                            <div className="font-bold navy-text text-sm">{c.name}</div>
                            <div className="text-slate-600 mt-1">
                              {(c.lengthMm/1000).toFixed(2)}m L × {(c.widthMm/1000).toFixed(2)}m W × {(c.heightMm/1000).toFixed(2)}m H • {c.metallurgy}
                            </div>
                            <div className="font-mono font-bold text-emerald-700 mt-1">Reference Cost: ₹{c.baseCostInr.toLocaleString("en-IN")} / pod</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {paramTab === "rates" && (
                    <div className="p-5 space-y-4 text-xs">
                      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <div><label className="block font-bold">Grid Tariff (₹/kWh)</label><input type="number" step="0.5" value={standards.gridTariffInrKwh} onChange={e => setStandards(s => ({ ...s, gridTariffInrKwh: Number(e.target.value) }))} className="w-full border rounded px-2 py-1 bg-white mt-1" /></div>
                        <div><label className="block font-bold">Water Tariff (₹/kL)</label><input type="number" value={standards.waterTariffInrKl} onChange={e => setStandards(s => ({ ...s, waterTariffInrKl: Number(e.target.value) }))} className="w-full border rounded px-2 py-1 bg-white mt-1" /></div>
                        <div><label className="block font-bold">Default Margin %</label><input type="number" value={standards.defaultMarginPct} onChange={e => setStandards(s => ({ ...s, defaultMarginPct: Number(e.target.value) }))} className="w-full border rounded px-2 py-1 bg-white mt-1" /></div>
                        <div><label className="block font-bold">Default GST %</label><input type="number" value={standards.defaultGstPct} onChange={e => setStandards(s => ({ ...s, defaultGstPct: Number(e.target.value) }))} className="w-full border rounded px-2 py-1 bg-white mt-1" /></div>
                      </div>
                    </div>
                  )}

                  {paramTab === "branding" && (
                    <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-6 text-sm">
                      <div className="space-y-3 p-4 bg-slate-50 rounded-xl border border-slate-200">
                        <h3 className="font-bold navy-text">Company Logo (Header, PDF & Top-Right of .PPTX Slides)</h3>
                        <input type="file" accept="image/*" onChange={handleLogoUpload} className="block text-xs" />
                        {logoDataUrl && <img src={logoDataUrl} alt="Logo Preview" className="h-12 w-auto object-contain bg-white p-1 rounded border" />}
                      </div>
                      <div className="space-y-3 p-4 bg-slate-50 rounded-xl border border-slate-200">
                        <h3 className="font-bold navy-text">Google Drive OAuth Client ID</h3>
                        <input type="text" value={clientId} onChange={e => setClientId(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs font-mono bg-white" />
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
