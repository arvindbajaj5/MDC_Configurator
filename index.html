    const INITIAL_STANDARDS = {

    const INITIAL_CLIMATES = {

      "Hyderabad / Pune (Dry Deccan)": { peakDryBulb: 42, peakWetBulb: 25.0, monsoonMonths: 3, defaultWater: "Constrained" }
    };

    const makeDefaultProject = (id, name, client, status = "In Review", std = INITIAL_STANDARDS) => ({
      id,
      name,
      client,
      status,
      updatedAt: new Date().toISOString().slice(0, 10),
      archetype: "Sovereign AI Training Factory",
      targetItMw: 15.0,
      currency: "INR",
      marginPct: std.defaultMarginPct,
      contingencyPct: std.defaultContingencyPct,
      gstPct: std.defaultGstPct,
      rackQuantities: {
        "sku-dlc-265": 32,
        "sku-helios": 12,
        "sku-nvl72": 16,
        "sku-rubin144": 0,
        "sku-air-core": 12
      },
      containerLengthMode: "CustomOptimum",
      maxCustomLengthMm: std.defaultCustomMaxLenMm,
      containerHeightMm: std.defaultHeightMm,
      containerWidthMm: std.defaultWidthMm,
      metallurgy: std.defaultMetallurgy,
      wallThicknessMm: std.wallThicknessMm,
      roofThicknessMm: std.roofThicknessMm,
      floorThicknessMm: std.floorThicknessMm,
      plenumHeightMm: std.plenumHeightMm,
      topClearanceMm: std.topClearanceMm,
      hallTopology: "GangedLinear",
      packingStrategy: "MinCapex",
      includeAdminModule: true,
      includeStagingModule: true,
      includeUpsContainer: true,
      includeBatteryContainer: true,
      batteryRuntimeMin: 15,
      batteryChemistry: "LFP",
      includeDgYard: true,
      dgAutonomyHours: 24,
      includeTransformer: true,
      climatePreset: "Mumbai (Coastal Monsoon)",
      waterAvailability: "Constrained",
      airCoolingType: "In-Row",
      uptimeTier: "Tier III",
      regulatoryCode: "India BIS / CEA / CPCB IV+ / PESO / NBC",
      monsoonCanopy: true,
      airlockVestibule: true,
      parcelShape: "IrregularTrapezoid",
      parcelVertices: [
        { x: 0, y: 0 },
        { x: 92, y: 0 },
        { x: 108, y: 64 },
        { x: 14, y: 78 }
      ],
      setbackMeters: 6.0,
      hallRotationDeg: 0,
      rateOverrides: {}
    });

    const INITIAL_PROJECTS = [
      makeDefaultProject("proj-15mw-ai", "15 MW Sovereign AI Cluster — Navi Mumbai", "National HPC Authority", "Proposal Ready"),
      makeDefaultProject("proj-2mw-edge", "2.0 MW Defense Geospatial Edge Pod", "Strategic Command C3", "Draft")
    ];
    INITIAL_PROJECTS[1].targetItMw = 2.0;
    INITIAL_PROJECTS[1].archetype = "Tactical / Defense Edge Pod";
    INITIAL_PROJECTS[1].rackQuantities = { "sku-dlc-265": 8, "sku-helios": 0, "sku-nvl72": 0, "sku-rubin144": 0, "sku-air-core": 4 };
    INITIAL_PROJECTS[1].hallTopology = "Isolated";
    INITIAL_PROJECTS[1].containerLengthMode = "ISO40";

    function computeEngineering(project, skus, rateCard, standards, climates) {
      const skuMap = Object.fromEntries(skus.map(s => [s.id, s]));
      const activeRacks = [];
      let totalPeakKw = 0;
      let totalContKw = 0;
      let totalActualKw = 0;
      let totalLiquidKw = 0;
      let totalAirKw = 0;
      let totalFlowLpm = 0;
      let extCduRequiredKw = 0;

      Object.entries(project.rackQuantities || {}).forEach(([skuId, qty]) => {
        const q = Number(qty) || 0;
        const sku = skuMap[skuId];
        if (!sku || q <= 0) return;
        const contKw = sku.peakKw * sku.continuousFactor;
        const actKw = contKw * sku.operatingUtilFactor;
        const liqKw = contKw * (sku.liquidSplitPct / 100);
        const airKw = contKw - liqKw;
        totalPeakKw += sku.peakKw * q;
        totalContKw += contKw * q;
        totalActualKw += actKw * q;
        totalLiquidKw += liqKw * q;
        totalAirKw += airKw * q;
        totalFlowLpm += liqKw * sku.flowLpmPerKw * q;
        if (sku.cduMode === "External") extCduRequiredKw += liqKw * q;
        for (let i = 0; i < q; i++) {
          activeRacks.push({
            ...sku,
            instanceIndex: i + 1,
            contKw, actKw, liqKw, airKw,
            wetWeightKg: sku.dryWeightKg + sku.coolantWeightKg
          });
        }
      });

      const dlcRacks = activeRacks.filter(r => r.category === "DLC");
      const acRacks = activeRacks.filter(r => r.category === "AC");

      const airlockReserveMm = project.airlockVestibule ? 1400 : 400;
      const wallInsulReserveMm = 400;
      let targetExtLengthMm = standards.iso40LengthMm;
      if (project.containerLengthMode === "ISO20") targetExtLengthMm = standards.iso20LengthMm;
      else if (project.containerLengthMode === "ISO40") targetExtLengthMm = standards.iso40LengthMm;
      else targetExtLengthMm = project.maxCustomLengthMm || standards.defaultCustomMaxLenMm;

      const maxUsableRowMm = Math.max(3600, targetExtLengthMm - airlockReserveMm - wallInsulReserveMm);
      const maxDlcKwPerPod = standards.maxDlcKwPerPod || 2000;
      const maxAcKwPerPod = standards.maxAcKwPerPod || 400;
      const maxPayloadKgPerPod = standards.maxPodPayloadKg || 36000;

      const sortedDlc = [...dlcRacks].sort((a, b) => b.contKw - a.contKw);
      const pods = [];

      const packGroup = (rackList, podKind, maxKwCap) => {
        const localPods = [];
        rackList.forEach(rack => {
          let placed = false;
          for (let p of localPods) {
            if (project.packingStrategy === "Segregated" && p.racks.length > 0 && p.racks[0].id !== rack.id) continue;
            const cduWidthReserve = p.needsExtCdu || rack.cduMode === "External" ? 900 : 0;
            const rowALen = p.rowA.reduce((s, r) => s + r.widthMm + 50, 0);
            const rowBLen = p.rowB.reduce((s, r) => s + r.widthMm + 50, 0);
            const targetRow = rowALen <= rowBLen ? "A" : "B";
            const currentRowLen = targetRow === "A" ? rowALen : rowBLen;
            const nextKw = p.contKw + rack.contKw;
            const nextWt = p.wetWeightKg + rack.wetWeightKg;
            if (currentRowLen + rack.widthMm + cduWidthReserve <= maxUsableRowMm && nextKw <= maxKwCap && nextWt <= maxPayloadKgPerPod) {
              p.racks.push(rack);
              if (targetRow === "A") p.rowA.push(rack);
              else p.rowB.push(rack);
              p.contKw = nextKw;
              p.peakKw += rack.peakKw;
              p.liqKw += rack.liqKw;
              p.airKw += rack.airKw;
              p.wetWeightKg = nextWt;
              if (rack.cduMode === "External") p.needsExtCdu = true;
              placed = true;
              break;
            }
          }
          if (!placed) {
            localPods.push({
              id: `${podKind}-${localPods.length + 1}`,
              kind: podKind,
              racks: [rack],
              rowA: [rack],
              rowB: [],
              contKw: rack.contKw,
              peakKw: rack.peakKw,
              liqKw: rack.liqKw,
              airKw: rack.airKw,
              wetWeightKg: rack.wetWeightKg,
              needsExtCdu: rack.cduMode === "External"
            });
          }
        });

        localPods.forEach((p, idx) => {
          const rowALen = p.rowA.reduce((s, r) => s + r.widthMm + 50, 0);
          const rowBLen = p.rowB.reduce((s, r) => s + r.widthMm + 50, 0);
          const cduBay = p.needsExtCdu ? 950 : 0;
          const usedBayMm = Math.max(rowALen, rowBLen) + cduBay;
          let extLenMm = targetExtLengthMm;
          if (project.containerLengthMode === "CustomOptimum") {
            const rawLen = usedBayMm + airlockReserveMm + wallInsulReserveMm;
            extLenMm = Math.max(6000, Math.ceil(rawLen / 250) * 250);
          }
          const shellAreaSqm = 2 * ((extLenMm / 1000) * (project.containerHeightMm / 1000)) +
                               2 * ((project.containerWidthMm / 1000) * (project.containerHeightMm / 1000)) +
                               2 * ((extLenMm / 1000) * (project.containerWidthMm / 1000));
          const emptyTareKg = Math.round(shellAreaSqm * (project.wallThicknessMm * 7.85 * 1.35) + 2800);
          p.label = `${podKind} Pod #${idx + 1}`;
          p.extLengthMm = extLenMm;
          p.extWidthMm = project.containerWidthMm;
          p.extHeightMm = project.containerHeightMm;
          p.emptyTareKg = emptyTareKg;
          p.grossRiggingKg = emptyTareKg + p.wetWeightKg;
          p.shellAreaSqm = shellAreaSqm;
          p.bayUtilPct = Math.min(100, Math.round((usedBayMm / (extLenMm - airlockReserveMm - wallInsulReserveMm)) * 100));
          pods.push(p);
        });
      };

      packGroup(sortedDlc, "DLC", maxDlcKwPerPod);
      packGroup(acRacks, "AC", maxAcKwPerPod);

      const isGanged = project.hallTopology !== "Isolated";
      const sharedWallSavingsSqm = isGanged && pods.length > 1
        ? (pods.length - 1) * ((pods[0]?.extLengthMm || 12000) / 1000) * (project.containerHeightMm / 1000) * 1.6
        : 0;

      const climate = climates[project.climatePreset] || Object.values(climates)[0];
      let coolingMode = "Adiabatic Spray-Assisted Fluid Coolers";
      let annualWueLPerKwh = 0.28;
      let trimChillerKw = 0;
      if (project.waterAvailability === "Zero") {
        coolingMode = "Zero-Water Dry Coolers + Mechanical Trim Chillers";
        annualWueLPerKwh = 0.0;
        trimChillerKw = Math.round(totalContKw * 0.45);
      } else if (climate.peakWetBulb >= standards.wetBulbSwitchoverC) {
        coolingMode = "Hybrid Adiabatic Coolers + Peak Monsoon Trim Chillers";
        annualWueLPerKwh = 0.35;
        trimChillerKw = Math.round(totalContKw * 0.30);
      } else if (project.waterAvailability === "Abundant") {
        coolingMode = "High-Efficiency Adiabatic Fluid Coolers (Free-Cooling Optimized)";
        annualWueLPerKwh = 0.42;
      }

      const tierMult = project.uptimeTier === "Tier IV" ? 2.0 : project.uptimeTier === "Tier III" ? 1.35 : 1.15;
      const extCduUnits = Math.ceil((extCduRequiredKw / 1350) * tierMult);
      const adiabaticUnits = Math.ceil((totalLiquidKw / 1000) * tierMult);
      const trimChillerUnits = trimChillerKw > 0 ? Math.ceil((trimChillerKw / 500) * tierMult) : 0;
      const roomDehumUnits = Math.max(pods.length, Math.ceil((totalAirKw / 40) * tierMult));

      const pueDesign = Number((1.09 + (trimChillerKw > 0 ? 0.045 : 0.02) + (totalAirKw / Math.max(1, totalContKw)) * 0.14).toFixed(3));
      const totalFacilityPeakKw = Math.round(totalPeakKw * pueDesign);
      const upsContainersCount = project.includeUpsContainer ? Math.max(1, Math.ceil((totalFacilityPeakKw / 1000) * (project.uptimeTier === "Tier IV" ? 2 : 1))) : 0;
      const dodFactor = project.batteryChemistry === "LFP" ? (standards.lfpDoDPct / 100) : (standards.vrlaDoDPct / 100);
      const batteryKwhReq = (totalFacilityPeakKw * (project.batteryRuntimeMin / 60)) / Math.max(0.5, dodFactor);
      const batteryContainersCount = project.includeBatteryContainer ? Math.max(1, Math.ceil(batteryKwhReq / 1200)) : 0;
      const dgUnitsCount = project.includeDgYard ? Math.max(2, Math.ceil((totalFacilityPeakKw / 1200) * tierMult)) : 0;

      const getItemPrice = (key, qty, label, category, specs) => {
        const base = rateCard[key] || { cost: 500000, make: "Standard OEM", model: "GEN-1" };
        const override = project.rateOverrides?.[key];
        const unitCost = override !== undefined && override !== "" ? Number(override) : base.cost;
        const rawCostTotal = unitCost * qty;
        const withContingency = rawCostTotal * (1 + project.contingencyPct / 100);
        const sellingPreTax = withContingency / Math.max(0.05, 1 - project.marginPct / 100);
        const gstAmt = sellingPreTax * (project.gstPct / 100);
        return {
          key, category, label, specs,
          make: base.make, model: base.model,
          qty, stdUnitCost: base.cost, unitCost,
          isOverridden: override !== undefined && override !== "",
          rawCostTotal, withContingency, sellingPreTax, gstAmt,
          grandTotalInclGst: sellingPreTax + gstAmt
        };
      };

      const bomItems = [];
      skus.forEach(sku => {
        const q = Number(project.rackQuantities?.[sku.id]) || 0;
        if (q > 0) {
          const k = `rack_${sku.id}`;
          const ov = project.rateOverrides?.[k];
          const unitCost = ov !== undefined && ov !== "" ? Number(ov) : sku.unitCostInr;
          const rawCostTotal = unitCost * q;
          const withContingency = rawCostTotal * (1 + project.contingencyPct / 100);
          const sellingPreTax = withContingency / Math.max(0.05, 1 - project.marginPct / 100);
          const gstAmt = sellingPreTax * (project.gstPct / 100);
          bomItems.push({
            key: k, category: "IT Compute & Racks", label: sku.name,
            specs: `${sku.peakKw}kW Peak | ${sku.widthMm}x${sku.depthMm}x${sku.heightMm}mm | ${sku.liquidSplitPct}% Liq`,
            make: sku.vendorMake, model: sku.vendorModel,
            qty: q, stdUnitCost: sku.unitCostInr, unitCost,
            isOverridden: ov !== undefined && ov !== "",
            rawCostTotal, withContingency, sellingPreTax, gstAmt,
            grandTotalInclGst: sellingPreTax + gstAmt
          });
        }
      });

      const netShellSqm = Math.max(40, Math.round(pods.reduce((s, p) => s + p.shellAreaSqm, 0) - sharedWallSavingsSqm));
      bomItems.push(getItemPrice("shellPerSqm", netShellSqm, `Custom Modular Enclosures (${pods.length} Pods, ${project.metallurgy})`, "Structural & Shell", `${project.hallTopology} | Wall ${project.wallThicknessMm}mm / Floor ${project.floorThicknessMm}mm`));
      if (extCduUnits > 0) bomItems.push(getItemPrice("extCdu1500Kw", extCduUnits, "External Row/Side-Car Liquid CDUs (FWS-to-TCS)", "Liquid Cooling", `Supports ${Math.round(extCduRequiredKw)} kW external-CDU racks`));
      if (adiabaticUnits > 0) bomItems.push(getItemPrice("adiabaticCooler1Mw", adiabaticUnits, "Yard Adiabatic / Dry Fluid Coolers", "Heat Rejection", `${coolingMode}`));
      if (trimChillerUnits > 0) bomItems.push(getItemPrice("trimChiller500Kw", trimChillerUnits, "Peak Monsoon Mechanical Trim Chillers", "Heat Rejection", `500 kW VFD Air-Cooled Chiller Modules`));
      if (roomDehumUnits > 0) bomItems.push(getItemPrice("roomDehumPac40Kw", roomDehumUnits, `Room Dehumidification & ${project.airCoolingType} Units`, "Air & Room Control", `Handles ${Math.round(totalAirKw)} kW residual radiant & AC load`));

      const totalMeters = pods.reduce((s, p) => s + (p.extLengthMm / 1000) * 2, 0);
      bomItems.push(getItemPrice("buswayPerMeter", Math.round(totalMeters * (project.uptimeTier === "Tier IV" ? 2 : 1.5)), `Overhead Dual A/B Power Busways (${standards.buswayAmperageA}A)`, "Electrical", `${project.uptimeTier} Redundant Overhead Distribution`));
      bomItems.push(getItemPrice("ss316HeaderPerMeter", Math.round(totalMeters * 2.2), "Underfloor SS316L Supply/Return Coolant Headers", "Piping & Headers", `${standards.coolantType} (${Math.round(totalFlowLpm)} LPM)`));

      if (upsContainersCount > 0) bomItems.push(getItemPrice("upsContainer1Mw", upsContainersCount, "Containerized Modular UPS Power Pods", "Power Containers", `${project.uptimeTier} Modular UPS + LV Switchgear`));
      if (batteryContainersCount > 0) bomItems.push(getItemPrice("batteryContainer15Min", batteryContainersCount, `Containerized ${project.batteryChemistry} Battery Pods (${project.batteryRuntimeMin} min)`, "Power Containers", `${Math.round(batteryKwhReq)} kWh + Gas Venting & Suppression`));
      if (dgUnitsCount > 0) bomItems.push(getItemPrice("dgSet1500Kva", dgUnitsCount, "CPCB IV+ Acoustic Diesel Generator Sets + PESO Tank", "Prime/Backup Power", `${dgUnitsCount} x 1500 kVA (${project.dgAutonomyHours}h fuel)`));
      if (project.includeAdminModule) bomItems.push(getItemPrice("adminSparesModule", 1, "Operations NOC, Admin & ESD Spares Workshop Container", "Support Modules", "Operator consoles, diagnostic bench & spare manifolds"));
      if (project.includeStagingModule) bomItems.push(getItemPrice("stagingDockModule", 1, "Staging, Unloading Dock & Nitrogen Leak-Test Bay", "Support Modules", "Hydraulic lift + heavy rack de-crating zone"));

      const plinthSqm = Math.round(pods.length * 65 + (upsContainersCount + batteryContainersCount) * 35 + (project.includeAdminModule ? 45 : 0));
      bomItems.push(getItemPrice("civilPlinthPerSqm", plinthSqm, "Elevated RCC Monsoon Plinths, Trenches & Canopy", "Civil & Site", `${project.regulatoryCode}`));

      const totals = bomItems.reduce((acc, it) => ({
        rawCost: acc.rawCost + it.rawCostTotal,
        contingency: acc.contingency + (it.withContingency - it.rawCostTotal),
        sellingPreTax: acc.sellingPreTax + it.sellingPreTax,
        gst: acc.gst + it.gstAmt,
        grandTotal: acc.grandTotal + it.grandTotalInclGst
      }), { rawCost: 0, contingency: 0, sellingPreTax: 0, gst: 0, grandTotal: 0 });

      const verts = project.parcelVertices || [];
      let area = 0;
      for (let i = 0; i < verts.length; i++) {
        const j = (i + 1) % verts.length;
        area += verts[i].x * verts[j].y - verts[j].x * verts[i].y;
      }
      const grossPlotSqm = Math.abs(area) / 2;
      const netBuildableSqm = Math.max(100, grossPlotSqm * 0.72);
      const requiredFootprintSqm = plinthSqm * 1.45;
      const plotUtilizationPct = Math.min(100, Math.round((requiredFootprintSqm / Math.max(1, netBuildableSqm)) * 100));

      return {
        pods, totalPeakKw, totalContKw, totalActualKw, totalLiquidKw, totalAirKw,
        totalFlowLpm, extCduRequiredKw, coolingMode, annualWueLPerKwh, trimChillerKw,
        pueDesign, totalFacilityPeakKw, upsContainersCount, batteryContainersCount, dgUnitsCount,
        sharedWallSavingsSqm, bomItems, totals,
        grossPlotSqm, netBuildableSqm, requiredFootprintSqm, plotUtilizationPct
      };
    }

    function formatMoney(valInr, currency = "INR", standards = INITIAL_STANDARDS) {
      if (currency === "USD") {
        const v = valInr / (standards.usdRate || 84);
        return "$" + (v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : Math.round(v).toLocaleString("en-US"));
      }
      if (currency === "EUR") {
        const v = valInr / (standards.eurRate || 91);
        return "€" + (v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : Math.round(v).toLocaleString("en-US"));
      }
      if (valInr >= 1e7) return "₹" + (valInr / 1e7).toFixed(2) + " Cr";
      if (valInr >= 1e5) return "₹" + (valInr / 1e5).toFixed(2) + " L";
      return "₹" + Math.round(valInr).toLocaleString("en-IN");
    }

    // 360° 3D Container & Hall Studio Component
    function ThreeDStudio({ project, eng }) {
      const mountRef = useRef(null);
      const [viewScope, setViewScope] = useState("Hall");
      const [selectedPodIdx, setSelectedPodIdx] = useState(0);
      const [isLoadedMode, setIsLoadedMode] = useState(true);
      const [cameraPreset, setCameraPreset] = useState("Iso");
      const [layers, setLayers] = useState({
        shell: true,
        floorTransparent: true,
        plumbing: true,
        buswaysData: true,
        roomCooling: true,
        racks: true,
        supportPods: true
      });

      const cameraRef = useRef(null);
      const controlsRef = useRef(null);

      useEffect(() => {
        const el = mountRef.current;
        if (!el || !window.THREE) return;
        const width = el.clientWidth || 800;
        const height = el.clientHeight || 500;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0B1528);
        scene.fog = new THREE.FogExp2(0x0B1528, 0.008);

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 300);
        camera.position.set(16, 13, 18);
        cameraRef.current = camera;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        el.innerHTML = "";
        el.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.maxPolarAngle = Math.PI * 0.49;
        controlsRef.current = controls;

        scene.add(new THREE.AmbientLight(0xffffff, 0.65));
        const dir = new THREE.DirectionalLight(0xffffff, 0.9);
        dir.position.set(22, 32, 18);
        scene.add(dir);
        const fill = new THREE.DirectionalLight(0x60A5FA, 0.35);
        fill.position.set(-18, 12, -16);
        scene.add(fill);

        scene.add(new THREE.GridHelper(80, 80, 0x1E3A8A, 0x172554));

        const podsToRender = viewScope === "SinglePod"
          ? [eng.pods[selectedPodIdx] || eng.pods[0]].filter(Boolean)
          : eng.pods;

        const isGanged = viewScope === "Hall" && project.hallTopology !== "Isolated";
        const isUShaped = viewScope === "Hall" && project.hallTopology === "GangedUShaped";
        const spacing = isGanged ? 0.08 : 2.6;

        const matWall = new THREE.MeshStandardMaterial({
          color: project.metallurgy.includes("SS316") ? 0x94A3B8 : 0x1E3A8A,
          roughness: 0.45, metalness: 0.65, transparent: true, opacity: 0.24, side: THREE.DoubleSide
        });
        const matFrame = new THREE.MeshStandardMaterial({ color: 0xFF5539, roughness: 0.4, metalness: 0.5 });
        const matPlinth = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
        const matFloor = new THREE.MeshStandardMaterial({
          color: 0x475569, roughness: 0.5, metalness: 0.2,
          transparent: layers.floorTransparent,
          opacity: layers.floorTransparent ? 0.28 : 0.92
        });
        const matSupplyPipe = new THREE.MeshStandardMaterial({ color: 0x0EA5E9, roughness: 0.3, metalness: 0.7 });
        const matReturnPipe = new THREE.MeshStandardMaterial({ color: 0xFF5539, roughness: 0.3, metalness: 0.7 });
        const matBusA = new THREE.MeshStandardMaterial({ color: 0x2563EB, emissive: 0x1D4ED8, emissiveIntensity: 0.2 });
        const matBusB = new THREE.MeshStandardMaterial({ color: 0xF97316, emissive: 0xEA580C, emissiveIntensity: 0.2 });
        const matFiberTray = new THREE.MeshStandardMaterial({ color: 0xFACC15, roughness: 0.4 });
        const matAcUnit = new THREE.MeshStandardMaterial({ color: 0x00B290, roughness: 0.35, metalness: 0.3 });

        const totalSpanW = podsToRender.reduce((acc, p) => acc + p.extWidthMm / 1000 + spacing, -spacing);
        let cursorX = -totalSpanW / 2;

        podsToRender.forEach((pod, pIdx) => {
          const L = pod.extLengthMm / 1000;
          const W = pod.extWidthMm / 1000;
          const H = pod.extHeightMm / 1000;
          const plenumH = project.plenumHeightMm / 1000;
          const plinthH = 0.45;

          const podGroup = new THREE.Group();
          if (isUShaped && podsToRender.length >= 3) {
            if (pIdx === 0) podGroup.position.set(-L * 0.65, 0, 0);
            else if (pIdx === podsToRender.length - 1) podGroup.position.set(L * 0.65, 0, 0);
            else {
              podGroup.rotation.y = Math.PI / 2;
              podGroup.position.set((pIdx - 1) * (W + 0.1), 0, -L * 0.75);
            }
          } else {
            podGroup.position.set(cursorX + W / 2, 0, 0);
            cursorX += W + spacing;
          }

          const plinth = new THREE.Mesh(new THREE.BoxGeometry(W + 0.3, plinthH, L + 0.3), matPlinth);
          plinth.position.y = plinthH / 2;
          podGroup.add(plinth);

          const floorDeck = new THREE.Mesh(new THREE.BoxGeometry(W - 0.15, 0.06, L - 0.15), matFloor);
          floorDeck.position.y = plinthH + plenumH;
          podGroup.add(floorDeck);

          if (layers.shell) {
            const skipLeftWall = isGanged && pIdx > 0 && !isUShaped;
            const skipRightWall = isGanged && pIdx < podsToRender.length - 1 && !isUShaped;

            if (!skipLeftWall) {
              const leftW = new THREE.Mesh(new THREE.BoxGeometry(0.08, H, L), matWall);
              leftW.position.set(-W / 2, plinthH + H / 2, 0);
              podGroup.add(leftW);
            }
            if (!skipRightWall) {
              const rightW = new THREE.Mesh(new THREE.BoxGeometry(0.08, H, L), matWall);
              rightW.position.set(W / 2, plinthH + H / 2, 0);
              podGroup.add(rightW);
            }
            const frontW = new THREE.Mesh(new THREE.BoxGeometry(W, H, 0.08), matWall);
            frontW.position.set(0, plinthH + H / 2, L / 2);
            podGroup.add(frontW);

            const backW = new THREE.Mesh(new THREE.BoxGeometry(W, H, 0.08), matWall);
            backW.position.set(0, plinthH + H / 2, -L / 2);
            podGroup.add(backW);

            [[-W/2, -L/2], [W/2, -L/2], [-W/2, L/2], [W/2, L/2]].forEach(([cx, cz]) => {
              const post = new THREE.Mesh(new THREE.BoxGeometry(0.16, H, 0.16), matFrame);
              post.position.set(cx, plinthH + H / 2, cz);
              podGroup.add(post);
            });

            const supStub = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.55, 16), matSupplyPipe);
            supStub.rotation.x = Math.PI / 2;
            supStub.position.set(-W * 0.28, plinthH + plenumH * 0.55, -L / 2 - 0.25);
            podGroup.add(supStub);

            const retStub = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.55, 16), matReturnPipe);
            retStub.rotation.x = Math.PI / 2;
            retStub.position.set(W * 0.28, plinthH + plenumH * 0.55, -L / 2 - 0.25);
            podGroup.add(retStub);
          }

          if (layers.plumbing) {
            [-W * 0.26, W * 0.26].forEach(rx => {
              const sup = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, L - 0.4, 14), matSupplyPipe);
              sup.rotation.x = Math.PI / 2;
              sup.position.set(rx - 0.1, plinthH + plenumH * 0.45, 0);
              podGroup.add(sup);

              const ret = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, L - 0.4, 14), matReturnPipe);
              ret.rotation.x = Math.PI / 2;
              ret.position.set(rx + 0.1, plinthH + plenumH * 0.65, 0);
              podGroup.add(ret);
            });
          }

          if (layers.buswaysData) {
            const busY = plinthH + H - 0.35;
            [-W * 0.28, W * 0.28].forEach(rx => {
              const busA = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, L - 0.5), matBusA);
              busA.position.set(rx - 0.14, busY, 0);
              podGroup.add(busA);

              const busB = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, L - 0.5), matBusB);
              busB.position.set(rx + 0.14, busY, 0);
              podGroup.add(busB);

              const fiber = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.06, L - 0.5), matFiberTray);
              fiber.position.set(rx, busY - 0.22, 0);
              podGroup.add(fiber);
            });
          }

          if (layers.roomCooling) {
            const acBox = new THREE.Mesh(new THREE.BoxGeometry(1.1, 2.1, 0.65), matAcUnit);
            acBox.position.set(0, plinthH + plenumH + 1.05, -L / 2 + 0.55);
            podGroup.add(acBox);
          }

          if (isLoadedMode && layers.racks) {
            const renderRow = (rowRacks, sideSign) => {
              let zCursor = -L / 2 + 1.2;
              rowRacks.forEach(rk => {
                const rW = rk.widthMm / 1000;
                const rH = rk.heightMm / 1000;
                const rD = rk.depthMm / 1000;
                const rx = sideSign * (W * 0.27);
                const rz = zCursor + rW / 2;

                const spreader = new THREE.Mesh(
                  new THREE.BoxGeometry(rD + 0.12, 0.05, rW + 0.06),
                  new THREE.MeshStandardMaterial({ color: 0xCBD5E1, metalness: 0.8, roughness: 0.3 })
                );
                spreader.position.set(rx, plinthH + plenumH + 0.05, rz);
                podGroup.add(spreader);

                const cabinet = new THREE.Mesh(
                  new THREE.BoxGeometry(rD, rH, rW),
                  new THREE.MeshStandardMaterial({ color: new THREE.Color(rk.color || "#002870"), roughness: 0.35, metalness: 0.45 })
                );
                cabinet.position.set(rx, plinthH + plenumH + 0.08 + rH / 2, rz);
                podGroup.add(cabinet);

                [-rW * 0.35, rW * 0.35].forEach((offsetZ, idxPdu) => {
                  const pdu = new THREE.Mesh(new THREE.BoxGeometry(0.06, rH * 0.88, 0.06), idxPdu === 0 ? matBusA : matBusB);
                  pdu.position.set(rx + sideSign * (rD / 2 + 0.04), plinthH + plenumH + 0.08 + rH / 2, rz + offsetZ);
                  podGroup.add(pdu);
                });

                if (rk.category === "DLC") {
                  const drop = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, plenumH + 0.25, 10), matSupplyPipe);
                  drop.position.set(rx, plinthH + plenumH * 0.55, rz);
                  podGroup.add(drop);
                }
                zCursor += rW + 0.08;
              });
            };

            renderRow(pod.rowA || [], -1);
            renderRow(pod.rowB || [], 1);

            if (pod.needsExtCdu) {
              const extCdu = new THREE.Mesh(
                new THREE.BoxGeometry(1.1, 2.2, 0.9),
                new THREE.MeshStandardMaterial({ color: 0x0284C7, roughness: 0.3, metalness: 0.5 })
              );
              extCdu.position.set(-W * 0.27, plinthH + plenumH + 1.1, L / 2 - 1.1);
              podGroup.add(extCdu);
            }
          }

          scene.add(podGroup);
        });

        if (viewScope === "Hall" && layers.supportPods) {
          const baseZ = (podsToRender[0]?.extLengthMm || 12000) / 2000 + 4.5;
          const addSupportBox = (x, z, w, h, l, col) => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, l), new THREE.MeshStandardMaterial({ color: col, roughness: 0.45, metalness: 0.35 }));
            m.position.set(x, h / 2 + 0.2, z);
            scene.add(m);
          };
          if (project.includeStagingModule) addSupportBox(-6, baseZ, 4.2, 3.6, 8.0, 0xD97706);
          if (project.includeAdminModule) addSupportBox(0, baseZ, 3.2, 3.2, 12.19, 0x0D9488);
          if (project.includeUpsContainer) addSupportBox(6, baseZ, 3.0, 3.2, 12.19, 0x4F46E5);
          if (project.includeBatteryContainer) addSupportBox(10.5, baseZ, 3.0, 3.2, 12.19, 0xDC2626);
        }

        let animId;
        const animate = () => {
          animId = requestAnimationFrame(animate);
          controls.update();
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(animId);
          renderer.dispose();
        };
      }, [project, eng, viewScope, selectedPodIdx, isLoadedMode, layers]);

      const applyPreset = (preset) => {
        setCameraPreset(preset);
        const cam = cameraRef.current;
        const ctrl = controlsRef.current;
        if (!cam || !ctrl) return;
        ctrl.target.set(0, 2, 0);
        if (preset === "Iso") cam.position.set(16, 13, 18);
        else if (preset === "Top") cam.position.set(0, 26, 0.1);
        else if (preset === "Aisle") cam.position.set(0, 2.4, 11);
        else if (preset === "Plenum") {
          setLayers(l => ({ ...l, floorTransparent: true }));
          cam.position.set(6, 1.3, 9);
          ctrl.target.set(0, 0.8, 0);
        } else if (preset === "Rear") cam.position.set(-12, 5, -14);
        ctrl.update();
      };

      const toggleLayer = (k) => setLayers(prev => ({ ...prev, [k]: !prev[k] }));

      return (
        <div className="bg-white rounded-xl card-shadow border border-slate-200 overflow-hidden">
          <div className="navy-bg text-white p-4 flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 className="text-lg font-bold">Interactive 360° 3D Container & Hall Studio</h2>
              <p className="text-xs text-slate-300">Drag to orbit 360° • Pinch/Scroll to zoom • Right-drag to pan • Inspect Empty Shell vs. Loaded 2-Row MEP</p>
            </div>
            <div className="flex flex-wrap gap-2">
              <div className="bg-slate-900/60 p-1 rounded-lg flex">
                <button onClick={() => setViewScope("Hall")} className={`px-3 py-1.5 rounded text-xs font-bold ${viewScope === "Hall" ? "coral-bg text-white" : "text-slate-300"}`}>
                  Full Hall ({eng.pods.length} Pods)
                </button>
                <button onClick={() => setViewScope("SinglePod")} className={`px-3 py-1.5 rounded text-xs font-bold ${viewScope === "SinglePod" ? "coral-bg text-white" : "text-slate-300"}`}>
                  Single Container
                </button>
              </div>
              {viewScope === "SinglePod" && (
                <select value={selectedPodIdx} onChange={e => setSelectedPodIdx(Number(e.target.value))} className="bg-slate-800 text-white text-xs rounded-lg px-2.5 py-1.5 border border-slate-600">
                  {eng.pods.map((p, idx) => (
                    <option key={p.id} value={idx}>{p.label} ({Math.round(p.contKw)} kW | {(p.extLengthMm/1000).toFixed(2)}m)</option>
                  ))}
                </select>
              )}
              <div className="bg-slate-900/60 p-1 rounded-lg flex">
                <button onClick={() => setIsLoadedMode(false)} className={`px-3 py-1.5 rounded text-xs font-bold ${!isLoadedMode ? "bg-amber-500 text-slate-950" : "text-slate-300"}`}>
                  Empty Shell
                </button>
                <button onClick={() => setIsLoadedMode(true)} className={`px-3 py-1.5 rounded text-xs font-bold ${isLoadedMode ? "bg-emerald-500 text-slate-950" : "text-slate-300"}`}>
                  Loaded Cluster
                </button>
              </div>
            </div>
          </div>

          <div className="bg-slate-100 px-4 py-2.5 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2 text-xs">
            <div className="flex flex-wrap items-center gap-1.5">
              <span className="font-bold text-slate-600 mr-1">Camera:</span>
              {["Iso", "Top", "Aisle", "Plenum", "Rear"].map(pr => (
                <button key={pr} onClick={() => applyPreset(pr)} className={`px-2.5 py-1 rounded font-medium ${cameraPreset === pr ? "navy-bg text-white" : "bg-white border border-slate-300 text-slate-700"}`}>
                  {pr === "Plenum" ? "Underfloor Plenum" : pr}
                </button>
              ))}
            </div>
            <div className="flex flex-wrap items-center gap-1.5">
              <span className="font-bold text-slate-600 mr-1">MEP Layers:</span>
              {[
                ["shell", "Shell & Bulkheads"],
                ["floorTransparent", "Glass Raised Floor"],
                ["plumbing", "Underfloor SS316"],
                ["buswaysData", "Busways & Fiber"],
                ["roomCooling", "Room AC/Dehum"],
                ["racks", "Racks & rPDUs"],
                ["supportPods", "Admin/UPS/BESS"]
              ].map(([k, lbl]) => (
                <button key={k} onClick={() => toggleLayer(k)} className={`px-2 py-1 rounded font-medium border ${layers[k] ? "bg-blue-50 border-blue-500 text-blue-900" : "bg-white border-slate-300 text-slate-400"}`}>
                  {layers[k] ? "✓ " : ""}{lbl}
                </button>
              ))}
            </div>
          </div>

          <div ref={mountRef} className="w-full h-[490px] bg-slate-950 cursor-grab active:cursor-grabbing" />

          <div className="bg-slate-900 text-slate-200 px-4 py-2.5 text-xs flex flex-wrap items-center justify-between gap-3">
            <div className="flex flex-wrap items-center gap-4">
              <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm inline-block bg-sky-500"></span> Supply Coolant (SS316L)</span>
              <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm inline-block coral-bg"></span> Return Coolant / ISO Frame</span>
              <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm inline-block bg-blue-600"></span> Busway / rPDU Feed A</span>
              <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm inline-block bg-orange-500"></span> Busway / rPDU Feed B</span>
              <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm inline-block bg-yellow-400"></span> Overhead Data Fiber Tray</span>
              <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-sm inline-block bg-emerald-500"></span> Room Dehum / PAC</span>
            </div>
            <div className="font-mono text-slate-400">
              Topology: {project.hallTopology} • Pods: {eng.pods.length} • Max Gross Pod Wt: {Math.max(...eng.pods.map(p => p.grossRiggingKg), 0).toLocaleString()} kg
            </div>
          </div>
        </div>
      );
    }

    // Irregular Land Parcel & Auto-Layout Component
    function ParcelLayoutPlanner({ project, eng, onUpdateProject }) {
      const [statusMsg, setStatusMsg] = useState("");
      const verts = project.parcelVertices || [];
      const minX = Math.min(...verts.map(v => v.x), 0);
      const maxX = Math.max(...verts.map(v => v.x), 100);
      const minY = Math.min(...verts.map(v => v.y), 0);
      const maxY = Math.max(...verts.map(v => v.y), 80);
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;

      const loadPresetShape = (shape) => {
        if (shape === "IrregularTrapezoid") {
          onUpdateProject({ parcelShape: shape, parcelVertices: [{ x: 0, y: 0 }, { x: 92, y: 0 }, { x: 108, y: 64 }, { x: 14, y: 78 }] });
        } else if (shape === "LShaped") {
          onUpdateProject({ parcelShape: shape, parcelVertices: [{ x: 0, y: 0 }, { x: 110, y: 0 }, { x: 110, y: 42 }, { x: 56, y: 42 }, { x: 56, y: 85 }, { x: 0, y: 85 }] });
        } else if (shape === "PentagonPlot") {
          onUpdateProject({ parcelShape: shape, parcelVertices: [{ x: 10, y: 0 }, { x: 95, y: 5 }, { x: 115, y: 48 }, { x: 62, y: 86 }, { x: 0, y: 55 }] });
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const txt = ev.target.result;
          try {
            if (file.name.endsWith(".json") || file.name.endsWith(".geojson")) {
              const gj = JSON.parse(txt);
              const coords = gj.features?.[0]?.geometry?.coordinates?.[0] || gj.geometry?.coordinates?.[0];
              if (coords && coords.length >= 3) {
                const lon0 = coords[0][0], lat0 = coords[0][1];
                const pts = coords.slice(0, -1).map(([lon, lat]) => ({
                  x: Math.round((lon - lon0) * 111320 * Math.cos(lat0 * Math.PI / 180)),
                  y: Math.round((lat - lat0) * 110540)
                }));
                const offX = Math.min(...pts.map(p => p.x));
                const offY = Math.min(...pts.map(p => p.y));
                onUpdateProject({ parcelShape: "CustomGeoJSON", parcelVertices: pts.map(p => ({ x: p.x - offX, y: p.y - offY })) });
                setStatusMsg(`Imported ${pts.length} survey vertices from ${file.name}`);
              }
            } else if (file.name.endsWith(".kml")) {
              const match = txt.match(/<coordinates>([\s\S]*?)<\/coordinates>/i);
              if (match) {
                const rawPts = match[1].trim().split(/\s+/).map(pair => pair.split(",").map(Number));
                const lon0 = rawPts[0][0], lat0 = rawPts[0][1];
                const pts = rawPts.slice(0, -1).map(([lon, lat]) => ({
                  x: Math.round((lon - lon0) * 111320 * Math.cos(lat0 * Math.PI / 180)),
                  y: Math.round((lat - lat0) * 110540)
                }));
                const offX = Math.min(...pts.map(p => p.x));
                const offY = Math.min(...pts.map(p => p.y));
                onUpdateProject({ parcelShape: "CustomKML", parcelVertices: pts.map(p => ({ x: p.x - offX, y: p.y - offY })) });
                setStatusMsg(`Imported ${pts.length} vertices from KML survey`);
              }
            }
          } catch (err) {
            setStatusMsg("Could not parse KML/GeoJSON coordinates.");
          }
        };
        reader.readAsText(file);
      };

      const polyStr = verts.map(v => `${v.x},${v.y}`).join(" ");

      return (
        <div className="bg-white rounded-xl card-shadow border border-slate-200 p-5 space-y-4">
          <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 pb-3">
            <div>
              <h3 className="text-lg font-bold navy-text">Irregular Land Parcel & Geomap Auto-Layout Solver</h3>
              <p className="text-xs text-slate-500">Trace or import survey boundaries (.KML / .GeoJSON), apply statutory fire setbacks, and auto-orient modular blocks</p>
            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={() => loadPresetShape("IrregularTrapezoid")} className="px-3 py-1.5 text-xs font-bold rounded border border-slate-300 hover:bg-slate-50">Trapezoid Plot</button>
              <button onClick={() => loadPresetShape("LShaped")} className="px-3 py-1.5 text-xs font-bold rounded border border-slate-300 hover:bg-slate-50">L-Shaped Plot</button>
              <button onClick={() => loadPresetShape("PentagonPlot")} className="px-3 py-1.5 text-xs font-bold rounded border border-slate-300 hover:bg-slate-50">5-Sided Polygon</button>
              <label className="px-3 py-1.5 text-xs font-bold rounded navy-bg text-white cursor-pointer">
                Import .KML / .GeoJSON
                <input type="file" accept=".kml,.json,.geojson" onChange={handleFileUpload} className="hidden" />
              </label>
            </div>
          </div>

          {statusMsg && <div className="text-xs bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-2 rounded">{statusMsg}</div>}

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
            <div className="space-y-3 text-xs">
              <div className="p-3 bg-slate-50 rounded-lg border border-slate-200 space-y-2">
                <div className="font-bold navy-text uppercase">Parcel Metrics & Fit Analysis</div>
                <div className="flex justify-between"><span>Gross Survey Area:</span><span className="font-bold">{Math.round(eng.grossPlotSqm).toLocaleString()} m² ({(eng.grossPlotSqm / 4046.86).toFixed(2)} acres)</span></div>
                <div className="flex justify-between"><span>Net Buildable Zone (After {project.setbackMeters}m Fire Lane):</span><span className="font-bold">{Math.round(eng.netBuildableSqm).toLocaleString()} m²</span></div>
                <div className="flex justify-between"><span>Required Campus Footprint:</span><span className="font-bold">{Math.round(eng.requiredFootprintSqm).toLocaleString()} m²</span></div>
                <div className="flex justify-between items-center pt-1 border-t border-slate-200">
                  <span>Plot Utilization:</span>
                  <span className={`px-2 py-0.5 rounded font-bold ${eng.plotUtilizationPct > 90 ? "bg-red-100 text-red-800" : "bg-emerald-100 text-emerald-800"}`}>
                    {eng.plotUtilizationPct}% ({eng.plotUtilizationPct <= 70 ? "+50% Expansion Fits" : "Optimal Fit"})
                  </span>
                </div>
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Cluster Orientation Angle ({project.hallRotationDeg}°)</label>
                <input type="range" min="-90" max="90" value={project.hallRotationDeg} onChange={e => onUpdateProject({ hallRotationDeg: Number(e.target.value) })} className="w-full" />
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Perimeter Fire-Tender Setback (m)</label>
                <input type="number" step="0.5" value={project.setbackMeters} onChange={e => onUpdateProject({ setbackMeters: Number(e.target.value) })} className="w-full border border-slate-300 rounded px-2.5 py-1.5" />
              </div>

              <div className="p-3 bg-blue-50/70 rounded-lg border border-blue-200">
                <div className="font-bold navy-text mb-1">Boundary Corner Coordinates (Meters)</div>
                <div className="space-y-1 max-h-36 overflow-y-auto">
                  {verts.map((v, idx) => (
                    <div key={idx} className="flex items-center gap-2">
                      <span className="w-12 font-mono text-slate-500">Pt {idx + 1}:</span>
                      <input type="number" value={v.x} onChange={e => {
                        const nv = [...verts]; nv[idx] = { ...v, x: Number(e.target.value) };
                        onUpdateProject({ parcelVertices: nv });
                      }} className="w-16 border border-slate-300 rounded px-1.5 py-0.5 bg-white" />
                      <input type="number" value={v.y} onChange={e => {
                        const nv = [...verts]; nv[idx] = { ...v, y: Number(e.target.value) };
                        onUpdateProject({ parcelVertices: nv });
                      }} className="w-16 border border-slate-300 rounded px-1.5 py-0.5 bg-white" />
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="lg:col-span-2 bg-slate-950 rounded-xl p-3 border border-slate-800 flex flex-col items-center justify-center">
              <svg viewBox={`${minX - 12} ${minY - 12} ${maxX - minX + 24} ${maxY - minY + 24}`} className="w-full h-[360px]">
                <defs>
                  <pattern id="siteGrid" width="10" height="10" patternUnits="userSpaceOnUse">
                    <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#1E293B" strokeWidth="0.3" />
                  </pattern>
                </defs>
                <rect x={minX - 12} y={minY - 12} width={maxX - minX + 24} height={maxY - minY + 24} fill="url(#siteGrid)" />
                <polygon points={polyStr} fill="rgba(14, 165, 233, 0.10)" stroke="#38BDF8" strokeWidth="0.8" />
                <polygon points={polyStr} transform={`translate(${cx},${cy}) scale(0.86) translate(${-cx},${-cy})`} fill="rgba(16, 185, 129, 0.08)" stroke="#10B981" strokeWidth="0.5" strokeDasharray="1.5,1" />
                {verts.length >= 2 && (
                  <g>
                    <line x1={verts[0].x} y1={verts[0].y} x2={verts[1].x} y2={verts[1].y} stroke="#FF5539" strokeWidth="1.4" />
                    <text x={(verts[0].x + verts[1].x)/2} y={verts[0].y - 2.5} fill="#FF5539" fontSize="3.2" fontWeight="bold" textAnchor="middle">
                      MAIN ROAD FRONTAGE & HEAVY CRANE GATE
                    </text>
                  </g>
                )}

                <g transform={`translate(${cx}, ${cy}) rotate(${project.hallRotationDeg})`}>
                  {eng.pods.slice(0, 8).map((p, idx) => {
                    const pw = p.extWidthMm / 1000;
                    const pl = p.extLengthMm / 1000;
                    const step = project.hallTopology === "Isolated" ? pw + 2.4 : pw + 0.15;
                    const xPos = -((Math.min(eng.pods.length, 8) * step) / 2) + idx * step;
                    return (
                      <g key={p.id}>
                        <rect x={xPos} y={-pl / 2} width={pw} height={pl} fill="#002870" stroke="#60A5FA" strokeWidth="0.35" />
                        <text x={xPos + pw/2} y={0} fill="#FFFFFF" fontSize="1.8" textAnchor="middle" transform={`rotate(-90, ${xPos + pw/2}, 0)`}>
                          {p.label} ({Math.round(p.contKw)}kW)
                        </text>
                      </g>
                    );
                  })}
                  {project.includeStagingModule && (
                    <g>
                      <rect x={-18} y={-22} width={9} height={5} fill="#D97706" stroke="#FCD34D" strokeWidth="0.3" />
                      <text x={-13.5} y={-19} fill="#FFF" fontSize="1.8" textAnchor="middle">STAGING DOCK</text>
                    </g>
                  )}
                  {project.includeAdminModule && (
                    <g>
                      <rect x={-6} y={-22} width={12.2} height={3.5} fill="#0D9488" stroke="#5EEAD4" strokeWidth="0.3" />
                      <text x={0} y={-19.8} fill="#FFF" fontSize="1.8" textAnchor="middle">ADMIN / NOC & SPARES</text>
                    </g>
                  )}
                  {project.includeUpsContainer && (
                    <g>
                      <rect x={-18} y={12} width={12.2} height={3.2} fill="#4F46E5" stroke="#A5B4FC" strokeWidth="0.3" />
                      <text x={-11.9} y={14} fill="#FFF" fontSize="1.7" textAnchor="middle">UPS PODS ({eng.upsContainersCount})</text>
                    </g>
                  )}
                  {project.includeBatteryContainer && (
                    <g>
                      <rect x={-4} y={12} width={12.2} height={3.2} fill="#DC2626" stroke="#FCA5A5" strokeWidth="0.3" />
                      <text x={2.1} y={14} fill="#FFF" fontSize="1.7" textAnchor="middle">BESS PODS ({eng.batteryContainersCount})</text>
                    </g>
                  )}
                  <g>
                    <rect x={10} y={12} width={14} height={5.5} fill="#0284C7" stroke="#7DD3FC" strokeWidth="0.3" />
                    <text x={17} y={15.2} fill="#FFF" fontSize="1.8" textAnchor="middle">ADIABATIC / CHILLER YARD</text>
                  </g>
                </g>
              </svg>
            </div>
          </div>
        </div>
      );
    }

                    [825, "2-ROW DLC RACK LOOPS", `${eng.pods.length} Modular Pods`]
                  ].map(([x, title, sub], idx) => (
                    <g key={idx} transform={`translate(${x}, 210)`}>
                      <rect x="0" y="0" width="195" height="110" fill={paperMode ? "#F8FAFC" : "#102A56"} stroke="#38BDF8" strokeWidth="2" />

                      <text x="97" y="72" fill={fg} fontSize="10" textAnchor="middle">{sub}</text>
                      {idx < 3 && <line x1="195" y1="55" x2="245" y2="55" stroke="#38BDF8" strokeWidth="3" />}
                    </g>
                  ))}
                </g>
              )}
            </svg>
          </div>
        </div>
      );
    }

    function App() {
      const [screen, setScreen] = useState("home"); // "home" | "projects" | "wizard" | "workspace" | "studio3d" | "outputs" | "parameters"
      const [projects, setProjects] = useState(INITIAL_PROJECTS);
      const [editingId, setEditingId] = useState(INITIAL_PROJECTS[0].id);
      const [skus, setSkus] = useState(INITIAL_SKUS);
      const [rateCard, setRateCard] = useState(DEFAULT_RATE_CARD);
      const [standards, setStandards] = useState(INITIAL_STANDARDS);
      const [climates, setClimates] = useState(INITIAL_CLIMATES);
      const [logoDataUrl, setLogoDataUrl] = useState("");
      const [clientId, setClientId] = useState(DEFAULT_CLIENT_ID);
      const [driveToken, setDriveToken] = useState("");
      const [driveStatus, setDriveStatus] = useState("Local Ready");

      const [wizardTab, setWizardTab] = useState(0);
      const [wizardMode, setWizardMode] = useState("create"); // "create" | "edit"
      const [paramTab, setParamTab] = useState("skus");
      const [editingSkuId, setEditingSkuId] = useState(null);
      const [selectedCadSheet, setSelectedCadSheet] = useState("A-101");

      useEffect(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.projects?.length) setProjects(parsed.projects);
            if (parsed.editingId) setEditingId(parsed.editingId);
            if (parsed.skus?.length) setSkus(parsed.skus);
            if (parsed.rateCard) setRateCard(parsed.rateCard);
            if (parsed.standards) setStandards({ ...INITIAL_STANDARDS, ...parsed.standards });
            if (parsed.climates) setClimates(parsed.climates);
            if (parsed.logoDataUrl) setLogoDataUrl(parsed.logoDataUrl);
            if (parsed.clientId) setClientId(parsed.clientId);
          }
        } catch (e) {}
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ projects, editingId, skus, rateCard, standards, climates, logoDataUrl, clientId }));
        } catch (e) {}
      }, [projects, editingId, skus, rateCard, standards, climates, logoDataUrl, clientId]);

      const currentProject = useMemo(
        () => projects.find(p => p.id === editingId) || projects[0],
        [projects, editingId]
      );

      const eng = useMemo(
        () => computeEngineering(currentProject, skus, rateCard, standards, climates),
        [currentProject, skus, rateCard, standards, climates]
      );

      const updateCurrentProject = (patch) => {
        setProjects(prev => prev.map(p => p.id === currentProject.id ? { ...p, ...patch, updatedAt: new Date().toISOString().slice(0, 10) } : p));
      };

      const handleGoogleSignIn = () => {
        if (!window.google?.accounts?.oauth2) {
          alert("Google Identity script still loading. Please try again in 2 seconds.");
          return;
        }
        const tokenClient = window.google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: DRIVE_SCOPE,
          callback: (resp) => {
            if (resp.access_token) {
              setDriveToken(resp.access_token);
              setDriveStatus("Google Drive Connected");
            }
          }
        });
        tokenClient.requestAccessToken();
      };

      const saveToGoogleDrive = async () => {
        if (!driveToken) {
          handleGoogleSignIn();
          return;
        }
        setDriveStatus("Syncing...");
        try {
          const payload = JSON.stringify({ projects, skus, rateCard, standards, exportedAt: new Date().toISOString() }, null, 2);
          const metadata = { name: `AI_MDC_Projects_Backup.json`, mimeType: "application/json" };
          const form = new FormData();
          form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
          form.append("file", new Blob([payload], { type: "application/json" }));
          const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
            method: "POST",
            headers: { Authorization: `Bearer ${driveToken}` },
            body: form
          });
          if (res.ok) setDriveStatus("Saved to Drive ✓");
          else setDriveStatus("Drive Auth Expired — Reconnect");
        } catch (e) {
          setDriveStatus("Drive Sync Error");
        }
      };

      const startNewProjectWizard = () => {
        const newId = "proj-" + Date.now();
        const np = makeDefaultProject(newId, `AI MDC Proposal #${projects.length + 1}`, "Enterprise Client", "Draft", standards);
        setProjects(prev => [np, ...prev]);
        setEditingId(newId);
        setWizardMode("create");
        setWizardTab(0);
        setScreen("wizard");
      };

      const reRunWizardForCurrent = () => {
        setWizardMode("edit");
        setWizardTab(0);
        setScreen("wizard");
      };

      const autoBalanceRacksFromTargetMw = () => {
        const targetKw = (Number(currentProject.targetItMw) || 2.0) * 1000;
        const primaryDlc = skus.find(s => s.id === "sku-dlc-265") || skus.find(s => s.category === "DLC");
        const secondaryDlc = skus.find(s => s.id === "sku-helios");
        const acSku = skus.find(s => s.category === "AC");
        const nextQty = {};
        skus.forEach(s => nextQty[s.id] = 0);

        if (primaryDlc) {
          const dlcShareKw = targetKw * 0.94;
          const pKw = primaryDlc.peakKw * primaryDlc.continuousFactor;
          if (secondaryDlc && targetKw >= 6000) {
            nextQty[primaryDlc.id] = Math.max(1, Math.round((dlcShareKw * 0.68) / pKw));
            const sKw = secondaryDlc.peakKw * secondaryDlc.continuousFactor;
            nextQty[secondaryDlc.id] = Math.max(1, Math.round((dlcShareKw * 0.32) / sKw));
          } else {
            nextQty[primaryDlc.id] = Math.max(1, Math.round(dlcShareKw / pKw));
          }
        }
        if (acSku) {
          const acShareKw = Math.max(50, targetKw * 0.06);
          const aKw = acSku.peakKw * acSku.continuousFactor;
          nextQty[acSku.id] = Math.max(2, Math.round(acShareKw / aKw));
        }
        updateCurrentProject({ rackQuantities: nextQty });
      };

      const downloadCsv = (filename, rows) => {
        const csv = rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
      };

      const exportEngineeringBomCsv = () => {
        const header = ["Category", "Subsystem / Item", "Make", "Model", "Technical Specifications", "Qty"];
        const rows = eng.bomItems.map(it => [it.category, it.label, it.make, it.model, it.specs, it.qty]);
        downloadCsv(`${currentProject.name.replace(/\s+/g, "_")}_Engineering_BOM.csv`, [header, ...rows]);
      };

      const exportCommercialPriceCsv = () => {
        const header = [
          "Category", "Item Description", "Make", "Model", "Qty",
          "Unit Cost", "Contingency (%)", "Margin (%)",
          "Unit Selling Price", "Pre-Tax Total", `GST (${currentProject.gstPct}%)`, "Grand Total Incl. GST"
        ];
        const rows = eng.bomItems.map(it => [
          it.category, it.label, it.make, it.model, it.qty,
          Math.round(it.unitCost), currentProject.contingencyPct, currentProject.marginPct,
          Math.round(it.sellingPreTax / Math.max(1, it.qty)),
          Math.round(it.sellingPreTax), Math.round(it.gstAmt), Math.round(it.grandTotalInclGst)
        ]);
        rows.push([
          "TOTAL", "COMPLETE TURNKEY AI MODULAR DATA CENTER", "", "", "",
          Math.round(eng.totals.rawCost), currentProject.contingencyPct, currentProject.marginPct, "",
          Math.round(eng.totals.sellingPreTax), Math.round(eng.totals.gst), Math.round(eng.totals.grandTotal)
        ]);
        downloadCsv(`${currentProject.name.replace(/\s+/g, "_")}_Commercial_Price_Sheet.csv`, [header, ...rows]);
      };

      const exportFullPackPdf = () => {
        if (!window.jspdf) return;
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a3" });

        doc.setFillColor(0, 40, 112);
        doc.rect(0, 0, 420, 34, "F");
        if (logoDataUrl) {
          try { doc.addImage(logoDataUrl, "PNG", 12, 5, 36, 22); } catch (e) {}
        }
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(18);
        doc.text("AI MODULAR DATA CENTER — ENGINEERING & COMMERCIAL PACK", logoDataUrl ? 56 : 16, 16);
        doc.setFontSize(10);
        doc.text(`Project: ${currentProject.name}  |  Client: ${currentProject.client}  |  Uptime: ${currentProject.uptimeTier}`, logoDataUrl ? 56 : 16, 25);

        doc.setTextColor(15, 23, 42);
        doc.setFontSize(11);
        let y = 46;
        const kpis = [
          `Design IT Load: ${Math.round(eng.totalContKw)} kW (${(eng.totalContKw/1000).toFixed(2)} MW)`,
          `Container Pods: ${eng.pods.length} (${currentProject.hallTopology})`,
          `Design PUE: ${eng.pueDesign} | Cooling: ${eng.coolingMode}`,
          `Pre-Tax Quote: ${formatMoney(eng.totals.sellingPreTax, currentProject.currency, standards)} | Incl. GST: ${formatMoney(eng.totals.grandTotal, currentProject.currency, standards)}`
        ];
        kpis.forEach((line, i) => doc.text(line, 16, y + i * 7));

        y = 82;
        doc.setFillColor(241, 245, 249);
        doc.rect(16, y - 5, 388, 8, "F");
        doc.setFontSize(9);
        doc.text("Item / Subsystem", 18, y);
        doc.text("Make & Model", 145, y);
        doc.text("Qty", 235, y);
        doc.text("Selling Pre-Tax", 275, y);
        doc.text("Grand Total Incl. GST", 345, y);

        y += 8;
        eng.bomItems.forEach(it => {
          if (y > 275) { doc.addPage(); y = 24; }
          doc.text(it.label.slice(0, 58), 18, y);
          doc.text(`${it.make} (${it.model})`.slice(0, 38), 145, y);
          doc.text(String(it.qty), 235, y);
          doc.text(formatMoney(it.sellingPreTax, currentProject.currency, standards), 275, y);
          doc.text(formatMoney(it.grandTotalInclGst, currentProject.currency, standards), 345, y);
          y += 7;
        });

        doc.save(`${currentProject.name.replace(/\s+/g, "_")}_Full_A3_Pack.pdf`);

        <div className="h-screen flex flex-col overflow-hidden">

                <div>

              {/* Persistent Active Deal Switcher & Global Actions */}
              <div className="flex flex-wrap items-center gap-2">
                <div className="flex items-center bg-slate-900/80 border border-slate-700 rounded-lg px-2.5 py-1 text-xs">
                  <span className="text-slate-400 mr-1.5 hidden md:inline">Currently Editing:</span>
                  <select
                    value={editingId}
                    onChange={e => setEditingId(e.target.value)}

                  >

                      <div>

                      <div>
                        <span className="inline-block px-2.5 py-1 rounded-md text-xs font-bold bg-blue-100 navy-text mb-3">02 • MULTI-DEAL PORTFOLIO</span>
                        <h2 className="text-xl font-bold navy-text">Open & Manage Projects</h2>

                      </div>
                      <div className="text-xs font-bold navy-text mt-4">{projects.length} Saved Configurations →</div>

                    <div onClick={() => setScreen("workspace")} className="cursor-pointer bg-white rounded-2xl p-6 card-shadow border border-slate-200 hover:border-blue-600 transition flex flex-col justify-between min-h-[190px]">
                      <div>
                        <span className="inline-block px-2.5 py-1 rounded-md text-xs font-bold bg-emerald-100 text-emerald-900 mb-3">03 • OPTIMIZER & PRICING</span>
                        <h2 className="text-xl font-bold navy-text">Cluster Optimizer, Parcel & Costing</h2>

                    <div onClick={() => setScreen("studio3d")} className="cursor-pointer bg-white rounded-2xl p-6 card-shadow border border-slate-200 hover:border-blue-600 transition flex flex-col justify-between min-h-[190px]">
                      <div>

                        <div className="font-bold navy-text uppercase">Shell Envelope Dimensions (mm)</div>
                        <div><label className="block text-slate-600 mb-1">20 ft ISO Marine Standard Length (mm)</label><input type="number" value={standards.iso20LengthMm} onChange={e => setStandards(s => ({ ...s, iso20LengthMm: Number(e.target.value) }))} className="w-full border rounded px-2.5 py-1.5 bg-white" /></div>
                        <div><label className="block text-slate-600 mb-1">40 ft ISO Marine Standard Length (mm)</label><input type="number" value={standards.iso40LengthMm} onChange={e => setStandards(s => ({ ...s, iso40LengthMm: Number(e.target.value) }))} className="w-full border rounded px-2.5 py-1.5 bg-white" /></div>
                        <div><label className="block text-slate-600 mb-1">Default Custom Transport Max Length (mm)</label><input type="number" value={standards.defaultCustomMaxLenMm} onChange={e => setStandards(s => ({ ...s, defaultCustomMaxLenMm: Number(e.target.value) }))} className="w-full border rounded px-2.5 py-1.5 bg-white" /></div>
                        <div className="grid grid-cols-2 gap-2">
                          <div><label className="block text-slate-600 mb-1">Default Height (mm)</label><input type="number" value={standards.defaultHeightMm} onChange={e => setStandards(s => ({ ...s, defaultHeightMm: Number(e.target.value) }))} className="w-full border rounded px-2 py-1.5 bg-white" /></div>
                          <div><label className="block text-slate-600 mb-1">Default Width (mm)</label><input type="number" value={standards.defaultWidthMm} onChange={e => setStandards(s => ({ ...s, defaultWidthMm: Number(e.target.value) }))} className="w-full border rounded px-2 py-1.5 bg-white" /></div>
                        </div>
                      </div>

                      <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                        <div className="font-bold navy-text uppercase">Metallurgy & Plate Thicknesses (mm)</div>
                        <div>
                          <label className="block text-slate-600 mb-1">Default Structural Metallurgy</label>
                          <select value={standards.defaultMetallurgy} onChange={e => setStandards(s => ({ ...s, defaultMetallurgy: e.target.value }))} className="w-full border rounded px-2.5 py-1.5 bg-white">
                            <option>Corten-A SPA-H</option><option>Marine Galvalume</option><option>SS316L Stainless</option>
                          </select>
                        </div>
                        <div className="grid grid-cols-3 gap-2">
                          <div><label className="block text-slate-600 mb-1">Wall (mm)</label><input type="number" step="0.5" value={standards.wallThicknessMm} onChange={e => setStandards(s => ({ ...s, wallThicknessMm: Number(e.target.value) }))} className="w-full border rounded px-2 py-1.5 bg-white" /></div>
                          <div><label className="block text-slate-600 mb-1">Roof (mm)</label><input type="number" step="0.5" value={standards.roofThicknessMm} onChange={e => setStandards(s => ({ ...s, roofThicknessMm: Number(e.target.value) }))} className="w-full border rounded px-2 py-1.5 bg-white" /></div>
                          <div><label className="block text-slate-600 mb-1">Floor (mm)</label><input type="number" step="0.5" value={standards.floorThicknessMm} onChange={e => setStandards(s => ({ ...s, floorThicknessMm: Number(e.target.value) }))} className="w-full border rounded px-2 py-1.5 bg-white" /></div>
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                          <div><label className="block text-slate-600 mb-1">Raised Floor Plenum (mm)</label><input type="number" value={standards.plenumHeightMm} onChange={e => setStandards(s => ({ ...s, plenumHeightMm: Number(e.target.value) }))} className="w-full border rounded px-2 py-1.5 bg-white" /></div>
                          <div><label className="block text-slate-600 mb-1">Overhead Clearance (mm)</label><input type="number" value={standards.topClearanceMm} onChange={e => setStandards(s => ({ ...s, topClearanceMm: Number(e.target.value) }))} className="w-full border rounded px-2 py-1.5 bg-white" /></div>
                        </div>
                      </div>

                      <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                        <div className="font-bold navy-text uppercase">Pod Capacity & Structural Limits</div>
                        <div><label className="block text-slate-600 mb-1">Max Wet IT Payload per Pod (kg)</label><input type="number" value={standards.maxPodPayloadKg} onChange={e => setStandards(s => ({ ...s, maxPodPayloadKg: Number(e.target.value) }))} className="w-full border rounded px-2.5 py-1.5 bg-white" /></div>
                        <div><label className="block text-slate-600 mb-1">Max DLC Thermal/Power Envelope per Pod (kW)</label><input type="number" value={standards.maxDlcKwPerPod} onChange={e => setStandards(s => ({ ...s, maxDlcKwPerPod: Number(e.target.value) }))} className="w-full border rounded px-2.5 py-1.5 bg-white" /></div>
                        <div><label className="block text-slate-600 mb-1">Max Air-Cooled Envelope per Pod (kW)</label><input type="number" value={standards.maxAcKwPerPod} onChange={e => setStandards(s => ({ ...s, maxAcKwPerPod: Number(e.target.value) }))} className="w-full border rounded px-2.5 py-1.5 bg-white" /></div>
                      </div>
                    </div>
                  )}

                  {/* TAB 3: COOLING & CLIMATE STANDARDS */}
                  {paramTab === "cooling" && (
                    <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-6 text-xs">
                      <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                        <div className="font-bold navy-text uppercase">Hydraulic & Fluid Loop Standards</div>
                        <div><label className="block text-slate-600 mb-1">Secondary Coolant Chemistry</label><input type="text" value={standards.coolantType} onChange={e => setStandards(s => ({ ...s, coolantType: e.target.value }))} className="w-full border rounded px-2.5 py-1.5 bg-white" /></div>
                        <div className="grid grid-cols-3 gap-2">
                          <div><label className="block text-slate-600 mb-1">Supply Temp (°C)</label><input type="number" value={standards.supplyTempC} onChange={e => setStandards(s => ({ ...s, supplyTempC: Number(e.target.value) }))} className="w-full border rounded px-2 py-1.5 bg-white" /></div>
                          <div><label className="block text-slate-600 mb-1">Return Temp (°C)</label><input type="number" value={standards.returnTempC} onChange={e => setStandards(s => ({ ...s, returnTempC: Number(e.target.value) }))} className="w-full border rounded px-2 py-1.5 bg-white" /></div>
                          <div><label className="block text-slate-600 mb-1">Trim Chiller WB (°C)</label><input type="number" step="0.5" value={standards.wetBulbSwitchoverC} onChange={e => setStandards(s => ({ ...s, wetBulbSwitchoverC: Number(e.target.value) }))} className="w-full border rounded px-2 py-1.5 bg-white" /></div>
                        </div>
                      </div>

                      <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                        <div className="font-bold navy-text uppercase">Regional Climate Profiles (Peak Dry / Wet Bulb °C)</div>
                        {Object.entries(climates).map(([cName, cVal]) => (
                          <div key={cName} className="flex items-center justify-between gap-2 bg-white p-2 rounded border border-slate-200">
                            <span className="font-bold text-slate-700">{cName}</span>
                            <div className="flex items-center gap-2">
                              <span>DB:</span>
                              <input type="number" value={cVal.peakDryBulb} onChange={e => setClimates(prev => ({ ...prev, [cName]: { ...cVal, peakDryBulb: Number(e.target.value) } }))} className="w-14 border rounded px-1.5 py-0.5" />
                              <span>WB:</span>
                              <input type="number" step="0.5" value={cVal.peakWetBulb} onChange={e => setClimates(prev => ({ ...prev, [cName]: { ...cVal, peakWetBulb: Number(e.target.value) } }))} className="w-14 border rounded px-1.5 py-0.5" />
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* TAB 4: ELECTRICAL, UPS & BESS STANDARDS */}
                  {paramTab === "electrical" && (
                    <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-6 text-xs">
                      <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                        <div className="font-bold navy-text uppercase">Distribution & Busway Standards</div>
                        <div><label className="block text-slate-600 mb-1">Overhead Busway Rating (Amperes)</label><input type="number" value={standards.buswayAmperageA} onChange={e => setStandards(s => ({ ...s, buswayAmperageA: Number(e.target.value) }))} className="w-full border rounded px-2.5 py-1.5 bg-white" /></div>
                        <div><label className="block text-slate-600 mb-1">DG Specific Fuel Consumption (Litres / kWh)</label><input type="number" step="0.01" value={standards.dgFuelLitresPerKwh} onChange={e => setStandards(s => ({ ...s, dgFuelLitresPerKwh: Number(e.target.value) }))} className="w-full border rounded px-2.5 py-1.5 bg-white" /></div>
                      </div>
                      <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                        <div className="font-bold navy-text uppercase">Battery Energy Storage (BESS) Depth of Discharge</div>
                        <div><label className="block text-slate-600 mb-1">LFP Usable Depth of Discharge (%)</label><input type="number" value={standards.lfpDoDPct} onChange={e => setStandards(s => ({ ...s, lfpDoDPct: Number(e.target.value) }))} className="w-full border rounded px-2.5 py-1.5 bg-white" /></div>
                        <div><label className="block text-slate-600 mb-1">VRLA Usable Depth of Discharge (%)</label><input type="number" value={standards.vrlaDoDPct} onChange={e => setStandards(s => ({ ...s, vrlaDoDPct: Number(e.target.value) }))} className="w-full border rounded px-2.5 py-1.5 bg-white" /></div>
                      </div>
                    </div>
                  )}

                  {/* TAB 5: MASTER OEM RATE CARD & COMMERCIAL DEFAULTS */}
                  {paramTab === "rates" && (
                    <div className="p-5 space-y-4 text-xs">
                      <div className="grid grid-cols-2 md:grid-cols-5 gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <div><label className="block font-bold text-slate-600">Default Margin %</label><input type="number" value={standards.defaultMarginPct} onChange={e => setStandards(s => ({ ...s, defaultMarginPct: Number(e.target.value) }))} className="w-full border rounded px-2 py-1 bg-white mt-1" /></div>
                        <div><label className="block font-bold text-slate-600">Default Contingency %</label><input type="number" value={standards.defaultContingencyPct} onChange={e => setStandards(s => ({ ...s, defaultContingencyPct: Number(e.target.value) }))} className="w-full border rounded px-2 py-1 bg-white mt-1" /></div>
                        <div><label className="block font-bold text-slate-600">Default GST %</label><input type="number" value={standards.defaultGstPct} onChange={e => setStandards(s => ({ ...s, defaultGstPct: Number(e.target.value) }))} className="w-full border rounded px-2 py-1 bg-white mt-1" /></div>
                        <div><label className="block font-bold text-slate-600">INR / USD Rate</label><input type="number" value={standards.usdRate} onChange={e => setStandards(s => ({ ...s, usdRate: Number(e.target.value) }))} className="w-full border rounded px-2 py-1 bg-white mt-1" /></div>
                        <div><label className="block font-bold text-slate-600">INR / EUR Rate</label><input type="number" value={standards.eurRate} onChange={e => setStandards(s => ({ ...s, eurRate: Number(e.target.value) }))} className="w-full border rounded px-2 py-1 bg-white mt-1" /></div>
                      </div>

                      <div className="overflow-x-auto border border-slate-200 rounded-xl">
                        <table className="w-full text-left border-collapse">
                          <thead>
                            <tr className="bg-slate-100 text-slate-700 border-b border-slate-200">
                              <th className="p-2.5">Infrastructure Subsystem</th>
                              <th className="p-2.5">OEM Make</th>
                              <th className="p-2.5">Model / Spec</th>
                              <th className="p-2.5">Unit Basis</th>
                              <th className="p-2.5 text-right">Master Base Cost (₹)</th>
                            </tr>
                          </thead>
                          <tbody>
                            {Object.entries(rateCard).map(([k, item]) => (
                              <tr key={k} className="border-b border-slate-200">
                                <td className="p-2.5 font-bold navy-text">{item.label}</td>
                                <td className="p-2.5"><input type="text" value={item.make} onChange={e => setRateCard(rc => ({ ...rc, [k]: { ...item, make: e.target.value } }))} className="border rounded px-2 py-1 w-36" /></td>
                                <td className="p-2.5"><input type="text" value={item.model} onChange={e => setRateCard(rc => ({ ...rc, [k]: { ...item, model: e.target.value } }))} className="border rounded px-2 py-1 w-40" /></td>
                                <td className="p-2.5 text-slate-500">{item.unit}</td>
                                <td className="p-2.5 text-right"><input type="number" value={item.cost} onChange={e => setRateCard(rc => ({ ...rc, [k]: { ...item, cost: Number(e.target.value) } }))} className="border rounded px-2 py-1 w-32 text-right font-mono" /></td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {/* TAB 6: BRANDING & GOOGLE DRIVE OAUTH */}
                  {paramTab === "branding" && (
                    <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-6 text-sm">
                      <div className="space-y-3 p-4 bg-slate-50 rounded-xl border border-slate-200">
                        <h3 className="font-bold navy-text">Company Logo (Top-Left Header & All PDF/CAD Exports)</h3>
                        <input type="file" accept="image/*" onChange={handleLogoUpload} className="block text-xs" />
                        {logoDataUrl && (
                          <div className="flex items-center gap-3 p-3 bg-white rounded-lg border border-slate-200">
                            <img src={logoDataUrl} alt="Logo Preview" className="h-12 w-auto object-contain" />
                            <button onClick={() => setLogoDataUrl("")} className="text-xs text-red-600 font-bold">Remove Logo</button>
                          </div>
                        )}
                      </div>
                      <div className="space-y-3 p-4 bg-slate-50 rounded-xl border border-slate-200">
                        <h3 className="font-bold navy-text">Google Drive OAuth Client ID (Pre-Configured)</h3>
                        <p className="text-xs text-slate-500">Pre-configured so team members simply click "Sign in with Google". Override only if migrating Google Cloud projects.</p>
                        <input type="text" value={clientId} onChange={e => setClientId(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs font-mono bg-white" />
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
