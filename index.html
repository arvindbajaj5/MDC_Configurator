    // IS 1893 Seismic Zone Classifier
    function classifySeismicZone(cityName = "", lat = 19.0, lon = 73.0) {
      const c = cityName.toLowerCase();
      if (c.includes("guwahati") || c.includes("shillong") || c.includes("imphal") || c.includes("itanagar") || c.includes("kohima") || c.includes("agartala") || c.includes("aizawl") || c.includes("gangtok") || c.includes("bhuj") || c.includes("srinagar") || c.includes("leh") || c.includes("dehradun") || c.includes("shimla") || c.includes("port blair") || (lon > 89 && lat > 22) || lat > 30) {
        return { zone: "Zone V", zFactor: 0.36, label: "IS 1893 Zone V (Very High Seismicity — 0.36g)" };
      }
      if (c.includes("delhi") || c.includes("noida") || c.includes("gurgaon") || c.includes("gurugram") || c.includes("patna") || c.includes("lucknow") || c.includes("chandigarh") || c.includes("amritsar") || c.includes("kolkata") || c.includes("siliguri") || lat > 25.5) {
        return { zone: "Zone IV", zFactor: 0.24, label: "IS 1893 Zone IV (High Seismicity — 0.24g)" };
      }
      if (c.includes("mumbai") || c.includes("thane") || c.includes("navi mumbai") || c.includes("pune") || c.includes("chennai") || c.includes("ahmedabad") || c.includes("surat") || c.includes("bhubaneswar") || c.includes("visakhapatnam") || c.includes("kochi") || c.includes("mangalore")) {
        return { zone: "Zone III", zFactor: 0.16, label: "IS 1893 Zone III (Moderate Seismicity — 0.16g)" };
      }
      return { zone: "Zone II", zFactor: 0.10, label: "IS 1893 Zone II (Low Seismicity — 0.10g)" };
    }

    function computeEngineering(project, skus, rateCard, standards) {
      const skuMap = Object.fromEntries(skus.map(s => [s.id, s]));
      const activeRacks = [];
      let totalNameplatePeakKw = 0;
      let totalDesignContKw = 0;
      let totalActualKw = 0;
      let totalLiquidKw = 0;
      let totalAirKw = 0;
      let totalFlowLpm = 0;
      let maxReqDeltaPBar = 0;
      let extCduRequiredKw = 0;
      let hasDlcRacks = false;
      let hasExtCduRacks = false;

      Object.entries(project.rackQuantities || {}).forEach(([skuId, qty]) => {
        const q = Number(qty) || 0;
        const sku = skuMap[skuId];
        if (!sku || q <= 0) return;

        for (let i = 0; i < q; i++) {
          const instKey = `${sku.id}__${i}`;
          const designContKw = sku.peakKw * sku.continuousFactor;
          const stdActualKw = designContKw * sku.operatingUtilFactor;
          const actualKw = (project.loadingMode === "ActualPerRack" && project.actualRackLoads?.[instKey] !== undefined && project.actualRackLoads?.[instKey] !== "")
            ? Number(project.actualRackLoads[instKey])
            : stdActualKw;

          const effectiveThermalKw = project.loadingMode === "ActualPerRack" ? actualKw : designContKw;
          const liqKw = effectiveThermalKw * (sku.liquidSplitPct / 100);
          const airKw = effectiveThermalKw - liqKw;

          totalNameplatePeakKw += sku.peakKw;
          totalDesignContKw += designContKw;
          totalActualKw += actualKw;
          totalLiquidKw += liqKw;
          totalAirKw += airKw;
          totalFlowLpm += liqKw * sku.flowLpmPerKw;
          if (sku.reqDeltaPBar > maxReqDeltaPBar) maxReqDeltaPBar = sku.reqDeltaPBar;

          if (sku.category === "DLC" || sku.liquidSplitPct > 0) hasDlcRacks = true;
          if (sku.cduMode === "External") {
            extCduRequiredKw += liqKw;
            hasExtCduRacks = true;
          }

          activeRacks.push({
            ...sku,
            instanceKey: instKey,
            instanceIndex: i + 1,
            designContKw,
            actualKw,
            liqKw,
            airKw,
            wetWeightKg: sku.dryWeightKg + sku.coolantWeightKg
          });
        }
      });

      const dlcRacks = activeRacks.filter(r => r.category === "DLC");
      const acRacks = activeRacks.filter(r => r.category === "AC");

      const airlockReserveMm = project.airlockVestibule ? 1400 : 400;
      const wallInsulReserveMm = 400;
      let targetExtLengthMm = standards.iso40LengthMm;
      if (project.containerLengthMode === "ISO20") targetExtLengthMm = standards.iso20LengthMm;
      else if (project.containerLengthMode === "ISO40") targetExtLengthMm = standards.iso40LengthMm;
      else targetExtLengthMm = project.maxCustomLengthMm || standards.defaultCustomMaxLenMm;

      const maxUsableRowMm = Math.max(3600, targetExtLengthMm - airlockReserveMm - wallInsulReserveMm);
      const maxDlcKwPerPod = standards.maxDlcKwPerPod || 2000;
      const maxAcKwPerPod = standards.maxAcKwPerPod || 400;
      const maxPayloadKgPerPod = standards.maxPodPayloadKg || 36000;

      const sortedDlc = [...dlcRacks].sort((a, b) => b.designContKw - a.designContKw);
      const pods = [];

      const packGroup = (rackList, podKind, maxKwCap) => {
        const localPods = [];
        rackList.forEach(rack => {
          let placed = false;
          for (let p of localPods) {
            if (project.packingStrategy === "Segregated" && p.racks.length > 0 && p.racks[0].id !== rack.id) continue;
            const cduWidthReserve = p.needsExtCdu || rack.cduMode === "External" ? 900 : 0;
            const rowALen = p.rowA.reduce((s, r) => s + r.widthMm + 50, 0);
            const rowBLen = p.rowB.reduce((s, r) => s + r.widthMm + 50, 0);
            const targetRow = rowALen <= rowBLen ? "A" : "B";
            const currentRowLen = targetRow === "A" ? rowALen : rowBLen;
            const nextKw = p.designContKw + rack.designContKw;
            const nextWt = p.wetWeightKg + rack.wetWeightKg;
            if (currentRowLen + rack.widthMm + cduWidthReserve <= maxUsableRowMm && nextKw <= maxKwCap && nextWt <= maxPayloadKgPerPod) {
              p.racks.push(rack);
              if (targetRow === "A") p.rowA.push(rack);
              else p.rowB.push(rack);
              p.designContKw = nextKw;
              p.actualKw += rack.actualKw;
              p.peakKw += rack.peakKw;
              p.liqKw += rack.liqKw;
              p.airKw += rack.airKw;
              p.wetWeightKg = nextWt;
              if (rack.cduMode === "External") p.needsExtCdu = true;
              placed = true;
              break;
            }
          }
          if (!placed) {
            localPods.push({
              id: `${podKind}-${localPods.length + 1}`,
              kind: podKind,
              racks: [rack],
              rowA: [rack],
              rowB: [],
              designContKw: rack.designContKw,
              actualKw: rack.actualKw,
              peakKw: rack.peakKw,
              liqKw: rack.liqKw,
              airKw: rack.airKw,
              wetWeightKg: rack.wetWeightKg,
              needsExtCdu: rack.cduMode === "External"
            });
          }
        });

        localPods.forEach((p, idx) => {
          const rowALen = p.rowA.reduce((s, r) => s + r.widthMm + 50, 0);
          const rowBLen = p.rowB.reduce((s, r) => s + r.widthMm + 50, 0);
          const cduBay = p.needsExtCdu ? 950 : 0;
          const usedBayMm = Math.max(rowALen, rowBLen) + cduBay;
          let extLenMm = targetExtLengthMm;
          if (project.containerLengthMode === "CustomOptimum") {
            const rawLen = usedBayMm + airlockReserveMm + wallInsulReserveMm;
            extLenMm = Math.max(6000, Math.ceil(rawLen / 250) * 250);
          }
          const shellAreaSqm = 2 * ((extLenMm / 1000) * (project.containerHeightMm / 1000)) +
                               2 * ((project.containerWidthMm / 1000) * (project.containerHeightMm / 1000)) +
                               2 * ((extLenMm / 1000) * (project.containerWidthMm / 1000));
          const emptyTareKg = Math.round(shellAreaSqm * (project.wallThicknessMm * 7.85 * 1.35) + 2800);
          const rowAKw = p.rowA.reduce((s, r) => s + r.actualKw, 0);
          const rowBKw = p.rowB.reduce((s, r) => s + r.actualKw, 0);
          const phaseBalancePct = Math.max(rowAKw, rowBKw) > 0
            ? Math.round((Math.min(rowAKw, rowBKw) / Math.max(rowAKw, rowBKw)) * 100)
            : 100;

          p.label = `${podKind} Pod #${idx + 1}`;
          p.extLengthMm = extLenMm;
          p.extWidthMm = project.containerWidthMm;
          p.extHeightMm = project.containerHeightMm;
          p.emptyTareKg = emptyTareKg;
          p.grossRiggingKg = emptyTareKg + p.wetWeightKg;
          p.shellAreaSqm = shellAreaSqm;
          p.bayUtilPct = Math.min(100, Math.round((usedBayMm / (extLenMm - airlockReserveMm - wallInsulReserveMm)) * 100));
          p.rowAKw = rowAKw;
          p.rowBKw = rowBKw;
          p.phaseBalancePct = phaseBalancePct;
          pods.push(p);
        });
      };

      packGroup(sortedDlc, "DLC", maxDlcKwPerPod);
      packGroup(acRacks, "AC", maxAcKwPerPod);

      const isGanged = project.hallTopology !== "Isolated";
      const sharedWallSavingsSqm = isGanged && pods.length > 1
        ? (pods.length - 1) * ((pods[0]?.extLengthMm || 12000) / 1000) * (project.containerHeightMm / 1000) * 1.6
        : 0;

      // Dynamic Psychrometric & Cooling Engine
      let recommendedCoolingMode = "Air-Side Precision Cooling (PAC / In-Row)";
      let annualWueLPerKwh = 0.0;
      let trimChillerKw = 0;

      if (hasDlcRacks) {
        if (project.waterAvailability === "Zero") {
          recommendedCoolingMode = "Zero-Water Dry Coolers + Mechanical Trim Chillers";
          annualWueLPerKwh = 0.0;
          trimChillerKw = Math.round(totalDesignContKw * 0.45);
        } else if ((project.peakWetBulb || 28) >= standards.wetBulbSwitchoverC) {
          recommendedCoolingMode = "Hybrid Adiabatic Coolers + Peak Monsoon Trim Chillers";
          annualWueLPerKwh = 0.35;
          trimChillerKw = Math.round(totalDesignContKw * 0.30);
        } else {
          recommendedCoolingMode = "Adiabatic Spray-Assisted Fluid Coolers (Free-Cooling)";
          annualWueLPerKwh = 0.38;
        }
      } else if (totalDesignContKw > 0) {
        recommendedCoolingMode = `100% Air-Cooled (${project.airCoolingType} Precision DX / Chilled Water)`;
      }

      const coolingMode = project.coolingOverrideMode === "Auto" || !project.coolingOverrideMode
        ? recommendedCoolingMode
        : project.coolingOverrideMode;

      const tierMult = project.uptimeTier === "Tier IV" ? 2.0 : project.uptimeTier === "Tier III" ? 1.35 : 1.15;
      const extCduUnits = (hasExtCduRacks && project.includeExtCdu) ? Math.max(1, Math.ceil((extCduRequiredKw / 1350) * tierMult)) : 0;
      const adiabaticUnits = (hasDlcRacks && project.includeLiquidLoop) ? Math.max(1, Math.ceil((totalLiquidKw / 1000) * tierMult)) : 0;
      const trimChillerUnits = (hasDlcRacks && project.includeLiquidLoop && trimChillerKw > 0) ? Math.max(1, Math.ceil((trimChillerKw / 500) * tierMult)) : 0;
      const roomDehumUnits = (totalDesignContKw > 0 && project.includeRoomDehum) ? Math.max(pods.length, Math.ceil((totalAirKw / 40) * tierMult)) : 0;

      // Primary/Secondary Pump Skids & Water Storage Tank Sizing
      const pumpSkidsCount = (hasDlcRacks && project.includePumpSkids)
        ? Math.max(1, Math.ceil((totalFlowLpm / 2500) * (project.uptimeTier === "Tier IV" ? 2 : 1)))
        : 0;
      const pumpDesignHeadBar = Number((maxReqDeltaPBar + 1.4).toFixed(2));
      const dailyEvapLitres = Math.round(totalActualKw * 24 * annualWueLPerKwh);
      const loopFillLitres = Math.round(totalLiquidKw * 3.2);
      const totalWaterStorageLitres = (hasDlcRacks && project.includeWaterTanks)
        ? Math.max(10000, Math.ceil(((dailyEvapLitres * (project.waterAutonomyDays || 3)) + loopFillLitres) / 10000) * 10000)
        : 0;
      const waterTankUnits = totalWaterStorageLitres > 0 ? Math.ceil(totalWaterStorageLitres / 10000) : 0;

      const pueDesign = totalDesignContKw > 0
        ? Number((1.09 + (trimChillerKw > 0 ? 0.045 : 0.02) + (totalAirKw / Math.max(1, totalDesignContKw)) * 0.14).toFixed(3))
        : 1.15;
      const totalFacilityPeakKw = Math.round(totalNameplatePeakKw * pueDesign);
      const totalFacilityPeakKva = Math.round(totalFacilityPeakKw / 0.9);

      const transformerUnits = (project.includeTransformer && totalDesignContKw > 0)
        ? Math.max(project.uptimeTier === "Tier IV" ? 2 : 1, Math.ceil((totalFacilityPeakKva / 2000) * (project.uptimeTier === "Tier IV" ? 2 : 1.25)))
        : 0;
      const lvSwitchgearUnits = (project.includeLvSwitchgear && totalDesignContKw > 0)
        ? Math.max(1, transformerUnits)
        : 0;
      const upsFrameKva = project.upsFrameKva || 1000;
      const upsContainersCount = (project.includeUpsContainer && totalDesignContKw > 0)
        ? Math.max(project.uptimeTier === "Tier IV" ? 2 : 1, Math.ceil((totalFacilityPeakKva / upsFrameKva) * (project.uptimeTier === "Tier IV" ? 2 : 1.25)))
        : 0;
      const dodFactor = project.batteryChemistry === "LFP" ? (standards.lfpDoDPct / 100) : (standards.vrlaDoDPct / 100);
      const batteryKwhReq = (totalFacilityPeakKw * (project.batteryRuntimeMin / 60)) / Math.max(0.5, dodFactor);
      const batteryContainersCount = (project.includeBatteryContainer && totalDesignContKw > 0)
        ? Math.max(1, Math.ceil(batteryKwhReq / 1200))
        : 0;
      const dgUnitsCount = (project.includeDgYard && totalDesignContKw > 0)
        ? Math.max(2, Math.ceil((totalFacilityPeakKva / 1500) * tierMult))
        : 0;

      const isHighSeismic = project.seismicZone === "Zone IV" || project.seismicZone === "Zone V";

      // BOM Builder
      const getItemPrice = (key, qty, label, category, specs, customUnitCost = null) => {
        const base = rateCard[key] || { cost: 500000, make: "Standard OEM", model: "GEN-1" };
        const override = project.rateOverrides?.[key];
        const unitCost = override !== undefined && override !== ""
          ? Number(override)
          : (customUnitCost !== null ? Number(customUnitCost) : base.cost);
        const rawCostTotal = unitCost * qty;
        const withContingency = rawCostTotal * (1 + project.contingencyPct / 100);
        const sellingPreTax = withContingency / Math.max(0.05, 1 - project.marginPct / 100);
        const gstAmt = sellingPreTax * (project.gstPct / 100);
        return {
          key, category, label, specs,
          make: base.make, model: base.model,
          qty, stdUnitCost: base.cost, unitCost,
          isOverridden: override !== undefined && override !== "",
          rawCostTotal, withContingency, sellingPreTax, gstAmt,
          grandTotalInclGst: sellingPreTax + gstAmt
        };
      };

      const bomItems = [];
      skus.forEach(sku => {
        const q = Number(project.rackQuantities?.[sku.id]) || 0;
        if (q > 0) {
          const k = `rack_${sku.id}`;
          const ov = project.rateOverrides?.[k];
          const unitCost = ov !== undefined && ov !== "" ? Number(ov) : sku.unitCostInr;
          const rawCostTotal = unitCost * q;
          const withContingency = rawCostTotal * (1 + project.contingencyPct / 100);
          const sellingPreTax = withContingency / Math.max(0.05, 1 - project.marginPct / 100);
          const gstAmt = sellingPreTax * (project.gstPct / 100);
          bomItems.push({
            key: k, category: "IT Compute & Racks", label: sku.name,
            specs: `${sku.peakKw}kW Peak | ${sku.liquidSplitPct}% Liq | ΔP ${sku.reqDeltaPBar} bar`,
            make: sku.vendorMake, model: sku.vendorModel,
            qty: q, stdUnitCost: sku.unitCostInr, unitCost,
            isOverridden: ov !== undefined && ov !== "",
            rawCostTotal, withContingency, sellingPreTax, gstAmt,
            grandTotalInclGst: sellingPreTax + gstAmt
          });
        }
      });

      if (pods.length > 0) {
        const netShellSqm = Math.max(40, Math.round(pods.reduce((s, p) => s + p.shellAreaSqm, 0) - sharedWallSavingsSqm));
        if (project.bespokeContainerPriceInr !== "" && Number(project.bespokeContainerPriceInr) > 0) {
          bomItems.push(getItemPrice("shellPerSqm", pods.length, `Bespoke Modular Containers (${pods.length} Pods, ${project.metallurgy})`, "Structural & Shell", `Custom per-pod fabrication (${(pods[0].extLengthMm/1000).toFixed(2)}m L)`, Number(project.bespokeContainerPriceInr)));
        } else {
          bomItems.push(getItemPrice("shellPerSqm", netShellSqm, `Custom Modular Enclosures (${pods.length} Pods, ${project.metallurgy})`, "Structural & Shell", `${project.hallTopology} | Wall ${project.wallThicknessMm}mm / Floor ${project.floorThicknessMm}mm`));
        }

        if (isHighSeismic) {
          bomItems.push(getItemPrice("seismicBracingPod", pods.length, `Seismic Reinforcement & Flexible Loops (${project.seismicZone})`, "Structural & Shell", `${project.seismicLabel}`));
        }

        const totalMeters = pods.reduce((s, p) => s + (p.extLengthMm / 1000) * 2, 0);
        bomItems.push(getItemPrice("buswayPerMeter", Math.round(totalMeters * (project.uptimeTier === "Tier IV" ? 2 : 1.5)), `Overhead Dual A/B Power Busways (${standards.buswayAmperageA}A)`, "Electrical Distribution", `${project.uptimeTier} Redundant Overhead Busways`));
        if (hasDlcRacks) {
          bomItems.push(getItemPrice("ss316HeaderPerMeter", Math.round(totalMeters * 2.2), "Underfloor SS316L Supply/Return Coolant Headers", "Liquid Cooling & Hydraulics", `${standards.coolantType} (${Math.round(totalFlowLpm)} LPM)`));
        }
      }

      if (extCduUnits > 0) bomItems.push(getItemPrice("extCdu1500Kw", extCduUnits, "External Row/Side-Car Liquid CDUs (FWS-to-TCS)", "Liquid Cooling & Hydraulics", `Supports ${Math.round(extCduRequiredKw)} kW external-CDU racks`));
      if (pumpSkidsCount > 0) bomItems.push(getItemPrice("primaryPumpSkid", pumpSkidsCount, "N+1 VFD Circulating Pump Skids (Yard-to-Rack Loop)", "Liquid Cooling & Hydraulics", `${Math.round(totalFlowLpm)} LPM @ ${pumpDesignHeadBar} bar TDH`));
      if (waterTankUnits > 0) bomItems.push(getItemPrice("waterTank10Kl", waterTankUnits, `Make-Up & Pressurized Expansion Water Tanks (${(totalWaterStorageLitres/1000)} kL)`, "Liquid Cooling & Hydraulics", `${project.waterAutonomyDays}-day evap buffer + loop fill`));
      if (adiabaticUnits > 0) bomItems.push(getItemPrice("adiabaticCooler1Mw", adiabaticUnits, "Yard Adiabatic / Dry Fluid Coolers", "Heat Rejection", `${coolingMode}`));
      if (trimChillerUnits > 0) bomItems.push(getItemPrice("trimChiller500Kw", trimChillerUnits, "Peak Monsoon Mechanical Trim Chillers", "Heat Rejection", `500 kW VFD Air-Cooled Chiller Modules`));
      if (roomDehumUnits > 0) bomItems.push(getItemPrice("roomDehumPac40Kw", roomDehumUnits, `Room Dehumidification & ${project.airCoolingType} Units`, "Air & Room Control", `Handles ${Math.round(totalAirKw)} kW residual radiant & AC load`));

      if (transformerUnits > 0) bomItems.push(getItemPrice("transformer2000Kva", transformerUnits, `MV/LV Step-Down Transformers (${project.transformerType})`, "Substation & Switchgear", `${transformerUnits} x 2000 kVA (${totalFacilityPeakKva} kVA facility peak)`));
      if (lvSwitchgearUnits > 0) bomItems.push(getItemPrice("lvSwitchgearPanel", lvSwitchgearUnits, "Main LV ACB Switchgear & Auto-Transfer Lineup", "Substation & Switchgear", `3200A Form-4B Drawout Switchboard`));
      if (upsContainersCount > 0) bomItems.push(getItemPrice("upsContainer1Mw", upsContainersCount, `Containerized Modular UPS Pods (${upsFrameKva} kVA each)`, "UPS & BESS Power", `${project.uptimeTier} Modular Online Double-Conversion`));
      if (batteryContainersCount > 0) bomItems.push(getItemPrice("batteryContainer15Min", batteryContainersCount, `Containerized ${project.batteryChemistry} Battery Pods (${project.batteryRuntimeMin} min)`, "UPS & BESS Power", `${Math.round(batteryKwhReq)} kWh + Gas Venting & Suppression`));
      if (dgUnitsCount > 0) bomItems.push(getItemPrice("dgSet1500Kva", dgUnitsCount, "CPCB IV+ Acoustic Diesel Generator Sets + PESO Tank", "Prime/Backup Power", `${dgUnitsCount} x 1500 kVA (${project.dgAutonomyHours}h fuel)`));

      if (project.includeIntegratedBms && pods.length > 0) bomItems.push(getItemPrice("integratedBmsPod", pods.length, "Integrated BMS, DCIM, EPMS & Underfloor Leak Detection", "BMS, Safety & Security", "PLC/SCADA, leak ropes, branch power & thermal telemetry"));
      if (project.includeVesdaFire && pods.length > 0) bomItems.push(getItemPrice("vesdaFirePod", pods.length, "VESDA Aspirating Smoke Detection + Novec 1230 Suppression", "BMS, Safety & Security", "Early warning laser detection + clean-agent flooding"));
      if (project.includeCctvSecurity && pods.length > 0) bomItems.push(getItemPrice("cctvSecuritySite", Math.max(1, Math.ceil(pods.length / 2)), "IP CCTV Surveillance, 90-Day NVR & Biometric Access", "BMS, Safety & Security", "Internal aisle domes + perimeter PTZ & turnstiles"));
      if (project.includeAcousticBarrier) bomItems.push(getItemPrice("acousticBarrierMeter", 85, "CPCB Neighbor-Boundary Acoustic Louver & Barrier Wall", "Civil & Site", "Attenuates yard noise to <= 65 dBA at boundary"));

      if (project.includeAdminModule) bomItems.push(getItemPrice("adminSparesModule", 1, "Operations NOC, Admin & ESD Spares Workshop Container", "Support Modules", "Operator consoles, diagnostic bench & spare manifolds"));
      if (project.includeStagingModule) bomItems.push(getItemPrice("stagingDockModule", 1, "Staging, Unloading Dock & Nitrogen Leak-Test Bay", "Support Modules", "Hydraulic lift + heavy rack de-crating zone"));

      const plinthSqm = pods.length > 0
        ? Math.round(pods.length * 65 + (upsContainersCount + batteryContainersCount) * 35 + (project.includeAdminModule ? 45 : 0))
        : 0;
      if (plinthSqm > 0) {
        bomItems.push(getItemPrice("civilPlinthPerSqm", plinthSqm, "Elevated RCC Monsoon Plinths, Trenches & Canopy", "Civil & Site", `${project.regulatoryCode}`));
      }

      // Installation Services & Multi-Year AMC
      if (project.includeInstallation && pods.length > 0) {
        bomItems.push(getItemPrice("installCommissionPod", pods.length, "Turnkey Site Rigging, Ganging, Hydro-Flush & IST (L1–L5)", "Services & AMC", "Crane lifting, inter-bay sealing & commissioning"));
      }
      if (project.includeAmcContract && totalDesignContKw > 0) {
        const mwQty = Number((totalDesignContKw / 1000).toFixed(2));
        const years = Number(project.amcYears) || 5;
        bomItems.push(getItemPrice("annualAmcOpsPerMw", Number((mwQty * years).toFixed(2)), `${years}-Year Managed O&M, Annual AMC & Consumables`, "Services & AMC", `${project.amcSupportModel} (${years} yrs × ${mwQty} MW)`));
      }

      // Non-Standard Works
      (project.nonStandardWorks || []).forEach(nsw => {
        if ((Number(nsw.qty) || 0) > 0 && (Number(nsw.unitCostInr) || 0) > 0) {
          bomItems.push(getItemPrice(`nsw_${nsw.id}`, Number(nsw.qty), nsw.desc || "Non-Standard Site Work", "Non-Standard Works", `Custom BOQ (${nsw.unit})`, Number(nsw.unitCostInr)));
        }
      });

      const totals = bomItems.reduce((acc, it) => ({
        rawCost: acc.rawCost + it.rawCostTotal,
        contingency: acc.contingency + (it.withContingency - it.rawCostTotal),
        sellingPreTax: acc.sellingPreTax + it.sellingPreTax,
        gst: acc.gst + it.gstAmt,
        grandTotal: acc.grandTotal + it.grandTotalInclGst
      }), { rawCost: 0, contingency: 0, sellingPreTax: 0, gst: 0, grandTotal: 0 });

      const capexItems = bomItems.filter(i => i.category !== "Services & AMC");
      const servicesAmcItems = bomItems.filter(i => i.category === "Services & AMC");
      const capexSellingPreTax = capexItems.reduce((s, i) => s + i.sellingPreTax, 0);
      const servicesAmcPreTax = servicesAmcItems.reduce((s, i) => s + i.sellingPreTax, 0);

      // Day-1 vs Day-N Split
      const d1Factor = project.deploymentMode === "Phased" ? (project.day1SharePct || 50) / 100 : 1.0;
      const day1CapexPreTax = Math.round(capexSellingPreTax * (0.35 + 0.65 * d1Factor));
      const dayNCapexPreTax = Math.max(0, Math.round(capexSellingPreTax - day1CapexPreTax));

      // Annualized OpEx & 5-Year TCO (Driven by Actual Rack Load)
      const annualItKwh = totalActualKw * 8760;
      const annualFacilityKwh = annualItKwh * pueDesign;
      const annualPowerCostInr = annualFacilityKwh * (project.gridTariffInrKwh || 8.5);
      const annualWaterKl = (dailyEvapLitres * 365) / 1000;
      const annualWaterCostInr = annualWaterKl * (project.waterTariffInrKl || 65);
      const annualAmcCostInr = project.includeAmcContract ? (servicesAmcPreTax / Math.max(1, project.amcYears || 5)) : ((totalDesignContKw / 1000) * 3800000);
      const annualTotalOpexInr = annualPowerCostInr + annualWaterCostInr + annualAmcCostInr;
      const fiveYearTcoInr = capexSellingPreTax + (annualTotalOpexInr * 5);

      // Parcel Fit
      const verts = project.parcelVertices || [];
      let area = 0;
      for (let i = 0; i < verts.length; i++) {
        const j = (i + 1) % verts.length;
        area += verts[i].x * verts[j].y - verts[j].x * verts[i].y;
      }
      const grossPlotSqm = Math.abs(area) / 2;
      const netBuildableSqm = Math.max(100, grossPlotSqm * 0.72);
      const requiredFootprintSqm = plinthSqm * 1.45;
      const plotUtilizationPct = Math.min(100, Math.round((requiredFootprintSqm / Math.max(1, netBuildableSqm)) * 100));

      // Acoustic Boundary Estimate
      const sourceDba = dgUnitsCount > 0 ? 82 : 76;
      const attenuationDb = 20 * Math.log10(Math.max(2, project.setbackMeters)) + (project.includeAcousticBarrier ? 12 : 0);
      const boundaryNoiseDba = Math.round(sourceDba - attenuationDb);

      // Implementation Gantt Schedule (Weeks)
      const scaleWks = Math.max(1, Math.ceil(totalDesignContKw / 5000));
      const ganttTasks = [
        { task: "1. Detailed Engineering, Statutory Approvals & Civil Plinths", startWk: 1, durWk: 4 + scaleWks },
        { task: "2. Custom Container Fabrication & Seismic Reinforcement", startWk: 2, durWk: 6 + scaleWks },
        { task: "3. Rack, CDU & Overhead Busway Factory Integration", startWk: 6, durWk: 4 + scaleWks },
        { task: "4. MV/LV Substation, Modular UPS, BESS & DG Yard", startWk: 5, durWk: 6 + scaleWks },
        { task: "5. Site Crane Rigging, Inter-Bay Ganging & Hydro-Flush", startWk: 10 + scaleWks, durWk: 3 },
        { task: "6. Integrated BMS, VESDA Fire & CCTV Security Hookup", startWk: 12 + scaleWks, durWk: 2 },
        { task: "7. Integrated Systems Testing (IST L1–L5) & Handover", startWk: 13 + scaleWks, durWk: 2 }
      ];

      // 8-Rule Engineering & Compliance Design Validator
      const validations = [];
      if (activeRacks.length === 0) {
        validations.push({ status: "FAIL", code: "VAL-00", title: "No IT Racks Configured", msg: "Add IT racks in Step 2 (or click Auto-Populate) to size containers, cooling, pumps, and power." });
      } else {
        validations.push({ status: "PASS", code: "VAL-00", title: "IT Compute Load Defined", msg: `${activeRacks.length} racks (${(totalDesignContKw/1000).toFixed(2)} MW Design TDP / ${(totalActualKw/1000).toFixed(2)} MW Actual Workload).` });
      }

      if (hasDlcRacks && (!project.includeLiquidLoop || !project.includePumpSkids || !project.includeWaterTanks)) {
        validations.push({ status: "FAIL", code: "VAL-01", title: "Incomplete DLC Hydraulic Loop", msg: "DLC racks require Liquid Heat Rejection, N+1 VFD Pump Skids, and Make-Up/Expansion Water Tanks enabled in Step 4." });
      } else if (hasExtCduRacks && !project.includeExtCdu) {
        validations.push({ status: "FAIL", code: "VAL-02", title: "Missing External Row/Side CDUs", msg: "External-CDU racks (AMD Helios / NVIDIA MGX) require External CDUs enabled in Step 4." });
      } else if (activeRacks.length > 0) {
        validations.push({ status: "PASS", code: "VAL-01", title: "DLC Hydraulic & Thermal Loop Verified", msg: `${Math.round(totalFlowLpm)} LPM @ ${pumpDesignHeadBar} bar TDH + ${(totalWaterStorageLitres/1000)} kL tank storage matched.` });
      }

      if (activeRacks.length > 0 && (!project.includeIntegratedBms || !project.includeVesdaFire)) {
        validations.push({ status: "WARNING", code: "VAL-03", title: "Integrated BMS or VESDA Fire Suppression Unchecked", msg: "Mission-critical AI clusters require Integrated BMS (leak detection) and VESDA + Clean Agent suppression." });
      } else if (activeRacks.length > 0) {
        validations.push({ status: "PASS", code: "VAL-03", title: "BMS, VESDA & Life-Safety Verified", msg: "Integrated BMS leak ropes, VESDA laser smoke detection, and Novec 1230 suppression active." });
      }

      if (activeRacks.length > 0 && !project.includeUpsContainer) {
        validations.push({ status: "WARNING", code: "VAL-04", title: "Modular UPS Excluded", msg: `No Modular UPS configured for ${project.uptimeTier} facility.` });
      } else if (upsContainersCount > 0) {
        const nPlus1Kva = Math.max(0, (upsContainersCount - 1) * upsFrameKva);
        if (project.uptimeTier !== "Tier II" && nPlus1Kva < totalFacilityPeakKva) {
          validations.push({ status: "WARNING", code: "VAL-04", title: "UPS N+1 Headroom Tight", msg: `N+1 capacity (${nPlus1Kva} kVA) is below peak facility demand (${totalFacilityPeakKva} kVA).` });
        } else {
          validations.push({ status: "PASS", code: "VAL-04", title: "Substation & Modular UPS Verified", msg: `${transformerUnits} × 2000 kVA Trafos + ${upsContainersCount} × ${upsFrameKva} kVA UPS (${nPlus1Kva} kVA N+1).` });
        }
      }

      if (isHighSeismic && pods.length > 0) {
        validations.push({ status: "PASS", code: "VAL-05", title: `${project.seismicZone} Seismic Engineering Applied`, msg: `IS 1893 Z=${project.seismicZFactor} heavy gussets & flexible braided coolant loops included.` });
      }

      if (boundaryNoiseDba > 65 && !project.includeAcousticBarrier) {
        validations.push({ status: "WARNING", code: "VAL-06", title: "CPCB Boundary Noise Exceeds 65 dBA", msg: `Estimated boundary noise is ${boundaryNoiseDba} dBA at ${project.setbackMeters}m setback. Enable Acoustic Barrier Wall in Step 4.` });
      } else if (pods.length > 0) {
        validations.push({ status: "PASS", code: "VAL-06", title: "Boundary Acoustic Envelope Verified", msg: `Estimated perimeter sound is ${boundaryNoiseDba} dBA (within CPCB 65 dBA industrial limit).` });
      }

      if (project.setbackMeters < 6.0) {
        validations.push({ status: "FAIL", code: "VAL-07", title: "NBC Fire-Tender Driveway Violation", msg: `Setback is ${project.setbackMeters}m. Indian NBC Part 4 requires >= 6.0m clear fire-tender access.` });
      } else {
        validations.push({ status: "PASS", code: "VAL-07", title: "NBC Setback & Parcel Fit Verified", msg: `${project.setbackMeters}m fire lane preserved; ${plotUtilizationPct}% net buildable plot utilized.` });
      }

      const failCount = validations.filter(v => v.status === "FAIL").length;
      const warnCount = validations.filter(v => v.status === "WARNING").length;

      return {
        activeRacks, pods, totalNameplatePeakKw, totalDesignContKw, totalActualKw, totalLiquidKw, totalAirKw,
        totalFlowLpm, maxReqDeltaPBar, pumpDesignHeadBar, pumpSkidsCount, totalWaterStorageLitres, waterTankUnits,
        extCduRequiredKw, hasDlcRacks, hasExtCduRacks,
        recommendedCoolingMode, coolingMode, annualWueLPerKwh, trimChillerKw,
        pueDesign, totalFacilityPeakKw, totalFacilityPeakKva,
        transformerUnits, lvSwitchgearUnits, upsContainersCount, batteryContainersCount, dgUnitsCount,
        extCduUnits, adiabaticUnits, trimChillerUnits, roomDehumUnits,
        sharedWallSavingsSqm, bomItems, totals, capexSellingPreTax, servicesAmcPreTax,
        day1CapexPreTax, dayNCapexPreTax,
        annualPowerCostInr, annualWaterCostInr, annualAmcCostInr, annualTotalOpexInr, fiveYearTcoInr,
        grossPlotSqm, netBuildableSqm, requiredFootprintSqm, plotUtilizationPct,
        boundaryNoiseDba, ganttTasks, validations, failCount, warnCount
      };
    }

    function formatMoney(valInr, currency = "INR", standards = INITIAL_STANDARDS) {
      if (currency === "USD") {
        const v = valInr / (standards.usdRate || 84);
        return "$" + (v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : Math.round(v).toLocaleString("en-US"));
      }
      if (currency === "EUR") {
        const v = valInr / (standards.eurRate || 91);
        return "€" + (v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : Math.round(v).toLocaleString("en-US"));
      }
      if (valInr >= 1e7) return "₹" + (valInr / 1e7).toFixed(2) + " Cr";
      if (valInr >= 1e5) return "₹" + (valInr / 1e5).toFixed(2) + " L";
      return "₹" + Math.round(valInr).toLocaleString("en-IN");
    }

    function ThreeDStudio({ project, eng }) {
      const mountRef = useRef(null);
      const [viewScope, setViewScope] = useState("Hall");
      const [selectedPodIdx, setSelectedPodIdx] = useState(0);
      const [isLoadedMode, setIsLoadedMode] = useState(true);
      const [cameraPreset, setCameraPreset] = useState("Iso");
      const [layers, setLayers] = useState({
        shell: true,
        floorTransparent: true,
        plumbing: true,
        buswaysData: true,
        roomCooling: true,
        racks: true,
        supportPods: true
      });

      const cameraRef = useRef(null);
      const controlsRef = useRef(null);

      useEffect(() => {
        const el = mountRef.current;
        if (!el || !window.THREE) return;
        const width = el.clientWidth || 800;
        const height = el.clientHeight || 480;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0B1528);
        scene.fog = new THREE.FogExp2(0x0B1528, 0.008);

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 300);
        camera.position.set(16, 13, 18);
        cameraRef.current = camera;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        el.innerHTML = "";
        el.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.maxPolarAngle = Math.PI * 0.49;
        controlsRef.current = controls;

        scene.add(new THREE.AmbientLight(0xffffff, 0.65));
        const dir = new THREE.DirectionalLight(0xffffff, 0.9);
        dir.position.set(22, 32, 18);
        scene.add(dir);
        const fill = new THREE.DirectionalLight(0x60A5FA, 0.35);
        fill.position.set(-18, 12, -16);
        scene.add(fill);

        scene.add(new THREE.GridHelper(80, 80, 0x1E3A8A, 0x172554));

        const podsToRender = viewScope === "SinglePod"
          ? [eng.pods[selectedPodIdx] || eng.pods[0]].filter(Boolean)
          : eng.pods;

        const isGanged = viewScope === "Hall" && project.hallTopology !== "Isolated";
        const isUShaped = viewScope === "Hall" && project.hallTopology === "GangedUShaped";
        const spacing = isGanged ? 0.08 : 2.6;

        const matWall = new THREE.MeshStandardMaterial({
          color: project.metallurgy.includes("SS316") ? 0x94A3B8 : 0x1E3A8A,
          roughness: 0.45, metalness: 0.65, transparent: true, opacity: 0.24, side: THREE.DoubleSide
        });
        const matFrame = new THREE.MeshStandardMaterial({ color: 0xFF5539, roughness: 0.4, metalness: 0.5 });
        const matPlinth = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
        const matFloor = new THREE.MeshStandardMaterial({
          color: 0x475569, roughness: 0.5, metalness: 0.2,
          transparent: layers.floorTransparent,
          opacity: layers.floorTransparent ? 0.28 : 0.92
        });
        const matSupplyPipe = new THREE.MeshStandardMaterial({ color: 0x0EA5E9, roughness: 0.3, metalness: 0.7 });
        const matReturnPipe = new THREE.MeshStandardMaterial({ color: 0xFF5539, roughness: 0.3, metalness: 0.7 });
        const matBusA = new THREE.MeshStandardMaterial({ color: 0x2563EB, emissive: 0x1D4ED8, emissiveIntensity: 0.2 });
        const matBusB = new THREE.MeshStandardMaterial({ color: 0xF97316, emissive: 0xEA580C, emissiveIntensity: 0.2 });
        const matFiberTray = new THREE.MeshStandardMaterial({ color: 0xFACC15, roughness: 0.4 });
        const matAcUnit = new THREE.MeshStandardMaterial({ color: 0x00B290, roughness: 0.35, metalness: 0.3 });

        const totalSpanW = podsToRender.reduce((acc, p) => acc + p.extWidthMm / 1000 + spacing, -spacing);
        let cursorX = -totalSpanW / 2;

        podsToRender.forEach((pod, pIdx) => {
          const L = pod.extLengthMm / 1000;
          const W = pod.extWidthMm / 1000;
          const H = pod.extHeightMm / 1000;
          const plenumH = project.plenumHeightMm / 1000;
          const plinthH = 0.45;

          const podGroup = new THREE.Group();
          if (isUShaped && podsToRender.length >= 3) {
            if (pIdx === 0) podGroup.position.set(-L * 0.65, 0, 0);
            else if (pIdx === podsToRender.length - 1) podGroup.position.set(L * 0.65, 0, 0);
            else {
              podGroup.rotation.y = Math.PI / 2;
              podGroup.position.set((pIdx - 1) * (W + 0.1), 0, -L * 0.75);
            }
          } else {
            podGroup.position.set(cursorX + W / 2, 0, 0);
            cursorX += W + spacing;
          }

          const plinth = new THREE.Mesh(new THREE.BoxGeometry(W + 0.3, plinthH, L + 0.3), matPlinth);
          plinth.position.y = plinthH / 2;
          podGroup.add(plinth);

          const floorDeck = new THREE.Mesh(new THREE.BoxGeometry(W - 0.15, 0.06, L - 0.15), matFloor);
          floorDeck.position.y = plinthH + plenumH;
          podGroup.add(floorDeck);

          if (layers.shell) {
            const skipLeftWall = isGanged && pIdx > 0 && !isUShaped;
            const skipRightWall = isGanged && pIdx < podsToRender.length - 1 && !isUShaped;

            if (!skipLeftWall) {
              const leftW = new THREE.Mesh(new THREE.BoxGeometry(0.08, H, L), matWall);
              leftW.position.set(-W / 2, plinthH + H / 2, 0);
              podGroup.add(leftW);
            }
            if (!skipRightWall) {
              const rightW = new THREE.Mesh(new THREE.BoxGeometry(0.08, H, L), matWall);
              rightW.position.set(W / 2, plinthH + H / 2, 0);
              podGroup.add(rightW);
            }
            const frontW = new THREE.Mesh(new THREE.BoxGeometry(W, H, 0.08), matWall);
            frontW.position.set(0, plinthH + H / 2, L / 2);
            podGroup.add(frontW);

            const backW = new THREE.Mesh(new THREE.BoxGeometry(W, H, 0.08), matWall);
            backW.position.set(0, plinthH + H / 2, -L / 2);
            podGroup.add(backW);

            [[-W/2, -L/2], [W/2, -L/2], [-W/2, L/2], [W/2, L/2]].forEach(([cx, cz]) => {
              const post = new THREE.Mesh(new THREE.BoxGeometry(0.16, H, 0.16), matFrame);
              post.position.set(cx, plinthH + H / 2, cz);
              podGroup.add(post);
            });
          }

          if (layers.plumbing) {
            [-W * 0.26, W * 0.26].forEach(rx => {
              const sup = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, L - 0.4, 14), matSupplyPipe);
              sup.rotation.x = Math.PI / 2;
              sup.position.set(rx - 0.1, plinthH + plenumH * 0.45, 0);
              podGroup.add(sup);

              const ret = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, L - 0.4, 14), matReturnPipe);
              ret.rotation.x = Math.PI / 2;
              ret.position.set(rx + 0.1, plinthH + plenumH * 0.65, 0);
              podGroup.add(ret);
            });
          }

          if (layers.buswaysData) {
            const busY = plinthH + H - 0.35;
            [-W * 0.28, W * 0.28].forEach(rx => {
              const busA = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, L - 0.5), matBusA);
              busA.position.set(rx - 0.14, busY, 0);
              podGroup.add(busA);

              const busB = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, L - 0.5), matBusB);
              busB.position.set(rx + 0.14, busY, 0);
              podGroup.add(busB);

              const fiber = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.06, L - 0.5), matFiberTray);
              fiber.position.set(rx, busY - 0.22, 0);
              podGroup.add(fiber);
            });
          }

          if (layers.roomCooling && project.includeRoomDehum) {
            const acBox = new THREE.Mesh(new THREE.BoxGeometry(1.1, 2.1, 0.65), matAcUnit);
            acBox.position.set(0, plinthH + plenumH + 1.05, -L / 2 + 0.55);
            podGroup.add(acBox);
          }

          if (isLoadedMode && layers.racks) {
            const renderRow = (rowRacks, sideSign) => {
              let zCursor = -L / 2 + 1.2;
              rowRacks.forEach(rk => {
                const rW = rk.widthMm / 1000;
                const rH = rk.heightMm / 1000;
                const rD = rk.depthMm / 1000;
                const rx = sideSign * (W * 0.27);
                const rz = zCursor + rW / 2;

                const cabinet = new THREE.Mesh(
                  new THREE.BoxGeometry(rD, rH, rW),
                  new THREE.MeshStandardMaterial({ color: new THREE.Color(rk.color || "#002870"), roughness: 0.35, metalness: 0.45 })
                );
                cabinet.position.set(rx, plinthH + plenumH + 0.08 + rH / 2, rz);
                podGroup.add(cabinet);

                if (rk.category === "DLC") {
                  const drop = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, plenumH + 0.25, 10), matSupplyPipe);
                  drop.position.set(rx, plinthH + plenumH * 0.55, rz);
                  podGroup.add(drop);
                }
                zCursor += rW + 0.08;
              });
            };
            renderRow(pod.rowA || [], -1);
            renderRow(pod.rowB || [], 1);
          }

          scene.add(podGroup);
        });

        if (viewScope === "Hall" && layers.supportPods) {
          const baseZ = (podsToRender[0]?.extLengthMm || 12000) / 2000 + 4.5;
          const addSupportBox = (x, z, w, h, l, col) => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, l), new THREE.MeshStandardMaterial({ color: col, roughness: 0.45, metalness: 0.35 }));
            m.position.set(x, h / 2 + 0.2, z);
            scene.add(m);
          };
          if (project.includeStagingModule) addSupportBox(-6, baseZ, 4.2, 3.6, 8.0, 0xD97706);
          if (project.includeAdminModule) addSupportBox(0, baseZ, 3.2, 3.2, 12.19, 0x0D9488);
          if (project.includeUpsContainer) addSupportBox(6, baseZ, 3.0, 3.2, 12.19, 0x4F46E5);
          if (project.includeBatteryContainer) addSupportBox(10.5, baseZ, 3.0, 3.2, 12.19, 0xDC2626);
          if (project.includeWaterTanks) addSupportBox(-11, baseZ, 3.5, 2.8, 6.0, 0x0284C7);
        }

        let animId;
        const animate = () => {
          animId = requestAnimationFrame(animate);
          controls.update();
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(animId);
          renderer.dispose();
        };
      }, [project, eng, viewScope, selectedPodIdx, isLoadedMode, layers]);

      const applyPreset = (preset) => {
        setCameraPreset(preset);
        const cam = cameraRef.current;
        const ctrl = controlsRef.current;
        if (!cam || !ctrl) return;
        ctrl.target.set(0, 2, 0);
        if (preset === "Iso") cam.position.set(16, 13, 18);
        else if (preset === "Top") cam.position.set(0, 26, 0.1);
        else if (preset === "Aisle") cam.position.set(0, 2.4, 11);
        else if (preset === "Plenum") {
          setLayers(l => ({ ...l, floorTransparent: true }));
          cam.position.set(6, 1.3, 9);
          ctrl.target.set(0, 0.8, 0);
        } else if (preset === "Rear") cam.position.set(-12, 5, -14);
        ctrl.update();
      };

      const toggleLayer = (k) => setLayers(prev => ({ ...prev, [k]: !prev[k] }));

      return (
        <div className="bg-white rounded-xl card-shadow border border-slate-200 overflow-hidden">
          <div className="navy-bg text-white p-4 flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 className="text-lg font-bold">Interactive 360° 3D Container & Hall Studio</h2>
              <p className="text-xs text-slate-300">Orbit 360° • Inspect Empty Shell vs. Loaded 2-Row MEP, Underfloor SS316 Headers, Water Tanks & Support Pods</p>
            </div>
            <div className="flex flex-wrap gap-2">
              <div className="bg-slate-900/60 p-1 rounded-lg flex">
                <button onClick={() => setViewScope("Hall")} className={`px-3 py-1.5 rounded text-xs font-bold ${viewScope === "Hall" ? "coral-bg text-white" : "text-slate-300"}`}>
                  Full Hall ({eng.pods.length} Pods)
                </button>
                <button onClick={() => setViewScope("SinglePod")} className={`px-3 py-1.5 rounded text-xs font-bold ${viewScope === "SinglePod" ? "coral-bg text-white" : "text-slate-300"}`}>
                  Single Container
                </button>
              </div>
              {viewScope === "SinglePod" && eng.pods.length > 0 && (
                <select value={selectedPodIdx} onChange={e => setSelectedPodIdx(Number(e.target.value))} className="bg-slate-800 text-white text-xs rounded-lg px-2.5 py-1.5 border border-slate-600">
                  {eng.pods.map((p, idx) => (
                    <option key={p.id} value={idx}>{p.label} ({Math.round(p.designContKw)} kW | {(p.extLengthMm/1000).toFixed(2)}m)</option>
                  ))}
                </select>
              )}
              <div className="bg-slate-900/60 p-1 rounded-lg flex">
                <button onClick={() => setIsLoadedMode(false)} className={`px-3 py-1.5 rounded text-xs font-bold ${!isLoadedMode ? "bg-amber-500 text-slate-950" : "text-slate-300"}`}>
                  Empty Shell
                </button>
                <button onClick={() => setIsLoadedMode(true)} className={`px-3 py-1.5 rounded text-xs font-bold ${isLoadedMode ? "bg-emerald-500 text-slate-950" : "text-slate-300"}`}>
                  Loaded Cluster
                </button>
              </div>
            </div>
          </div>

          <div className="bg-slate-100 px-4 py-2.5 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2 text-xs">
            <div className="flex flex-wrap items-center gap-1.5">
              <span className="font-bold text-slate-600 mr-1">Camera:</span>
              {["Iso", "Top", "Aisle", "Plenum", "Rear"].map(pr => (
                <button key={pr} onClick={() => applyPreset(pr)} className={`px-2.5 py-1 rounded font-medium ${cameraPreset === pr ? "navy-bg text-white" : "bg-white border border-slate-300 text-slate-700"}`}>
                  {pr === "Plenum" ? "Underfloor Plenum" : pr}
                </button>
              ))}
            </div>
            <div className="flex flex-wrap items-center gap-1.5">
              <span className="font-bold text-slate-600 mr-1">MEP Layers:</span>
              {[
                ["shell", "Shell"],
                ["floorTransparent", "Glass Floor"],
                ["plumbing", "SS316 Headers"],
                ["buswaysData", "Busways & Fiber"],
                ["roomCooling", "Room AC"],
                ["racks", "Racks"],
                ["supportPods", "Tanks/UPS/BESS"]
              ].map(([k, lbl]) => (
                <button key={k} onClick={() => toggleLayer(k)} className={`px-2 py-1 rounded font-medium border ${layers[k] ? "bg-blue-50 border-blue-500 text-blue-900" : "bg-white border-slate-300 text-slate-400"}`}>
                  {layers[k] ? "✓ " : ""}{lbl}
                </button>
              ))}
            </div>
          </div>

          {eng.pods.length === 0 ? (
            <div className="h-[420px] bg-slate-950 text-slate-300 flex flex-col items-center justify-center p-6 text-center">
              <p className="text-base font-bold text-white">No IT Racks Placed Yet</p>
              <p className="text-xs text-slate-400 mt-1 max-w-md">Open the Design Wizard (Step 2) to add IT compute racks—the 3D container & hall geometry will generate automatically.</p>
            </div>
          ) : (
            <div ref={mountRef} className="w-full h-[480px] bg-slate-950 cursor-grab active:cursor-grabbing" />
          )}
        </div>
      );
    }

    function ParcelLayoutPlanner({ project, eng, onUpdateProject }) {
      const [statusMsg, setStatusMsg] = useState("");
      const verts = project.parcelVertices || [];
      const minX = Math.min(...verts.map(v => v.x), 0);
      const maxX = Math.max(...verts.map(v => v.x), 100);
      const minY = Math.min(...verts.map(v => v.y), 0);
      const maxY = Math.max(...verts.map(v => v.y), 80);
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;

      const loadPresetShape = (shape) => {
        if (shape === "IrregularTrapezoid") {
          onUpdateProject({ parcelShape: shape, parcelVertices: [{ x: 0, y: 0 }, { x: 92, y: 0 }, { x: 108, y: 64 }, { x: 14, y: 78 }] });
        } else if (shape === "LShaped") {
          onUpdateProject({ parcelShape: shape, parcelVertices: [{ x: 0, y: 0 }, { x: 110, y: 0 }, { x: 110, y: 42 }, { x: 56, y: 42 }, { x: 56, y: 85 }, { x: 0, y: 85 }] });
        } else if (shape === "PentagonPlot") {
          onUpdateProject({ parcelShape: shape, parcelVertices: [{ x: 10, y: 0 }, { x: 95, y: 5 }, { x: 115, y: 48 }, { x: 62, y: 86 }, { x: 0, y: 55 }] });
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const txt = ev.target.result;
          try {
            if (file.name.endsWith(".json") || file.name.endsWith(".geojson")) {
              const gj = JSON.parse(txt);
              const coords = gj.features?.[0]?.geometry?.coordinates?.[0] || gj.geometry?.coordinates?.[0];
              if (coords && coords.length >= 3) {
                const lon0 = coords[0][0], lat0 = coords[0][1];
                const pts = coords.slice(0, -1).map(([lon, lat]) => ({
                  x: Math.round((lon - lon0) * 111320 * Math.cos(lat0 * Math.PI / 180)),
                  y: Math.round((lat - lat0) * 110540)
                }));
                const offX = Math.min(...pts.map(p => p.x));
                const offY = Math.min(...pts.map(p => p.y));
                onUpdateProject({ parcelShape: "CustomGeoJSON", parcelVertices: pts.map(p => ({ x: p.x - offX, y: p.y - offY })) });
                setStatusMsg(`Imported ${pts.length} survey vertices from ${file.name}`);
              }
            } else if (file.name.endsWith(".kml")) {
              const match = txt.match(/<coordinates>([\s\S]*?)<\/coordinates>/i);
              if (match) {
                const rawPts = match[1].trim().split(/\s+/).map(pair => pair.split(",").map(Number));
                const lon0 = rawPts[0][0], lat0 = rawPts[0][1];
                const pts = rawPts.slice(0, -1).map(([lon, lat]) => ({
                  x: Math.round((lon - lon0) * 111320 * Math.cos(lat0 * Math.PI / 180)),
                  y: Math.round((lat - lat0) * 110540)
                }));
                const offX = Math.min(...pts.map(p => p.x));
                const offY = Math.min(...pts.map(p => p.y));
                onUpdateProject({ parcelShape: "CustomKML", parcelVertices: pts.map(p => ({ x: p.x - offX, y: p.y - offY })) });
                setStatusMsg(`Imported ${pts.length} vertices from KML survey`);
              }
            }
          } catch (err) {
            setStatusMsg("Could not parse KML/GeoJSON coordinates.");
          }
        };
        reader.readAsText(file);
      };

      const polyStr = verts.map(v => `${v.x},${v.y}`).join(" ");

      return (
        <div className="bg-white rounded-xl card-shadow border border-slate-200 p-5 space-y-4">
          <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 pb-3">
            <div>
              <h3 className="text-lg font-bold navy-text">Irregular Land Parcel & Geomap Auto-Layout Solver</h3>
              <p className="text-xs text-slate-500">Trace or import survey boundaries (.KML / .GeoJSON), apply statutory fire setbacks, and auto-orient modular blocks</p>
            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={() => loadPresetShape("IrregularTrapezoid")} className="px-3 py-1.5 text-xs font-bold rounded border border-slate-300 hover:bg-slate-50">Trapezoid Plot</button>
              <button onClick={() => loadPresetShape("LShaped")} className="px-3 py-1.5 text-xs font-bold rounded border border-slate-300 hover:bg-slate-50">L-Shaped Plot</button>
              <button onClick={() => loadPresetShape("PentagonPlot")} className="px-3 py-1.5 text-xs font-bold rounded border border-slate-300 hover:bg-slate-50">5-Sided Polygon</button>
              <label className="px-3 py-1.5 text-xs font-bold rounded navy-bg text-white cursor-pointer">
                Import .KML / .GeoJSON
                <input type="file" accept=".kml,.json,.geojson" onChange={handleFileUpload} className="hidden" />
              </label>
            </div>
          </div>

          {statusMsg && <div className="text-xs bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-2 rounded">{statusMsg}</div>}

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
            <div className="space-y-3 text-xs">
              <div className="p-3 bg-slate-50 rounded-lg border border-slate-200 space-y-2">
                <div className="font-bold navy-text uppercase">Parcel Metrics & Fit Analysis</div>
                <div className="flex justify-between"><span>Gross Survey Area:</span><span className="font-bold">{Math.round(eng.grossPlotSqm).toLocaleString()} m²</span></div>
                <div className="flex justify-between"><span>Net Buildable Zone:</span><span className="font-bold">{Math.round(eng.netBuildableSqm).toLocaleString()} m²</span></div>
                <div className="flex justify-between"><span>Required Campus Footprint:</span><span className="font-bold">{Math.round(eng.requiredFootprintSqm).toLocaleString()} m²</span></div>
                <div className="flex justify-between items-center pt-1 border-t border-slate-200">
                  <span>Plot Utilization:</span>
                  <span className={`px-2 py-0.5 rounded font-bold ${eng.plotUtilizationPct > 90 ? "bg-red-100 text-red-800" : "bg-emerald-100 text-emerald-800"}`}>
                    {eng.plotUtilizationPct}%
                  </span>
                </div>
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Cluster Orientation Angle ({project.hallRotationDeg}°)</label>
                <input type="range" min="-90" max="90" value={project.hallRotationDeg} onChange={e => onUpdateProject({ hallRotationDeg: Number(e.target.value) })} className="w-full" />
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1">Perimeter Fire-Tender Setback (m)</label>
                <input type="number" step="0.5" value={project.setbackMeters} onChange={e => onUpdateProject({ setbackMeters: Number(e.target.value) })} className="w-full border border-slate-300 rounded px-2.5 py-1.5" />
              </div>
            </div>

            <div className="lg:col-span-2 bg-slate-950 rounded-xl p-3 border border-slate-800 flex flex-col items-center justify-center">
              <svg viewBox={`${minX - 12} ${minY - 12} ${maxX - minX + 24} ${maxY - minY + 24}`} className="w-full h-[320px]">
                <polygon points={polyStr} fill="rgba(14, 165, 233, 0.10)" stroke="#38BDF8" strokeWidth="0.8" />
                <polygon points={polyStr} transform={`translate(${cx},${cy}) scale(0.86) translate(${-cx},${-cy})`} fill="rgba(16, 185, 129, 0.08)" stroke="#10B981" strokeWidth="0.5" strokeDasharray="1.5,1" />
                <g transform={`translate(${cx}, ${cy}) rotate(${project.hallRotationDeg})`}>
                  {eng.pods.slice(0, 8).map((p, idx) => {
                    const pw = p.extWidthMm / 1000;
                    const pl = p.extLengthMm / 1000;
                    const step = project.hallTopology === "Isolated" ? pw + 2.4 : pw + 0.15;
                    const xPos = -((Math.min(eng.pods.length, 8) * step) / 2) + idx * step;
                    return (
                      <g key={p.id}>
                        <rect x={xPos} y={-pl / 2} width={pw} height={pl} fill="#002870" stroke="#60A5FA" strokeWidth="0.35" />
                        <text x={xPos + pw/2} y={0} fill="#FFFFFF" fontSize="1.8" textAnchor="middle" transform={`rotate(-90, ${xPos + pw/2}, 0)`}>
                          {p.label}
                        </text>
                      </g>
                    );
                  })}
                </g>
              </svg>
            </div>
          </div>
        </div>
      );
    }

        ["A-101", "Master Site & Parcel Layout"],

        <div className="bg-white rounded-xl card-shadow border border-slate-200 overflow-hidden">

            <div className="flex flex-wrap gap-1.5">

          </div>

          <div className="p-4 flex justify-center" style={{ backgroundColor: bg }}>
            <svg viewBox="0 0 1100 560" className="w-full max-w-5xl border" style={{ borderColor: primary }}>
              <rect x="0" y="0" width="1100" height="560" fill={bg} />
              <rect x="16" y="16" width="1068" height="528" fill="none" stroke={primary} strokeWidth="2" />
              <text x="40" y="52" fill={accent} fontSize="16" fontWeight="bold">SHEET {sheet} — {project.name} ({project.seismicZone})</text>
              {sheet === "M-301" ? (
                <g>
                  {[
                    [70, "MAKE-UP WATER TANKS", `${(eng.totalWaterStorageLitres/1000)} kL Storage`],
                    [310, "N+1 VFD PUMP SKIDS", `${eng.pumpSkidsCount} Skids @ ${eng.pumpDesignHeadBar} bar`],
                    [560, "CDUs & SS316 HEADERS", `${Math.round(eng.totalFlowLpm)} LPM Total Flow`],

                    <g key={idx} transform={`translate(${x}, 200)`}>
                      <rect x="0" y="0" width="205" height="110" fill="none" stroke="#38BDF8" strokeWidth="2" />

              ) : (
                <g>
                  {[
                    [90, "MV TRAFO & SWITCHGEAR", `${eng.transformerUnits} × 2000 kVA`],
                    [330, "CPCB IV+ DG & UPS", `${eng.dgUnitsCount} DGs | ${eng.upsContainersCount} UPS`],
                    [570, "BMS, VESDA & CCTV", "Integrated Safety & DCIM"],
                    [810, "IT PODS & HALL", `${eng.pods.length} Pods (${(eng.totalDesignContKw/1000).toFixed(2)} MW)`]
                  ].map(([x, title, sub], idx) => (
                    <g key={idx} transform={`translate(${x}, 200)`}>
                      <rect x="0" y="0" width="200" height="110" fill="none" stroke={primary} strokeWidth="2" />
                      <text x="100" y="45" fill={accent} fontSize="11" fontWeight="bold" textAnchor="middle">{title}</text>
                      <text x="100" y="72" fill={fg} fontSize="10" textAnchor="middle">{sub}</text>
                    </g>
                  ))}
                </g>
              )}
            </svg>
          </div>
        </div>
      );
    }

    function App() {
      const [screen, setScreen] = useState("home"); // "home" | "projects" | "wizard" | "workspace" | "studio3d" | "outputs" | "supply_intel" | "parameters"
      const [projects, setProjects] = useState(() => [makeSampleProject(INITIAL_STANDARDS)]);
      const [editingId, setEditingId] = useState("proj-15mw-sample");
      const [skus, setSkus] = useState(INITIAL_SKUS);
      const [containerCatalog, setContainerCatalog] = useState(INITIAL_CONTAINER_CATALOG);
      const [rateCard, setRateCard] = useState(DEFAULT_RATE_CARD);
      const [standards, setStandards] = useState(INITIAL_STANDARDS);
      const [logoDataUrl, setLogoDataUrl] = useState("");
      const [clientId, setClientId] = useState(DEFAULT_CLIENT_ID);
      const [driveToken, setDriveToken] = useState("");
      const [driveStatus, setDriveStatus] = useState("Local Ready");

      const [wizardTab, setWizardTab] = useState(0);
      const [wizardMode, setWizardMode] = useState("create");
      const [paramTab, setParamTab] = useState("skus");
      const [editingSkuId, setEditingSkuId] = useState(null);
      const [weatherLoading, setWeatherLoading] = useState(false);
      const [weatherMsg, setWeatherMsg] = useState("");
      const [bulkLoadValue, setBulkLoadValue] = useState(220);

      useEffect(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.projects?.length) setProjects(parsed.projects);
            if (parsed.editingId) setEditingId(parsed.editingId);
            if (parsed.skus?.length) setSkus(parsed.skus);
            if (parsed.containerCatalog?.length) setContainerCatalog(parsed.containerCatalog);
            if (parsed.rateCard) setRateCard(parsed.rateCard);
            if (parsed.standards) setStandards({ ...INITIAL_STANDARDS, ...parsed.standards });
            if (parsed.logoDataUrl) setLogoDataUrl(parsed.logoDataUrl);
            if (parsed.clientId) setClientId(parsed.clientId);
          }
        } catch (e) {}
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ projects, editingId, skus, containerCatalog, rateCard, standards, logoDataUrl, clientId }));
        } catch (e) {}
      }, [projects, editingId, skus, containerCatalog, rateCard, standards, logoDataUrl, clientId]);

      const currentProject = useMemo(
        () => projects.find(p => p.id === editingId) || projects[0],
        [projects, editingId]
      );

      const eng = useMemo(
        () => computeEngineering(currentProject, skus, rateCard, standards),
        [currentProject, skus, rateCard, standards]
      );

      const updateCurrentProject = (patch) => {
        setProjects(prev => prev.map(p => p.id === currentProject.id ? { ...p, ...patch, updatedAt: new Date().toISOString().slice(0, 10) } : p));
      };

      // Open-Meteo Weather & Indian IS 1893 Seismic Zone Lookup
      const fetchCityWeatherAndSeismic = async () => {
        const q = (currentProject.cityQuery || "").trim();
        if (!q) return;
        setWeatherLoading(true);
        setWeatherMsg("Fetching live climate & seismic zone...");
        try {
          const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`);
          const geoData = await geoRes.json();
          const place = geoData.results?.[0];
          if (!place) {
            const seis = classifySeismicZone(q, 20, 78);
            updateCurrentProject({ seismicZone: seis.zone, seismicZFactor: seis.zFactor, seismicLabel: seis.label });
            setWeatherMsg(`City coordinates not found in Open-Meteo; applied ${seis.label}. You can adjust Dry/Wet Bulb manually.`);
            setWeatherLoading(false);
            return;
          }
          const { latitude, longitude, elevation, name, country, admin1 } = place;
          const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=temperature_2m_max&current=relative_humidity_2m,temperature_2m&timezone=auto`);
          const wData = await wRes.json();
          const maxForecast = Math.max(...(wData.daily?.temperature_2m_max || [38]));
          const peakDryBulb = Number(Math.max(maxForecast, 34).toFixed(1));
          const rh = wData.current?.relative_humidity_2m || 65;
          // Stull wet-bulb approximation
          const T = peakDryBulb;
          const tw = T * Math.atan(0.151977 * Math.pow(rh + 8.313659, 0.5)) + Math.atan(T + rh) - Math.atan(rh - 1.676331) + 0.00391838 * Math.pow(rh, 1.5) * Math.atan(0.023101 * rh) - 4.686035;
          const peakWetBulb = Number(Math.max(18, Math.min(peakDryBulb - 2, tw)).toFixed(1));
          const seis = classifySeismicZone(`${name} ${admin1 || ""}`, latitude, longitude);

          updateCurrentProject({
            cityQuery: `${name}${admin1 ? ", " + admin1 : ""}${country ? " (" + country + ")" : ""}`,
            lat: Number(latitude.toFixed(2)),
            lon: Number(longitude.toFixed(2)),
            elevationM: Math.round(elevation || 0),
            peakDryBulb,
            peakWetBulb,
            relHumidityPct: rh,
            seismicZone: seis.zone,
            seismicZFactor: seis.zFactor,
            seismicLabel: seis.label
          });
          setWeatherMsg(`✓ Resolved ${name}: ${peakDryBulb}°C DB, ${peakWetBulb}°C WB, Elev ${Math.round(elevation || 0)}m, ${seis.label}`);
        } catch (e) {
          const seis = classifySeismicZone(q, 20, 78);
          updateCurrentProject({ seismicZone: seis.zone, seismicZFactor: seis.zFactor, seismicLabel: seis.label });
          setWeatherMsg(`Offline mode: Applied ${seis.label}. Adjust Dry/Wet Bulb manually below.`);
        }
        setWeatherLoading(false);
      };

      const updateRackQuantitiesWithAutoCooling = (nextQuantities) => {
        const skuMap = Object.fromEntries(skus.map(s => [s.id, s]));
        let anyRacks = false;
        let anyDlc = false;
        let anyExtCdu = false;
        Object.entries(nextQuantities).forEach(([id, q]) => {
          const qty = Number(q) || 0;
          const s = skuMap[id];
          if (s && qty > 0) {
            anyRacks = true;
            if (s.category === "DLC" || s.liquidSplitPct > 0) anyDlc = true;
            if (s.cduMode === "External") anyExtCdu = true;
          }
        });
        updateCurrentProject({
          rackQuantities: nextQuantities,
          includeLiquidLoop: anyDlc,
          includePumpSkids: anyDlc,
          includeWaterTanks: anyDlc,
          includeExtCdu: anyExtCdu,
          includeRoomDehum: anyRacks
        });
      };

      const startBlankProjectWizard = () => {
        const newId = "proj-" + Date.now();
        const np = makeBlankProject(newId, projects.length + 1, standards);
        setProjects(prev => [np, ...prev]);
        setEditingId(newId);
        setWizardMode("create");
        setWizardTab(0);
        setScreen("wizard");
      };

      const reRunWizardForCurrent = () => {
        setWizardMode("edit");
        setWizardTab(0);
        setScreen("wizard");
      };

      const autoBalanceRacksFromTargetMw = () => {
        const targetKw = (Number(currentProject.targetItMw) || 1.5) * 1000;
        const primaryDlc = skus.find(s => s.id === "sku-dlc-265") || skus.find(s => s.category === "DLC");
        const secondaryDlc = skus.find(s => s.id === "sku-helios");
        const acSku = skus.find(s => s.category === "AC");
        const nextQty = {};
        skus.forEach(s => nextQty[s.id] = 0);

        if (primaryDlc) {
          const dlcShareKw = targetKw * 0.94;
          const pKw = primaryDlc.peakKw * primaryDlc.continuousFactor;
          if (secondaryDlc && targetKw >= 6000) {
            nextQty[primaryDlc.id] = Math.max(1, Math.round((dlcShareKw * 0.68) / pKw));
            const sKw = secondaryDlc.peakKw * secondaryDlc.continuousFactor;
            nextQty[secondaryDlc.id] = Math.max(1, Math.round((dlcShareKw * 0.32) / sKw));
          } else {
            nextQty[primaryDlc.id] = Math.max(1, Math.round(dlcShareKw / pKw));
          }
        }
        if (acSku) {
          const acShareKw = Math.max(50, targetKw * 0.06);
          const aKw = acSku.peakKw * acSku.continuousFactor;
          nextQty[acSku.id] = Math.max(2, Math.round(acShareKw / aKw));
        }
        updateRackQuantitiesWithAutoCooling(nextQty);
      };

      const saveCurrentContainerToStandardCatalog = () => {
        const pod = eng.pods[0];
        const lenMm = pod ? pod.extLengthMm : currentProject.maxCustomLengthMm;
        const unitCost = currentProject.bespokeContainerPriceInr
          ? Number(currentProject.bespokeContainerPriceInr)
          : Math.round(((lenMm / 1000) * (currentProject.containerWidthMm / 1000) * 2 + 60) * 48000);
        const newEntry = {
          id: "cnt-saved-" + Date.now(),
          name: `Saved ${currentProject.metallurgy} Pod (${(lenMm/1000).toFixed(2)}m × ${(currentProject.containerWidthMm/1000).toFixed(2)}m)`,
          lengthMm: lenMm,
          widthMm: currentProject.containerWidthMm,
          heightMm: currentProject.containerHeightMm,
          metallurgy: currentProject.metallurgy,
          wallMm: currentProject.wallThicknessMm,
          roofMm: currentProject.roofThicknessMm,
          floorMm: currentProject.floorThicknessMm,
          plenumMm: currentProject.plenumHeightMm,
          topClearanceMm: currentProject.topClearanceMm,
          baseCostInr: unitCost,
          isBespoke: false
        };
        setContainerCatalog(prev => [newEntry, ...prev]);
        alert(`Saved "${newEntry.name}" to your Standard Container Catalog (₹${unitCost.toLocaleString("en-IN")} per pod)!`);
      };

      const handleGoogleSignIn = () => {
        if (!window.google?.accounts?.oauth2) return;
        const tokenClient = window.google.accounts.oauth2.initTokenClient({
          client_id: clientId,
          scope: DRIVE_SCOPE,
          callback: (resp) => {
            if (resp.access_token) {
              setDriveToken(resp.access_token);
              setDriveStatus("Google Drive Connected");
            }
          }
        });
        tokenClient.requestAccessToken();
      };

      const saveToGoogleDrive = async () => {
        if (!driveToken) { handleGoogleSignIn(); return; }
        setDriveStatus("Syncing...");
        try {
          const payload = JSON.stringify({ projects, skus, containerCatalog, rateCard, standards, exportedAt: new Date().toISOString() }, null, 2);
          const form = new FormData();
          form.append("metadata", new Blob([JSON.stringify({ name: "AI_MDC_Projects_Backup.json", mimeType: "application/json" })], { type: "application/json" }));
          form.append("file", new Blob([payload], { type: "application/json" }));
          const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
            method: "POST", headers: { Authorization: `Bearer ${driveToken}` }, body: form
          });
          if (res.ok) setDriveStatus("Saved to Drive ✓");
          else setDriveStatus("Reconnect Drive");
        } catch (e) { setDriveStatus("Sync Error"); }
      };

      const downloadCsv = (filename, rows) => {
        const csv = rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url; a.download = filename; a.click();
      };

      const exportEngineeringBomCsv = () => {
        const header = ["Category", "Subsystem / Item", "Make", "Model", "Technical Specifications", "Qty"];
        const rows = eng.bomItems.map(it => [it.category, it.label, it.make, it.model, it.specs, it.qty]);
        downloadCsv(`${currentProject.name.replace(/\s+/g, "_")}_Engineering_BOM.csv`, [header, ...rows]);
      };

      const exportCommercialPriceCsv = () => {
        const header = ["Category", "Item Description", "Make", "Model", "Qty", "Unit Cost", "Contingency (%)", "Margin (%)", "Pre-Tax Total", `GST (${currentProject.gstPct}%)`, "Grand Total Incl. GST"];
        const rows = eng.bomItems.map(it => [
          it.category, it.label, it.make, it.model, it.qty,
          Math.round(it.unitCost), currentProject.contingencyPct, currentProject.marginPct,
          Math.round(it.sellingPreTax), Math.round(it.gstAmt), Math.round(it.grandTotalInclGst)
        ]);
        downloadCsv(`${currentProject.name.replace(/\s+/g, "_")}_Commercial_Price_Sheet.csv`, [header, ...rows]);
      };

      const handleLogoUpload = (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = (ev) => setLogoDataUrl(ev.target.result);
        r.readAsDataURL(f);
      };

      return (
        <div className="h-screen flex flex-col overflow-hidden">
          {/* PINNED PERSISTENT TOP HEADER */}

            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">

                {logoDataUrl ? (
                  <img src={logoDataUrl} alt="Company Logo" className="h-9 w-auto bg-white rounded px-1.5 py-0.5 object-contain" />
                ) : (
                  <div className="w-9 h-9 rounded-lg coral-bg flex items-center justify-center font-black text-white text-sm tracking-tight">MDC</div>
                )}
                <div>
                  <h1 className="text-sm sm:text-base font-bold tracking-tight leading-tight">AI Modular Data Center Configurator</h1>
                  <p className="text-[11px] text-slate-300 hidden sm:block">Enterprise Facility Planner, 3D Studio & Executive Deck Generator</p>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <div className="flex items-center bg-slate-900/80 border border-slate-700 rounded-lg px-2.5 py-1 text-xs">
                  <span className="text-slate-400 mr-1.5 hidden md:inline">Active Deal:</span>
                  <select
                    value={editingId}
                    onChange={e => setEditingId(e.target.value)}
                    className="bg-transparent text-white font-bold focus:outline-none max-w-[180px] sm:max-w-[230px]"
                  >
                    {projects.map(p => (

                </div>

                <button

                    eng.failCount > 0 ? "bg-red-600 text-white" : eng.warnCount > 0 ? "bg-amber-400 text-slate-950" : "bg-emerald-500 text-slate-950"
                  }`}

                </button>

                <button onClick={reRunWizardForCurrent} className="touch-btn px-3 py-1.5 rounded-lg bg-blue-800 hover:bg-blue-700 border border-blue-600 text-xs font-bold">
                  ✎ Design Wizard

                    ⌂ Home

                {driveToken ? (
                  <button onClick={saveToGoogleDrive} className="touch-btn px-3 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-slate-950 text-xs font-bold">
                    ☁ {driveStatus}

                ) : (
                  <button onClick={handleGoogleSignIn} className="touch-btn px-3 py-1.5 rounded-lg coral-bg hover:opacity-95 text-white text-xs font-bold">
                    Sign in with Google
                  </button>

              </div>
            </div>
          </header>

          <main className="flex-1 overflow-y-auto">
            <div className="max-w-7xl w-full mx-auto p-4 sm:p-6">

              {/* 1. UNIFIED HUB-AND-SPOKE HOME DASHBOARD */}
              {screen === "home" && (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                  {/* CARD 01: Unified Projects: New / Open Hub */}
                  <div className="bg-white rounded-2xl p-6 card-shadow border-2 border-[#FF5539] flex flex-col justify-between min-h-[230px]">
                    <div>
                      <span className="inline-block px-2.5 py-1 rounded-md text-xs font-bold coral-bg text-white mb-2">01 • PROJECTS: NEW / OPEN</span>
                      <h2 className="text-xl font-bold navy-text">Start New or Open Deal</h2>
                      <p className="text-xs text-slate-600 mt-1">Create a blank-slate proposal via the 7-step Wizard, or open an existing customer configuration below:</p>
                      <div className="mt-3 space-y-1.5 max-h-28 overflow-y-auto">
                        {projects.map(p => (
                          <div
                            key={p.id}
                            onClick={() => { setEditingId(p.id); setScreen("workspace"); }}
                            className={`cursor-pointer px-2.5 py-1.5 rounded-lg border text-xs flex items-center justify-between ${p.id === editingId ? "border-blue-600 bg-blue-50 font-bold navy-text" : "border-slate-200 hover:bg-slate-50"}`}
                          >
                            <span className="truncate pr-2">{p.name}</span>
                            <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-200 text-slate-700 flex-shrink-0">Open →</span>
                          </div>
                        ))}
                      </div>
                    </div>
                    <div className="flex gap-2 mt-4 pt-2 border-t border-slate-100">
                      <button onClick={startBlankProjectWizard} className="flex-1 py-2 rounded-lg coral-bg text-white text-xs font-bold">
                        + New Blank Wizard
                      </button>
                      <button onClick={() => setScreen("projects")} className="px-3 py-2 rounded-lg border border-slate-300 text-xs font-bold navy-text">
                        All ({projects.length})
                      </button>
                    </div>
                  </div>

                  <div onClick={() => setScreen("workspace")} className="cursor-pointer bg-white rounded-2xl p-6 card-shadow border border-slate-200 hover:border-blue-600 transition flex flex-col justify-between min-h-[230px]">
                    <div>
                      <div className="flex items-center justify-between gap-2 mb-2">
                        <span className="px-2.5 py-1 rounded-md text-xs font-bold bg-emerald-100 text-emerald-900">02 • OPTIMIZER & VALIDATOR</span>
                        <span className="text-[10px] font-bold text-slate-400 truncate max-w-[140px]">Target: {currentProject.name}</span>
                      </div>
                      <h2 className="text-xl font-bold navy-text">Cluster Optimizer, Validator & TCO</h2>
                      <p className="text-sm text-slate-600 mt-1.5">Inspect the 8-rule Design Validator, Standard vs. Actual per-rack workload map, bespoke container pricing, 5-year TCO, and Gantt timeline.</p>

                  <div onClick={() => setScreen("studio3d")} className="cursor-pointer bg-white rounded-2xl p-6 card-shadow border border-slate-200 hover:border-blue-600 transition flex flex-col justify-between min-h-[230px]">

                        <span className="text-[10px] font-bold text-slate-400 truncate max-w-[140px]">Target: {currentProject.name}</span>
                      </div>
                      <h2 className="text-xl font-bold navy-text">360° 3D Container & Hall Studio</h2>
                      <p className="text-sm text-slate-600 mt-1.5">Orbit 360° around single containers or Linear/U-Shaped halls. Toggle Empty Shell vs. Loaded 2-Row racks, glass raised floor, SS316 headers & tanks.</p>

                  {/* CARD 04: Outputs, CAD & Branded Slide Deck */}
                  <div onClick={() => setScreen("outputs")} className="cursor-pointer bg-white rounded-2xl p-6 card-shadow border border-slate-200 hover:border-blue-600 transition flex flex-col justify-between min-h-[230px]">
                    <div>

                      <h2 className="text-xl font-bold navy-text">India Supply Chain Intelligence</h2>
