  mode: "local_and_drive",
  loadState(fallback) {
    try {
      const raw = localStorage.getItem(STORAGE_KEY_V12) || localStorage.getItem("ai_mdc_studio_v11_0_enterprise") || localStorage.getItem("ai_mdc_studio_v10_5_enterprise");

      return fallback;
    }
  },
  autoCache(stateObj) {
    try {
      localStorage.setItem(STORAGE_KEY_V12, JSON.stringify(stateObj));
      return { ok: true, time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) };
    } catch (e) {
      return { ok: false, error: e.message };
    }
  },
  async saveFilesToLocalDirectory(filesList) {
    if (window.showDirectoryPicker) {
      const dirHandle = await window.showDirectoryPicker({ mode: "readwrite" });
      for (const f of filesList) {
        const fh = await dirHandle.getFileHandle(f.name, { create: true });
        const wr = await fh.createWritable();
        await wr.write(f.content);
        await wr.close();
      }
      return { method: "directoryPicker", folderName: dirHandle.name, count: filesList.length };
    }
    // Fallback for mobile / Safari / Firefox: trigger explicit downloads with exact filenames
    for (const f of filesList) {
      const blob = new Blob([f.content], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = f.name;
      a.click();
    }
    return { method: "downloadFallback", folderName: "Browser Downloads Folder", count: filesList.length };
  }
};

// 5. V12 MASTER ENGINEERING & PHYSICS CALCULATOR
function computeEngineeringV12(rawProject, skus, nonItCatalog, standards) {
  const project = extendProjectDefaultsV12(rawProject);
  const fullCatalog = [
    ...nonItCatalog.map(i => ({ miiPct: i.miiPct ?? 82, origin: i.origin ?? "India", ...i })),
    ...V12_CATALOG_EXPANSIONS
  ];
  const baseEng = computeEngineering(project, skus, fullCatalog, standards);

  const isBnM = project.shellArchitecture === "BnM_Hall";
  const podCount = Math.max(1, baseEng.pods.length);

  // A. WHITE-SPACE INTERNAL EQUIPMENT (Internal CDU Towers + Mandatory PACs + PDUs + Aisle Geometry)
  // Zero CDUs in the yard: Racks without integrated CDUs require floor-standing internal CDU towers inside white-space!
  const selCdu = fullCatalog.find(c => c.id === project.selectedCduId) || fullCatalog.find(c => c.id === "cdu-1350kw");
  const internalCduCalc = baseEng.extCduRequiredKw > 0
    ? calcRedundantUnits(baseEng.extCduRequiredKw, selCdu?.ratedCapacity || 1350, project.uptimeTier)
    : { activeN: 0, redundantR: 0, total: 0 };
  const internalCduCount = internalCduCalc.total;
  const internalCduFootprintSqm = Number((internalCduCount * 1.44).toFixed(1)); // 1.2m x 1.2m floor footprint per internal CDU tower

  // Mandatory PAC in EVERY container/hall for room temperature & humidity control + AC rack residual loads
  const pacCalc = baseEng.pods.length > 0
    ? calcRedundantUnits(Math.max(baseEng.totalAirKw, baseEng.pods.length * 45), 80, project.uptimeTier)
    : { activeN: 0, redundantR: 0, total: 0 };
  const mandatoryPacCount = baseEng.pods.length > 0 ? Math.max(baseEng.pods.length, pacCalc.total) : 0;
  const pacFootprintSqm = Number((mandatoryPacCount * 2.2).toFixed(1));
  const pduFootprintSqm = Number((baseEng.pods.length * 1.8).toFixed(1));

  // Roof/Yard Chillers required for all PACs + AC racks (In-Row / RDHX)
  const totalChillerLoadKw = Math.round(baseEng.totalAirKw + (mandatoryPacCount * 35));
  const chillerCalc = totalChillerLoadKw > 0
    ? calcRedundantUnits(totalChillerLoadKw, 1000, project.uptimeTier)
    : { activeN: 0, redundantR: 0, total: 0 };
  const chillerUnitsCount = chillerCalc.total;

  // Revised White-Space Area (m²) explicitly reserving space for Internal CDUs, PACs, PDUs & Service Aisles
  const whiteSpaceSupportSqm = Number((internalCduFootprintSqm + pacFootprintSqm + pduFootprintSqm).toFixed(1));
  const totalItWhiteSpaceSqm = Number((baseEng.totalItWhiteSpaceSqm + whiteSpaceSupportSqm).toFixed(1));

  // B. CIVIL, PLINTH & STRUCTURAL ENGINEERING (Container Foundations vs BnM Column-Grid)
  const floodPlinthMm = Math.max(
    (project.historicalFloodLevelMm || 450) + 300,
    (project.cityQuery || "").toLowerCase().match(/mumbai|chennai|kolkata|kochi/) ? 900 : 650
  );
  const roofChillerMassT = (project.chillerPlacement === "ContainerRoof" && !isBnM)
    ? Number(((chillerUnitsCount * 11.5) / podCount).toFixed(1))
    : 0;
  const basePodMassT = Number(((baseEng.pods[0]?.grossRiggingKg || 28000) / 1000).toFixed(1));
  const unitGrossTonnes = isBnM
    ? Number(((baseEng.totalDesignContKw / podCount) * 0.014).toFixed(1))
    : Number((basePodMassT + roofChillerMassT + (internalCduCount * 1.1 / podCount) + (mandatoryPacCount * 0.75 / podCount)).toFixed(1));
  const floorPressureKpa = Number(((unitGrossTonnes * 9.81) / (isBnM ? 64.0 : 32.0)).toFixed(1));
  const cornerNodeKn = Math.round((unitGrossTonnes * 9.81) / 4);
  const sbc = Number(project.soilBearingCapacityKpa) || 150;
  const foundationType = sbc < 110
    ? "Bored Cast-in-Situ Friction Piles + RCC Pile Cap"
    : `Isolated M35 RCC Pad Footing (${(cornerNodeKn / sbc * 1.35).toFixed(2)} m²/node) + Raised Plinth`;

  // C. TELECOM, CARRIER MMR & DIVERSE UNDERGROUND FIBER
  const mmrRoomsCount = Math.max(1, Math.ceil(podCount / 6));
  const odfBaysCount = Math.max(2, (project.carrierCount || 3) * 2);
  const totalFiberStrands = odfBaysCount * (project.odfCoreDensity || 576);
  const overheadFiberMeters = podCount * 32;
  const gpuFabricLinks = baseEng.activeRacks.length * 8;

  // D. LOGISTICS, ROUTE SURVEY, CRANE & RIGGING MANIFEST
  const trailerCount = isBnM ? Math.max(2, Math.ceil(podCount / 2)) : podCount;
  const minTurningRadiusM = (project.approachRoadWidthM || 12) >= 12 ? 16.5 : 18.2;
  const craneTonnage = unitGrossTonnes > 38 || (project.craneWorkingRadiusM || 10) > 12 ? 350 : 250;
  const outriggerGroundKpa = Math.round((unitGrossTonnes * 9.81 * 1.40) / 4.8);
  const laydownStagingSqm = Math.max(220, trailerCount * 75);

  // E. PER-UNIT CONTAINER / HALL BAY DATASHEETS (Supports Deferred Artwork Caveat)
  const unitDatasheets = baseEng.pods.map((p, idx) => {
    const unitId = isBnM ? `BNM-BAY-${String(idx + 1).padStart(2, "0")}` : `MDC-POD-${String(idx + 1).padStart(2, "0")}`;
    const artworkStatus = project.brandingMode === "standard"
      ? "OEM Standard Finish"
      : project.brandingMode === "custom_ready"
        ? "Client Vector Logo Applied"
        : "[CLIENT ARTWORK PENDING — FILES LATER]";
    return {
      unitId,
      shellSpec: isBnM ? `BnM RCC Bay (${project.bnmColumnGridM} Grid)` : `${(p.extLengthMm / 1000).toFixed(2)}m ISO Corten-A Shell`,
      itKw: Math.round(p.designContKw),
      rackCount: p.racks.length,
      internalEquip: `${Math.ceil(mandatoryPacCount / podCount)}× PAC + ${Math.ceil(internalCduCount / podCount)}× Internal CDU`,
      grossTonnes: unitGrossTonnes,
      coatingSpec: project.brandingMode === "standard" ? "RAL 7035 Industrial" : `Ext: ${project.exteriorRalLabel} / Int: ${project.interiorRalLabel}`,
      rackFinish: project.rackBezelFinish,
      artworkStatus
    };
  });

  // F. CATEGORIZED BOM RE-SYNTHESIS & MII WEIGHTED SCORING
  const catMap = Object.fromEntries(fullCatalog.map(i => [i.id, i]));
  const makeBomRow = (key, qty, label, category, specs, overrideRate = null) => {
    const base = catMap[key] || { cost: 500000, make: "Grade-A OEM", model: "STD-1", miiPct: 85 };
    const masterUnitCost = overrideRate !== null ? overrideRate : Number(base.cost || 0);
    const ov = project.dealOverrides?.[key];
    let unitCost = masterUnitCost;
    let isOverridden = false;
    let discountPct = 0;
    if (ov) {
      if (ov.mode === "discount" && ov.discountPct !== "") {
        discountPct = Number(ov.discountPct) || 0;
        unitCost = Math.round(masterUnitCost * (1 - discountPct / 100));
        isOverridden = true;
      } else if (ov.mode === "price" && ov.specialPrice !== "") {
        unitCost = Number(ov.specialPrice);
        discountPct = masterUnitCost > 0 ? Number((((masterUnitCost - unitCost) / masterUnitCost) * 100).toFixed(1)) : 0;
        isOverridden = true;
      }
    }
    const rawCostTotal = unitCost * qty;
    const withContingency = rawCostTotal * (1 + (project.contingencyPct || 7) / 100);
    const sellingPreTax = withContingency / Math.max(0.05, 1 - (project.marginPct || 18) / 100);
    const gstAmt = sellingPreTax * ((project.gstPct || 18) / 100);
    return {
      key, category, label, specs,
      make: base.make, model: base.model, unit: base.unit || "unit",
      qty, masterUnitCost, unitCost, isOverridden, discountPct,
      validUntil: ov?.validUntil || "", comments: ov?.comments || "",
      miiPct: base.miiPct ?? 84,
      rawCostTotal, withContingency, sellingPreTax, gstAmt,
      grandTotalInclGst: sellingPreTax + gstAmt
    };
  };

  // Start from baseEng.bomItems and upgrade/inject V12 engineering line items cleanly
  let v12Bom = baseEng.bomItems.filter(it => !["glycolDosingSkid", "roomDehumPac40Kw", "rdhxUnit45Kw", "inRowCooler40Kw", "shellPerSqm", "containerPodShell"].includes(it.key));

  if (baseEng.pods.length > 0) {
    if (isBnM) {
      const mwQty = Math.max(1, Math.ceil(baseEng.totalDesignContKw / 1000));
      v12Bom.unshift(makeBomRow("bnm-hall-wrapper", mwQty, `Brick-and-Mortar (BnM) Fire-Rated Technical Hall (${podCount} Bays)`, "Modular Enclosures & Civil", `${project.bnmColumnGridM} Grid • ${project.bnmSlabThicknessMm}mm RCC Slab • ${project.bnmClearSoffitM}m Soffit`));
    } else {
      const shellItems = baseEng.bomItems.filter(it => it.key === "shellPerSqm" || it.key === "containerPodShell");
      v12Bom = [...shellItems, ...v12Bom];
    }
    if (project.brandingMode !== "standard") {
      v12Bom.push(makeBomRow("custom-branding-pkg", podCount, "Customer Exterior/Interior RAL Coating, Rack Bezel & Logo Package", "Modular Enclosures & Civil", project.brandingMode === "custom_tbd" ? "Custom RAL & Vinyl Prep [CLIENT ARTWORK PENDING]" : `Custom RAL (${project.exteriorRalLabel}) & Logo Applied`));
    }
    // Mandatory PACs in every container/hall + Chillers
    v12Bom.push(makeBomRow("roomDehumPac80Kw", mandatoryPacCount, "White-Space Precision Air Coolers (PAC 80 kW — Mandatory Room/Humidity)", "Liquid Cooling & Heat Rejection", `${mandatoryPacCount} PACs (${pacFootprintSqm} m² white-space) • ${project.airflowDelivery}`));
    if (chillerUnitsCount > 0) {
      v12Bom.push(makeBomRow("chiller-1000kw", chillerUnitsCount, `Air-Cooled Magnetic-Bearing Chillers (${project.chillerPlacement === "ContainerRoof" ? "Container Roof-Mounted" : "Yard Chiller Pad"})`, "Liquid Cooling & Heat Rejection", `Serves PACs + AC/RDHX loads (${totalChillerLoadKw} kW)`));
    }
    // Switchgear & Protection
    v12Bom.push(makeBomRow("apfc-spd-panel", Math.max(1, Math.ceil(podCount / 2)), "Detuned APFC Capacitor Banks (500 kVAr) + Type 1+2 SPD Array", "Power Distribution & Transformation", "Harmonic & Surge Suppression (CEIG / NBCS 2026)"));
    v12Bom.push(makeBomRow("mcc-panel", 1, "Intelligent VFD Motor Control Center (MCC) for Cooling Plant", "Power Distribution & Transformation", "Form-4B VFD Pump & Fan Controls"));
    // Grid Protection
    if (project.includeGridLoadShield) {
      const shieldBlocks = Math.max(1, Math.ceil((baseEng.totalDesignContKw * 0.20) / 3000));
      v12Bom.push(makeBomRow("grid-load-shield", shieldBlocks, "20% Dynamic Load-Drop Shield (Fast Load Bank + Grid BESS Buffer)", "Backup Power & Energy Storage", `Absorbs ${(baseEng.totalDesignContKw * 0.20 / 1000).toFixed(2)} MW sudden AI load drop`));
    }
    // Environmental Hardening & Security
    if (project.includeK12Mantrap) {
      v12Bom.push(makeBomRow("k12-mantrap-pkg", 1, "K12/M50 Anti-Ram Bollards & Dual-Door Biometric Mantrap Portal", "BMS, Fire Suppression & Security", "Crash-rated perimeter gates & interlocking security mantrap"));
    }
    if (project.includeRodentRepellent) {
      v12Bom.push(makeBomRow("rodent-repellent-pkg", podCount, "#316 SS Rodent Armor Mesh + Ultrasonic Repellent Transducers", "Environmental Hardening & ZLD", "Complete cable/pipe ingress & subfloor rodent barrier"));
    }
    if (project.includeGasScrubber) {
      v12Bom.push(makeBomRow("gas-scrubber-unit", podCount, "ISA G1 Chemical Air Scrubber & Anti-Corrosive Curtain (H₂S/SO₂)", "Environmental Hardening & ZLD", "Protects copper/electronics from industrial/sewage/landfill gases"));
    }
    if (project.includeZldRecovery) {
      v12Bom.push(makeBomRow("zld-water-plant", 1, "Zero Liquid Discharge (ZLD) RO Reject & PAC Condensate Recovery", "Environmental Hardening & ZLD", "Zero untreated discharge + PAC condensate reuse"));
    }
    // Pre-Loop Water Treatment + Separate Consumables + Isolated PG25 Glycol
    if (baseEng.hasDlcRacks) {
      v12Bom.push(makeBomRow("preloop-water-treat", 1, "Pre-Loop RO/DM Water Treatment & Chemical Dosing Skid", "Hydraulics, Piping & Water Storage", "Pre-treats make-up water prior to DLC loop fill"));
      const pg25Lots = Math.max(1, Math.ceil((baseEng.totalLiquidKw * 3.2) / 5000));
      v12Bom.push(makeBomRow("glycol-pg25-isolated", pg25Lots, "Factory-Isolated Inhibited PG25 Glycol Fluid (5000L Drum Lot)", "Consumables & Operational Chemicals", "Factory-Supplied PG25 + OAT/Azole Inhibitor (Isolated Line Item)"));
    }
    v12Bom.push(makeBomRow("ops-consumables-lot", podCount, "Water Treatment Chemicals, RO/DM Resins, PAC Filters & Scrubber Media", "Consumables & Operational Chemicals", "Operational replenishment chemicals & filter media"));

    // Telecom & Carrier MMR
    v12Bom.push(makeBomRow("telecom-mmr-room", mmrRoomsCount, "Carrier-Neutral Meet-Me Room (MMR), 48U ODF Bays & -48V DC Plant", "Telecom, MMR & Connectivity", `${project.carrierCount} Carriers • ${odfBaysCount}× ${project.odfCoreDensity}F ODFs`));
    v12Bom.push(makeBomRow("diverse-fiber-vaults", 1, "Dual Diverse Underground Fiber Vaults (North/South) & 4-Way HDPE Ducts", "Telecom, MMR & Connectivity", `>= ${project.diverseVaultSeparationM}m physical route separation`));
    v12Bom.push(makeBomRow("overhead-fiber-raceway", podCount, "Overhead Yellow LSZH Fiber Raceways & High-Density Trunk Cabling", "Telecom, MMR & Connectivity", `${overheadFiberMeters}m segregated optical troughs + ${project.fabricType}`));

    // Logistics, Heavy-Lift & Rigging
    v12Bom.push(makeBomRow("logistics-transport-crane", podCount, `Multi-Axle Low-Bed Trailers & ${craneTonnage}T Mobile Crane Mobilization`, "Logistics, Heavy-Lift & Rigging", `Turning radius >= ${minTurningRadiusM}m • Outrigger bearing ${outriggerGroundKpa} kN/m²`));
    v12Bom.push(makeBomRow("onsite-rigging-kit", 1, "Azobe Spreader Mats, 5T Forklifts, 15T Roller Skates, Toe Jacks & Shims", "Logistics, Heavy-Lift & Rigging", `Laydown yard ${laydownStagingSqm} m² • Full on-site rigging inventory`));
  }

  // Recompute Totals & Weighted Make-in-India (MII) Score
  let totalWeightedMii = 0;
  const totals = v12Bom.reduce((acc, it) => {
    const meta = catMap[it.key];
    if (meta && meta.miiPct) it.miiPct = meta.miiPct;
    else if (!it.miiPct) it.miiPct = 85;
    totalWeightedMii += it.sellingPreTax * it.miiPct;
    return {
      rawCost: acc.rawCost + it.rawCostTotal,
      contingency: acc.contingency + (it.withContingency - it.rawCostTotal),
      sellingPreTax: acc.sellingPreTax + it.sellingPreTax,
      gst: acc.gst + it.gstAmt,
      grandTotal: acc.grandTotal + it.grandTotalInclGst
    };
  }, { rawCost: 0, contingency: 0, sellingPreTax: 0, gst: 0, grandTotal: 0 });

  const overallMiiPct = totals.sellingPreTax > 0 ? Number((totalWeightedMii / totals.sellingPreTax).toFixed(1)) : 86.0;
  const miiClassLabel = overallMiiPct >= 50 ? `Class-I Local Supplier (${overallMiiPct}%)` : `Class-II Local Supplier (${overallMiiPct}%)`;

  const commissioningSchedule = [
    { level: "L1 — Factory Acceptance Test (FAT)", scope: "Shell hydro-test (1.5× MAWP), busway hi-pot, internal CDU, PAC & switchgear FAT", gate: "Pre-Dispatch Release" },
    { level: "L2 — Site Acceptance & Civil Verification", scope: `+${floodPlinthMm}mm RCC plinth level check, M30 seismic anchor torque, ${craneTonnage}T crane rigging`, gate: "Installation Sign-Off" },
    { level: "L3 — Pre-Functional & Cold Commissioning", scope: "RO/DM pre-treatment, SS316L flushing, factory PG25 glycol fill, IBMS point-to-point", gate: "Energization Permit (CEIG)" },
    { level: "L4 — Functional Subsystem Testing", scope: "UPS battery discharge, CPCB IV+ DG auto-transfer, VESDA/Novec & mantrap interlocks", gate: "Subsystems Ready" },
    { level: "L5 — Integrated Systems Testing (IST)", scope: `100% heat-load bank run + ${(baseEng.totalDesignContKw * 0.20 / 1000).toFixed(2)} MW sudden load-rejection simulation`, gate: "Handover & SLA Start" }
  ];

  return {
    ...baseEng,
    bomItems: v12Bom,
    totals,
    totalItWhiteSpaceSqm,
    whiteSpace: {
      internalCduCount, internalCduFootprintSqm,
      mandatoryPacCount, pacFootprintSqm,
      chillerUnitsCount, totalChillerLoadKw,
      pduFootprintSqm, whiteSpaceSupportSqm
    },
    civil: {
      isBnM, floodPlinthMm, unitGrossTonnes, floorPressureKpa, cornerNodeKn, sbc, foundationType
    },
    telecom: {
      mmrRoomsCount, odfBaysCount, totalFiberStrands, overheadFiberMeters, gpuFabricLinks, fabricType: project.fabricType
    },
    logistics: {
      trailerCount, minTurningRadiusM, craneTonnage, outriggerGroundKpa, laydownStagingSqm
    },
    unitDatasheets,
    mii: { overallMiiPct, miiClassLabel },
    commissioningSchedule
  };
}

          </div>
          {(() => {
            const sbcVal = Math.max(20, Number(safeProj.soilBearingCapacityKpa) || 150);

            return (
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-1.5 border-t border-emerald-200 text-[11px]">

              </div>
            );
          })()}
        </div>

        {renderV11CivilPlinthSvg(safeProj, eng)}

}

  driveFolderList, driveFileList, fetchDriveFolderContents,
  newFolderName, setNewFolderName, createDriveSubfolder,
  saveToSelectedDriveFolder, loadFileFromGoogleDrive, deleteFileFromGoogleDrive,

}) {
  const [localStatus, setLocalStatus] = useState("");
  const defaultFileName = `MDC_Deal_${(currentProject?.name || "Project").replace(/[^a-zA-Z0-9_-]+/g, "_")}.json`;
  const [targetFileName, setTargetFileName] = useState(defaultFileName);
  const [includeMasterBackup, setIncludeMasterBackup] = useState(false);

  useEffect(() => {
    setTargetFileName(`MDC_Deal_${(currentProject?.name || "Project").replace(/[^a-zA-Z0-9_-]+/g, "_")}.json`);
  }, [currentProject?.id, currentProject?.name, isOpen]);

  if (!isOpen) return null;

  const isProtectedMasterFile = (name = "") => /master_catalog|supply_intel/i.test(name);
  const folderPathLabel = driveFolderStack.map(f => f.name).join(" / ");

  const handleExplicitLocalSave = async () => {
    const safeName = (targetFileName || defaultFileName).trim().replace(/[^a-zA-Z0-9_.-]+/g, "_");
    const finalName = safeName.endsWith(".json") ? safeName : `${safeName}.json`;
    const files = [{ name: finalName, content: JSON.stringify(currentProject, null, 2) }];
    if (includeMasterBackup) {
      files.push({ name: "mdc_master_catalog.json", content: JSON.stringify({ skus, containerCatalog, nonItCatalog, standards, exportedAt: new Date().toISOString() }, null, 2) });
    }
    try {
      const res = await WorkspaceStorageAdapter.saveFilesToLocalDirectory(files);
      setLocalStatus(`✓ Saved "${finalName}" into "${res.folderName}"`);

      if (err?.name !== "AbortError") setLocalStatus("Save cancelled or blocked by browser.");

  return (
    <div className="fixed inset-0 bg-slate-950/65 z-50 flex items-center justify-center p-4">

        const [rFld, rJson] = await Promise.all([
          fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(qRecentFolders)}&orderBy=modifiedTime desc&pageSize=20&fields=files(id,name,modifiedTime,parents)`, {

// 1. MODULAR STORAGE & AUTH ADAPTER (Decouples LocalStorage & Drive for future DB/RBAC)
const StorageAdapter = {
  mode: "local_drive", // Ready to swap to "postgres_rbac" in Phase 2
  loadState(fallback) {
    try {
      const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem("ai_mdc_studio_v10_5_enterprise");
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  },
  saveState(stateObj) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(stateObj));
      return { ok: true, timestamp: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) };
    } catch (e) {
      return { ok: false, error: e.message };
    }
  },
  async syncToDrive(driveToken, folderId, filesPayload) {
    if (!driveToken) throw new Error("Not authenticated with Google Drive");
    const results = [];
    for (const f of filesPayload) {
      const meta = { name: f.name, mimeType: "application/json", parents: [folderId] };
      const form = new FormData();
      form.append("metadata", new Blob([JSON.stringify(meta)], { type: "application/json" }));
      form.append("file", new Blob([JSON.stringify(f.data, null, 2)], { type: "application/json" }));
      const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
        method: "POST",
        headers: { Authorization: `Bearer ${driveToken}` },
        body: form
      });
      results.push({ name: f.name, ok: res.ok });
    }
    return results;
  }
};

// 4. V11 EXTENDED ENGINEERING CALCULATOR (Wraps V10.5 computeEngineering)
function computeEngineeringV11(rawProject, skus, nonItCatalog, standards) {
  const project = extendProjectDefaultsV11(rawProject);
  const fullCatalog = [
    ...nonItCatalog.map(i => ({ miiPct: i.miiPct ?? 82, origin: i.origin ?? "India", ...i })),
    ...V11_CATALOG_ADDITIONS
  ];
  const baseEng = computeEngineering(project, skus, fullCatalog, standards);

  // A. Civil & Structural Point-Load Engineering
  const isBnM = project.shellArchitecture === "BnM_Hall";
  const floodPlinthMm = (project.cityQuery || "").toLowerCase().match(/mumbai|chennai|kolkata|kochi/) ? 900 : (project.seismicZone === "Zone IV" || project.seismicZone === "Zone V" ? 750 : 600);
  const unitGrossTonnes = isBnM
    ? Number(((baseEng.totalDesignContKw / Math.max(1, baseEng.pods.length)) * 0.012).toFixed(1))
    : Number(((baseEng.pods[0]?.grossRiggingKg || 28000) / 1000).toFixed(1));
  const floorPressureKpa = Number(((unitGrossTonnes * 9.81) / (isBnM ? 45.0 : 29.7)).toFixed(1));
  const cornerNodeKn = Math.round((unitGrossTonnes * 9.81) / 4);

  // B. Grid Protection (20% Sudden Load-Drop Shield)
  const loadDropShieldMw = Number(((baseEng.totalDesignContKw / 1000) * 0.20).toFixed(2));

  // C. Telecom MMR & AI Fabric Sizing
  const mmrOdfBays = Math.max(2, Math.ceil(baseEng.pods.length / 2));
  const fabricTransceivers = baseEng.activeRacks.length * 8;
  const overheadFiberMeters = baseEng.pods.length * 28;

  // D. Logistics, Turning Radius & Crane Ground Bearing Pressure
  const trailerCount = isBnM ? Math.max(2, Math.ceil(baseEng.pods.length / 2)) : baseEng.pods.length;
  const minTurningRadiusM = project.approachRoadWidthM >= 12 ? 16.5 : 18.0;
  const craneTonnage = project.craneWorkingRadiusM <= 10 ? 250 : 350;
  const outriggerGroundKpa = Math.round((unitGrossTonnes * 9.81 * 1.35) / 4.5);
  const laydownStagingSqm = Math.max(180, trailerCount * 65);

  // E. Per-Container / Hall Bay Datasheet Generator (Respects Deferred Branding Caveat)
  const unitDatasheets = baseEng.pods.map((p, idx) => {
    const unitId = isBnM ? `BNM-BAY-${String(idx + 1).padStart(2, "0")}` : `MDC-POD-${String(idx + 1).padStart(2, "0")}`;
    const artworkStatus = project.brandingMode === "standard"
      ? "OEM Standard Finish"
      : project.brandingMode === "custom_ready"
        ? "Client Vector Logo Applied"
        : "[CLIENT ARTWORK PENDING — FILES LATER]";
    return {
      unitId,
      shellSpec: isBnM ? "2-Hr Fire-Rated RCC Technical Bay" : `${(p.extLengthMm / 1000).toFixed(2)}m ISO Corten-A Shell`,
      itKw: Math.round(p.designContKw),
      rackCount: p.racks.length,
      grossTonnes: isBnM ? unitGrossTonnes : Number((p.grossRiggingKg / 1000).toFixed(1)),
      coatingSpec: project.brandingMode === "standard" ? "RAL 7035 Standard Industrial" : `Ext: ${project.exteriorRalLabel} / Int: ${project.interiorRalLabel}`,
      rackFinish: project.rackBezelFinish,
      artworkStatus
    };
  });

  // F. Make-in-India (MII) Weighted Local Content Scoring across BOM
  let totalWeightedMii = 0;
  let totalPreTax = 0;
  baseEng.bomItems.forEach(item => {
    const catMeta = fullCatalog.find(c => c.id === item.key) || { miiPct: 84 };
    item.miiPct = catMeta.miiPct;
    totalWeightedMii += item.sellingPreTax * catMeta.miiPct;
    totalPreTax += item.sellingPreTax;
  });
  const overallMiiPct = totalPreTax > 0 ? Number((totalWeightedMii / totalPreTax).toFixed(1)) : 85.0;
  const miiClassLabel = overallMiiPct >= 50 ? `Class-I Local Supplier (${overallMiiPct}%)` : `Class-II Local Supplier (${overallMiiPct}%)`;

  // G. L1-L5 Commissioning & Load-Bank IST Sign-Off Matrix
  const commissioningSchedule = [
    { level: "L1 — Factory Acceptance Test (FAT)", scope: "Container hydro-test (1.5× MAWP), busway hi-pot, CDU & switchgear FAT", gate: "Pre-Dispatch Release" },
    { level: "L2 — Site Acceptance & Civil Verification", scope: `+${floodPlinthMm}mm RCC plinth level check, M30 seismic anchor torque, crane rigging`, gate: "Installation Sign-Off" },
    { level: "L3 — Pre-Functional & Cold Commissioning", scope: "SS316L flushing, 50μ strainer check, factory PG25 glycol fill, IBMS point-to-point", gate: "Energization Permit (CEIG)" },
    { level: "L4 — Functional Subsystem Testing", scope: "UPS battery discharge, CPCB IV+ DG auto-transfer, VESDA/Novec interlocks", gate: "Subsystems Ready" },
    { level: "L5 — Integrated Systems Testing (IST)", scope: `100% heat-load bank run + ${loadDropShieldMw} MW sudden load-rejection simulation`, gate: "Handover & SLA Start" }
  ];

  return {
    ...baseEng,
    civil: { isBnM, floodPlinthMm, unitGrossTonnes, floorPressureKpa, cornerNodeKn },
    gridShield: { loadDropShieldMw },
    telecom: { mmrOdfBays, fabricTransceivers, overheadFiberMeters, fabricType: project.fabricType },
    logistics: { trailerCount, minTurningRadiusM, craneTonnage, outriggerGroundKpa, laydownStagingSqm },
    unitDatasheets,
    mii: { overallMiiPct, miiClassLabel },
    commissioningSchedule
  };
}

    const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    function synthesizeMonthlyClimate(peakDb = 38.0, peakWb = 29.0, rh = 72) {
      // Realistic 12-month tropical/subtropical seasonal curve anchored to peak DB & WB
      const dbOffsets = [-8.5, -6.0, -2.5, 0.0, 0.5, -2.0, -5.0, -5.5, -4.5, -3.5, -5.5, -7.8];
      const wbOffsets = [-7.5, -5.8, -3.2, -1.2, -0.3, 0.0, -0.4, -0.6, -1.0, -2.2, -4.8, -6.8];
      return MONTHS.map((m, idx) => {
        const db = Number(Math.max(12, peakDb + dbOffsets[idx]).toFixed(1));
        const wb = Number(Math.max(8, Math.min(db - 1.5, peakWb + wbOffsets[idx])).toFixed(1));
        return { month: m, dryBulbC: db, wetBulbC: wb };
      });
    }

    function estimateSummerDesignClimate(lat = 19.0, lon = 73.0, elevationM = 14) {
      const absLat = Math.abs(Number(lat) || 19.0);
      const elev = Math.max(0, Number(elevationM) || 0);
      // Lapse rate ~6.5°C per 1000m elevation + tropical/subtropical summer peak baseline
      let peakDb = 41.5 - (elev / 1000) * 6.5;
      if (absLat < 15) peakDb -= 2.0; // equatorial coastal moderation
      if (elev >= 1200 && elev < 2500) peakDb = Math.max(25.0, Math.min(31.5, peakDb)); // hill stations e.g. Dharamshala (1457m) ~29-31°C
      if (elev >= 2500) peakDb = Math.max(18.0, Math.min(25.0, peakDb)); // Leh/Ladakh ~22-24°C
      peakDb = Number(Math.max(18.0, Math.min(47.0, peakDb)).toFixed(1));
      const isCoastal = (lon < 74.5 && lat < 23.5) || (lon > 79.5 && lat < 22.5);
      const rh = elev > 1200 ? 64 : (isCoastal ? 76 : 48);
      const T = peakDb;
      const tw = T * Math.atan(0.151977 * Math.pow(rh + 8.313659, 0.5)) + Math.atan(T + rh) - Math.atan(rh - 1.676331) + 0.00391838 * Math.pow(rh, 1.5) * Math.atan(0.023101 * rh) - 4.686035;
      const peakWb = Number(Math.max(12.0, Math.min(peakDb - 2.0, tw)).toFixed(1));
      return { peakDryBulb: peakDb, peakWetBulb: peakWb, relHumidityPct: rh };
    }

    function classifySeismicZone(cityName = "", lat = 19.0, lon = 73.0) {
      const c = cityName.toLowerCase();
      if (c.includes("guwahati") || c.includes("shillong") || c.includes("imphal") || c.includes("itanagar") || c.includes("kohima") || c.includes("agartala") || c.includes("aizawl") || c.includes("gangtok") || c.includes("bhuj") || c.includes("srinagar") || c.includes("leh") || c.includes("dehradun") || c.includes("shimla") || c.includes("dharamshala") || c.includes("dharamsala") || c.includes("kangra") || c.includes("port blair") || (lon > 89 && lat > 22) || lat > 30) {
        return { zone: "Zone V", zFactor: 0.36, label: "IS 1893 Zone V (Very High Seismicity — 0.36g)" };

      if (c.includes("delhi") || c.includes("noida") || c.includes("gurgaon") || c.includes("gurugram") || c.includes("patna") || c.includes("lucknow") || c.includes("chandigarh") || c.includes("amritsar") || c.includes("kolkata") || c.includes("siliguri") || lat > 25.5) {
