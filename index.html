                        type="number" step="0.5"
                        value={quoteForm.discountPct}
                        onChange={e => {
                          const d = Number(e.target.value);
                          const calcPrice = Math.round(quoteModalItem.masterUnitCost * (1 - d / 100));
                          setQuoteForm(f => ({ ...f, discountPct: d, specialPrice: calcPrice }));
                        }}
                        className="w-full border border-slate-300 rounded-lg px-3 py-2 font-mono font-bold"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Resulting Deal Unit Price (₹)</label>
                      <div className="w-full border border-slate-200 bg-slate-100 rounded-lg px-3 py-2 font-mono font-bold text-emerald-800">
                        ₹{Math.round(quoteModalItem.masterUnitCost * (1 - (Number(quoteForm.discountPct) || 0) / 100)).toLocaleString("en-IN")}
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Negotiated Deal Unit Price (₹)</label>
                      <input
                        type="number"
                        value={quoteForm.specialPrice}
                        onChange={e => {
                          const p = Number(e.target.value);
                          const d = quoteModalItem.masterUnitCost > 0 ? Number((((quoteModalItem.masterUnitCost - p) / quoteModalItem.masterUnitCost) * 100).toFixed(1)) : 0;
                          setQuoteForm(f => ({ ...f, specialPrice: p, discountPct: d }));
                        }}
                        className="w-full border border-slate-300 rounded-lg px-3 py-2 font-mono font-bold"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Effective Variance vs. Master</label>
                      <div className="w-full border border-slate-200 bg-slate-100 rounded-lg px-3 py-2 font-mono font-bold text-amber-800">
                        {quoteModalItem.masterUnitCost > 0
                          ? `${(((quoteModalItem.masterUnitCost - (Number(quoteForm.specialPrice) || 0)) / quoteModalItem.masterUnitCost) * 100).toFixed(1)}% off Master`
                          : "Custom Rate"}
                      </div>
                    </div>
                  </div>
                )}

                <div>
                  <label className="block font-bold text-slate-700 mb-1">Vendor Quote Validity Date</label>
                  <input
                    type="date"
                    value={quoteForm.validUntil}
                    onChange={e => setQuoteForm(f => ({ ...f, validUntil: e.target.value }))}
                    className="w-full border border-slate-300 rounded-lg px-3 py-2"
                  />
                </div>

                <div>
                  <label className="block font-bold text-slate-700 mb-1">Commercial Background, Vendor Ref & Terms / Comments</label>
                  <textarea
                    rows="3"
                    placeholder="e.g., OEM Q4 project bid #VT-409; includes 3-yr extended warranty & free site supervision; valid for PO before month-end..."
                    value={quoteForm.comments}
                    onChange={e => setQuoteForm(f => ({ ...f, comments: e.target.value }))}
                    className="w-full border border-slate-300 rounded-lg px-3 py-2"
                  />
                </div>

                <div className="flex items-center justify-between pt-3 border-t border-slate-200">
                  <button onClick={clearSpecialQuote} className="px-3 py-2 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-50 font-bold">
                    ↺ Revert to Master Baseline
                  </button>
                  <div className="flex gap-2">
                    <button onClick={() => setQuoteModalItem(null)} className="px-3.5 py-2 rounded-lg border border-slate-300 font-bold">Cancel</button>
                    <button onClick={saveSpecialQuote} className="px-4 py-2 rounded-lg coral-bg text-white font-bold">Save Deal Quote</button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
