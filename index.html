    const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    function synthesizeMonthlyClimate(peakDb = 38.0, peakWb = 29.0, rh = 72) {
      // Realistic 12-month tropical/subtropical seasonal curve anchored to peak DB & WB
      const dbOffsets = [-8.5, -6.0, -2.5, 0.0, 0.5, -2.0, -5.0, -5.5, -4.5, -3.5, -5.5, -7.8];
      const wbOffsets = [-7.5, -5.8, -3.2, -1.2, -0.3, 0.0, -0.4, -0.6, -1.0, -2.2, -4.8, -6.8];
      return MONTHS.map((m, idx) => {
        const db = Number(Math.max(12, peakDb + dbOffsets[idx]).toFixed(1));
        const wb = Number(Math.max(8, Math.min(db - 1.5, peakWb + wbOffsets[idx])).toFixed(1));
        return { month: m, dryBulbC: db, wetBulbC: wb };
      });
    }

    function classifySeismicZone(cityName = "", lat = 19.0, lon = 73.0) {
      const c = cityName.toLowerCase();
      if (c.includes("guwahati") || c.includes("shillong") || c.includes("imphal") || c.includes("itanagar") || c.includes("kohima") || c.includes("agartala") || c.includes("aizawl") || c.includes("gangtok") || c.includes("bhuj") || c.includes("srinagar") || c.includes("leh") || c.includes("dehradun") || c.includes("shimla") || c.includes("port blair") || (lon > 89 && lat > 22) || lat > 30) {
        return { zone: "Zone V", zFactor: 0.36, label: "IS 1893 Zone V (Very High Seismicity — 0.36g)" };
      }
      if (c.includes("delhi") || c.includes("noida") || c.includes("gurgaon") || c.includes("gurugram") || c.includes("patna") || c.includes("lucknow") || c.includes("chandigarh") || c.includes("amritsar") || c.includes("kolkata") || c.includes("siliguri") || lat > 25.5) {
        return { zone: "Zone IV", zFactor: 0.24, label: "IS 1893 Zone IV (High Seismicity — 0.24g)" };
      }
      if (c.includes("mumbai") || c.includes("thane") || c.includes("navi mumbai") || c.includes("pune") || c.includes("chennai") || c.includes("ahmedabad") || c.includes("surat") || c.includes("bhubaneswar") || c.includes("visakhapatnam") || c.includes("kochi") || c.includes("mangalore")) {
        return { zone: "Zone III", zFactor: 0.16, label: "IS 1893 Zone III (Moderate Seismicity — 0.16g)" };
      }
      return { zone: "Zone II", zFactor: 0.10, label: "IS 1893 Zone II (Low Seismicity — 0.10g)" };
    }

    function calcRedundantUnits(totalDemand, unitRating, tier) {
      if (totalDemand <= 0 || unitRating <= 0) return { activeN: 0, redundantR: 0, total: 0 };
      const activeN = Math.max(1, Math.ceil(totalDemand / unitRating));
      if (tier === "Tier IV") return { activeN, redundantR: activeN, total: activeN * 2 };
      if (tier === "Tier III") return { activeN, redundantR: 1, total: activeN + 1 };
      const redundantR = activeN >= 3 ? 1 : 0;
      return { activeN, redundantR, total: activeN + redundantR };
    }

    function computeEngineering(project, skus, nonItCatalog, standards) {
      const skuMap = Object.fromEntries(skus.map(s => [s.id, s]));
      const catMap = Object.fromEntries(nonItCatalog.map(item => [item.id, item]));
      const ovQty = project.solutionQtyOverrides || {};

      const activeRacks = [];
      let totalNameplatePeakKw = 0;
      let totalDesignContKw = 0;
      let totalActualKw = 0;
      let dlcDesignKw = 0;
      let acDesignKw = 0;
      let totalLiquidKw = 0;
      let totalAirKw = 0;
      let totalFlowLpm = 0;
      let maxReqDeltaPBar = 0;
      let extCduRequiredKw = 0;
      let hasDlcRacks = false;
      let hasExtCduRacks = false;
      let governingMaxInletTempC = 45;
      let activeRackFootprintSqm = 0;

      Object.entries(project.rackQuantities || {}).forEach(([skuId, qty]) => {
        const q = Number(qty) || 0;
        const sku = skuMap[skuId];
        if (!sku || q <= 0) return;

        const isDlc = sku.coolingType === "DLC" || (Number(sku.liquidSplitPct) || 0) > 0;
        const liqPct = isDlc ? (Number(sku.liquidSplitPct) || 90) : 0;
        const isExtCdu = isDlc && !sku.cduIntegrated;
        const skuMaxInlet = Number(sku.maxInletTempC) || (isDlc ? 35 : 27);

        if (isDlc && skuMaxInlet < governingMaxInletTempC) {
          governingMaxInletTempC = skuMaxInlet;
        }

        for (let i = 0; i < q; i++) {
          const instKey = `${sku.id}__${i}`;
          const contF = sku.continuousFactor || 0.94;
          const utilF = sku.operatingUtilFactor || 0.85;
          const designContKw = sku.peakKw * contF;
          const stdActualKw = designContKw * utilF;
          const actualKw = (project.loadingMode === "ActualPerRack" && project.actualRackLoads?.[instKey] !== undefined && project.actualRackLoads?.[instKey] !== "")
            ? Number(project.actualRackLoads[instKey])
            : stdActualKw;

          const effectiveThermalKw = project.loadingMode === "ActualPerRack" ? actualKw : designContKw;
          const liqKw = effectiveThermalKw * (liqPct / 100);
          const airKw = effectiveThermalKw - liqKw;

          totalNameplatePeakKw += sku.peakKw;
          totalDesignContKw += designContKw;
          totalActualKw += actualKw;
          if (isDlc) dlcDesignKw += designContKw;
          else acDesignKw += designContKw;

          totalLiquidKw += liqKw;
          totalAirKw += airKw;
          totalFlowLpm += liqKw * (sku.flowLpmPerKw || 0);
          if ((sku.reqDeltaPBar || 0) > maxReqDeltaPBar) maxReqDeltaPBar = sku.reqDeltaPBar;
          activeRackFootprintSqm += ((sku.widthMm || 800) / 1000) * ((sku.depthMm || 1200) / 1000);

          if (isDlc) hasDlcRacks = true;
          if (isExtCdu) {
            extCduRequiredKw += liqKw;
            hasExtCduRacks = true;
          }

          activeRacks.push({
            ...sku,
            isDlc,
            isExtCdu,
            liquidSplitPct: liqPct,
            maxInletTempC: skuMaxInlet,
            instanceKey: instKey,
            instanceIndex: i + 1,
            designContKw,
            actualKw,
            liqKw,
            airKw,
            totalWeightKg: Number(sku.weightKg) || 1500
          });
        }
      });

      if (!hasDlcRacks) governingMaxInletTempC = 32;
      const effectiveSupplyTempC = (project.targetSupplyTempC !== "" && project.targetSupplyTempC !== undefined && project.targetSupplyTempC !== null)
        ? Number(project.targetSupplyTempC)
        : governingMaxInletTempC;
      const inletTempViolation = hasDlcRacks && effectiveSupplyTempC > governingMaxInletTempC;

      const dlcRacks = activeRacks.filter(r => r.isDlc);
      const acRacks = activeRacks.filter(r => !r.isDlc);

      // STRICT IT vs NON-IT SEPARATION: IT Pods hold 100% IT Racks + Future Growth Reserve Bays (Zero Non-IT Equipment Inside!)
      const airlockReserveMm = project.airlockVestibule ? 1400 : 400;
      const wallInsulReserveMm = 400;
      const growthFactor = 1 + ((Number(project.futureGrowthReservePct) || 0) / 100);
      let targetExtLengthMm = standards.iso40LengthMm;
      if (project.containerLengthMode === "ISO20") targetExtLengthMm = standards.iso20LengthMm;
      else if (project.containerLengthMode === "ISO40") targetExtLengthMm = standards.iso40LengthMm;
      else targetExtLengthMm = project.maxCustomLengthMm || standards.defaultCustomMaxLenMm;

      const maxUsableRowMm = Math.max(3600, Math.floor((targetExtLengthMm - airlockReserveMm - wallInsulReserveMm) / growthFactor));
      const maxDlcKwPerPod = standards.maxDlcKwPerPod || 2000;
      const maxAcKwPerPod = standards.maxAcKwPerPod || 400;
      const maxPayloadKgPerPod = standards.maxPodPayloadKg || 36000;

      const sortedDlc = [...dlcRacks].sort((a, b) => b.designContKw - a.designContKw);
      const pods = [];

      const packGroup = (rackList, podKind, maxKwCap) => {
        const localPods = [];
        rackList.forEach(rack => {
          let placed = false;
          for (let p of localPods) {
            if (project.packingStrategy === "Segregated" && p.racks.length > 0 && p.racks[0].id !== rack.id) continue;
            const rowALen = p.rowA.reduce((s, r) => s + r.widthMm + 50, 0);
            const rowBLen = p.rowB.reduce((s, r) => s + r.widthMm + 50, 0);
            const targetRow = rowALen <= rowBLen ? "A" : "B";
            const currentRowLen = targetRow === "A" ? rowALen : rowBLen;
            const nextKw = p.designContKw + rack.designContKw;
            const nextWt = p.wetWeightKg + rack.totalWeightKg;
            if (currentRowLen + rack.widthMm <= maxUsableRowMm && nextKw <= maxKwCap && nextWt <= maxPayloadKgPerPod) {
              p.racks.push(rack);
              if (targetRow === "A") p.rowA.push(rack);
              else p.rowB.push(rack);
              p.designContKw = nextKw;
              p.actualKw += rack.actualKw;
              p.peakKw += rack.peakKw;
              p.liqKw += rack.liqKw;
              p.airKw += rack.airKw;
              p.wetWeightKg = nextWt;
              placed = true;
              break;
            }
          }
          if (!placed) {
            localPods.push({
              id: `${podKind}-${localPods.length + 1}`,
              kind: podKind,
              racks: [rack],
              rowA: [rack],
              rowB: [],
              designContKw: rack.designContKw,
              actualKw: rack.actualKw,
              peakKw: rack.peakKw,
              liqKw: rack.liqKw,
              airKw: rack.airKw,
              wetWeightKg: rack.totalWeightKg
            });
          }
        });

        localPods.forEach((p, idx) => {
          const rowALen = p.rowA.reduce((s, r) => s + r.widthMm + 50, 0);
          const rowBLen = p.rowB.reduce((s, r) => s + r.widthMm + 50, 0);
          const activeBayMm = Math.max(rowALen, rowBLen);
          const reservedGrowthMm = Math.round(activeBayMm * ((Number(project.futureGrowthReservePct) || 0) / 100));
          const usedBayMm = activeBayMm + reservedGrowthMm;

          let extLenMm = targetExtLengthMm;
          if (project.containerLengthMode === "CustomOptimum") {
            const rawLen = usedBayMm + airlockReserveMm + wallInsulReserveMm;
            extLenMm = Math.max(6000, Math.ceil(rawLen / 250) * 250);
          }
          const shellAreaSqm = 2 * ((extLenMm / 1000) * (project.containerHeightMm / 1000)) +
                               2 * ((project.containerWidthMm / 1000) * (project.containerHeightMm / 1000)) +
                               2 * ((extLenMm / 1000) * (project.containerWidthMm / 1000));
          const floorFootprintSqm = (extLenMm / 1000) * (project.containerWidthMm / 1000);
          const emptyTareKg = Math.round(shellAreaSqm * (project.wallThicknessMm * 7.85 * 1.35) + 2800);
          const rowAKw = p.rowA.reduce((s, r) => s + r.actualKw, 0);
          const rowBKw = p.rowB.reduce((s, r) => s + r.actualKw, 0);
          const phaseBalancePct = Math.max(rowAKw, rowBKw) > 0
            ? Math.round((Math.min(rowAKw, rowBKw) / Math.max(rowAKw, rowBKw)) * 100)
            : 100;

          p.label = `${podKind} Pod #${idx + 1}`;
          p.extLengthMm = extLenMm;
          p.extWidthMm = project.containerWidthMm;
          p.extHeightMm = project.containerHeightMm;
          p.floorFootprintSqm = floorFootprintSqm;
          p.reservedGrowthMm = reservedGrowthMm;
          p.emptyTareKg = emptyTareKg;
          p.grossRiggingKg = emptyTareKg + p.wetWeightKg;
          p.shellAreaSqm = shellAreaSqm;
          p.bayUtilPct = Math.min(100, Math.round((activeBayMm / Math.max(1000, extLenMm - airlockReserveMm - wallInsulReserveMm)) * 100));
          p.rowAKw = rowAKw;
          p.rowBKw = rowBKw;
          p.phaseBalancePct = phaseBalancePct;
          pods.push(p);
        });
      };

      packGroup(sortedDlc, "DLC", maxDlcKwPerPod);
      packGroup(acRacks, "AC", maxAcKwPerPod);

      const dlcPods = pods.filter(p => p.kind === "DLC");
      const acPods = pods.filter(p => p.kind === "AC");

      // White-Space Area Breakdown (m²)
      const totalItWhiteSpaceSqm = pods.reduce((s, p) => s + p.floorFootprintSqm, 0);
      const futureGrowthAreaSqm = totalItWhiteSpaceSqm * ((Number(project.futureGrowthReservePct) || 0) / 100) * 0.65;
      const aisleServiceAreaSqm = Math.max(0, totalItWhiteSpaceSqm - activeRackFootprintSqm - futureGrowthAreaSqm);

      const isGanged = project.hallTopology !== "Isolated";
      const sharedWallSavingsSqm = isGanged && pods.length > 1
        ? (pods.length - 1) * ((pods[0]?.extLengthMm || 12000) / 1000) * (project.containerHeightMm / 1000) * 1.6
        : 0;

      // 12-Month ASHRAE Cooling & Water Consumption Analysis driven by Target Coolant Supply Temp
      const cduApproachC = 3.0;
      const facilityLoopLimitC = effectiveSupplyTempC - cduApproachC;
      const monthlyProfile = (project.monthlyClimate || synthesizeMonthlyClimate(project.peakDryBulb, project.peakWetBulb, project.relHumidityPct)).map(mc => {
        let mode = "FreeCooling";
        let evapFactor = 0.0;
        let chillerFrac = 0.0;
        if (!hasDlcRacks || project.waterAvailability === "Zero") {
          mode = project.waterAvailability === "Zero" ? "DryChiller" : "AirCooling";
          chillerFrac = 0.45;
        } else if (mc.dryBulbC <= facilityLoopLimitC) {
          mode = "FreeCooling";
          evapFactor = 0.02;
          chillerFrac = 0.0;
        } else if (mc.wetBulbC <= facilityLoopLimitC) {
          mode = "AdiabaticSpray";
          const depression = Math.max(1, mc.dryBulbC - mc.wetBulbC);
          evapFactor = Math.min(0.65, 0.25 + depression * 0.022);
          chillerFrac = 0.05;
        } else {
          mode = "TrimChiller";
          evapFactor = 0.32;
          chillerFrac = 0.35;
        }
        const monthlyWaterKl = Math.round((totalActualKw * 730 * evapFactor) / 1000);
        return { ...mc, mode, evapFactor, chillerFrac, monthlyWaterKl };
      });

      const freeCoolMonths = monthlyProfile.filter(m => m.mode === "FreeCooling").length;
      const adiabaticMonths = monthlyProfile.filter(m => m.mode === "AdiabaticSpray").length;
      const trimChillerMonths = monthlyProfile.filter(m => m.mode === "TrimChiller").length;
      const peakMonthWaterKl = Math.max(...monthlyProfile.map(m => m.monthlyWaterKl), 0);
      const annualWaterKl = monthlyProfile.reduce((s, m) => s + m.monthlyWaterKl, 0);
      const avgChillerFrac = monthlyProfile.reduce((s, m) => s + m.chillerFrac, 0) / 12;

      let recommendedCoolingMode = `Air-Side Precision Cooling (${project.airCoolingType})`;
      let trimChillerKw = 0;

      if (hasDlcRacks) {
        if (project.waterAvailability === "Zero") {
          recommendedCoolingMode = "Zero-Water Dry Coolers + Mechanical Trim Chillers";
          trimChillerKw = Math.round(totalDesignContKw * 0.45);
        } else if (trimChillerMonths > 0) {
          recommendedCoolingMode = `Hybrid Adiabatic (${freeCoolMonths}m Free / ${adiabaticMonths}m Spray / ${trimChillerMonths}m Trim Chiller)`;
          trimChillerKw = Math.round(totalDesignContKw * 0.32);
        } else {
          recommendedCoolingMode = `100% Free-Cooling + Adiabatic Spray (${freeCoolMonths}m Dry / ${adiabaticMonths}m Spray)`;
          trimChillerKw = 0;
        }
      } else if (totalDesignContKw > 0) {
        recommendedCoolingMode = `100% Air-Cooled (${project.airCoolingType} Precision Cooling)`;
      }

      const coolingMode = project.coolingOverrideMode === "Auto" || !project.coolingOverrideMode
        ? recommendedCoolingMode
        : project.coolingOverrideMode;

      // Selected Non-IT Building-Block Items from Master Catalog
      const selCdu = catMap[project.selectedCduId] || nonItCatalog.find(i => i.group === "cdu") || { id: "cdu-1350kw", ratedCapacity: 1350, footprintSqm: 6.5 };
      const selCooler = catMap[project.selectedCoolerId] || nonItCatalog.find(i => i.group === "cooler") || { id: "cooler-1000kw", ratedCapacity: 1000, footprintSqm: 24 };
      const selTank = catMap[project.selectedTankId] || nonItCatalog.find(i => i.group === "tank") || { id: "tank-25kl", ratedCapacity: 25, footprintSqm: 12 };
      const selTrafo = catMap[project.selectedTrafoId] || nonItCatalog.find(i => i.group === "trafo") || { id: "trafo-2000kva", ratedCapacity: 2000, footprintSqm: 14 };
      const selUps = catMap[project.selectedUpsId] || nonItCatalog.find(i => i.group === "ups") || { id: "ups-1000kva", ratedCapacity: 1000, footprintSqm: 28 };
      const selDg = catMap[project.selectedDgId] || nonItCatalog.find(i => i.group === "dg") || { id: "dg-1500kva", ratedCapacity: 1500, footprintSqm: 36 };

      const cduCalc = (hasExtCduRacks && project.includeExtCdu) ? calcRedundantUnits(extCduRequiredKw, selCdu.ratedCapacity || 1350, project.uptimeTier) : { activeN: 0, redundantR: 0, total: 0 };
      const extCduUnits = ovQty.cdu !== undefined && ovQty.cdu !== "" ? Number(ovQty.cdu) : cduCalc.total;

      const coolerCalc = (hasDlcRacks && project.includeLiquidLoop) ? calcRedundantUnits(totalLiquidKw, selCooler.ratedCapacity || 1000, project.uptimeTier) : { activeN: 0, redundantR: 0, total: 0 };
      const adiabaticUnits = ovQty.cooler !== undefined && ovQty.cooler !== "" ? Number(ovQty.cooler) : coolerCalc.total;

      const chillerCalc = (hasDlcRacks && project.includeLiquidLoop && trimChillerKw > 0) ? calcRedundantUnits(trimChillerKw, 500, project.uptimeTier) : { activeN: 0, redundantR: 0, total: 0 };
      const trimChillerUnits = ovQty.chiller !== undefined && ovQty.chiller !== "" ? Number(ovQty.chiller) : chillerCalc.total;

      const airCalc = (totalAirKw > 0 && project.includeRoomDehum) ? calcRedundantUnits(totalAirKw, 40, project.uptimeTier) : { activeN: 0, redundantR: 0, total: 0 };
      const autoAirUnits = airCalc.total > 0 ? Math.max(pods.length, airCalc.total) : 0;
      const airSideUnits = ovQty.air !== undefined && ovQty.air !== "" ? Number(ovQty.air) : autoAirUnits;

      const pumpCalc = (hasDlcRacks && project.includePumpSkids) ? calcRedundantUnits(totalFlowLpm, 2500, project.uptimeTier) : { activeN: 0, redundantR: 0, total: 0 };
      const pumpSkidsCount = ovQty.pump !== undefined && ovQty.pump !== "" ? Number(ovQty.pump) : pumpCalc.total;
      const headerFrictionBar = Number((0.45 + pods.length * 0.08).toFixed(2));
      const cduDropBar = 0.65;
      const pumpDesignHeadBar = Number((maxReqDeltaPBar + cduDropBar + headerFrictionBar).toFixed(2));

      const peakDailyEvapLitres = Math.round((peakMonthWaterKl * 1000) / 30);
      const loopFillLitres = Math.round(totalLiquidKw * 3.2);
      const reqWaterKl = (hasDlcRacks && project.includeWaterTanks)
        ? Math.max(10, Math.ceil(((peakDailyEvapLitres * (project.waterAutonomyDays || 3)) + loopFillLitres) / 1000))
        : 0;
      const tankRatingKl = selTank.ratedCapacity || 25;
      const autoTankUnits = reqWaterKl > 0 ? Math.max(1, Math.ceil(reqWaterKl / tankRatingKl)) : 0;
      const waterTankUnits = ovQty.tank !== undefined && ovQty.tank !== "" ? Number(ovQty.tank) : autoTankUnits;
      const totalWaterStorageKl = waterTankUnits * tankRatingKl;

      // Annualized PUE weighted across 12-month ASHRAE operating profile
      const pueAnnualized = totalDesignContKw > 0
        ? Number((1.085 + avgChillerFrac * 0.11 + (totalAirKw / Math.max(1, totalDesignContKw)) * 0.14).toFixed(3))
        : 1.15;
      const puePeakDesign = totalDesignContKw > 0
        ? Number((1.09 + (trimChillerKw > 0 ? 0.048 : 0.02) + (totalAirKw / Math.max(1, totalDesignContKw)) * 0.14).toFixed(3))
        : 1.15;

      const totalFacilityPeakKw = Math.round(totalNameplatePeakKw * puePeakDesign);
      const totalFacilityPeakKva = Math.round(totalFacilityPeakKw / 0.9);

      const trafoCalc = (project.includeTransformer && totalDesignContKw > 0) ? calcRedundantUnits(totalFacilityPeakKva, selTrafo.ratedCapacity || 2000, project.uptimeTier) : { activeN: 0, redundantR: 0, total: 0 };
      const transformerUnits = ovQty.trafo !== undefined && ovQty.trafo !== "" ? Number(ovQty.trafo) : trafoCalc.total;

      const lvSwitchgearUnits = (project.includeLvSwitchgear && totalDesignContKw > 0)
        ? (ovQty.lvacb !== undefined && ovQty.lvacb !== "" ? Number(ovQty.lvacb) : Math.max(1, transformerUnits))
        : 0;

      // UPS & BESS Ride-Through / AI Checkpoint Shutdown Sizing
      const upsCriticalLoadKva = project.upsBacksUpCooling ? totalFacilityPeakKva : Math.round(totalNameplatePeakKw / 0.9);
      const upsCalc = (project.includeUpsContainer && totalDesignContKw > 0) ? calcRedundantUnits(upsCriticalLoadKva, selUps.ratedCapacity || 1000, project.uptimeTier) : { activeN: 0, redundantR: 0, total: 0 };
      const upsContainersCount = ovQty.ups !== undefined && ovQty.ups !== "" ? Number(ovQty.ups) : upsCalc.total;

      const dodFactor = project.batteryChemistry === "LFP" ? (standards.lfpDoDPct / 100) : (standards.vrlaDoDPct / 100);
      const invEff = 0.96;
      const agingFactor = 0.85;
      const criticalBackupKw = Math.round(upsCriticalLoadKva * 0.9);
      const batteryKwhReq = (criticalBackupKw * ((project.batteryRuntimeMin || 15) / 60)) / (dodFactor * invEff * agingFactor);
      const autoBattUnits = (project.includeBatteryContainer && totalDesignContKw > 0) ? Math.max(1, Math.ceil(batteryKwhReq / 1200)) : 0;
      const batteryContainersCount = ovQty.bess !== undefined && ovQty.bess !== "" ? Number(ovQty.bess) : autoBattUnits;

      // DG Altitude & Ambient Derating
      const altDerate = (project.elevationM || 0) > 1000 ? Math.max(0.80, 1 - (((project.elevationM - 1000) / 1000) * 0.04)) : 1.0;
      const tempDerate = (project.peakDryBulb || 38) > 40 ? Math.max(0.85, 1 - ((project.peakDryBulb - 40) * 0.015)) : 1.0;
      const dgDerateFactor = Number((altDerate * tempDerate).toFixed(3));
      const effectiveDgKva = Math.round((selDg.ratedCapacity || 1500) * dgDerateFactor);
      const dgCalc = (project.includeDgYard && totalDesignContKw > 0) ? calcRedundantUnits(totalFacilityPeakKva, effectiveDgKva, project.uptimeTier) : { activeN: 0, redundantR: 0, total: 0 };
      const autoDgUnits = dgCalc.total > 0 ? Math.max(2, dgCalc.total) : 0;
      const dgUnitsCount = ovQty.dg !== undefined && ovQty.dg !== "" ? Number(ovQty.dg) : autoDgUnits;
      const totalHsdFuelLitres = Math.round(totalFacilityPeakKw * 0.8 * 0.25 * (project.dgAutonomyHours || 24));

      // Novec 1230 Clean-Agent Gas Mass (kg)
      const totalNetPodVolM3 = pods.reduce((s, p) => s + ((p.extLengthMm / 1000) * (p.extWidthMm / 1000) * ((p.extHeightMm - project.plenumHeightMm) / 1000)), 0);
      const novecGasKg = Math.round(totalNetPodVolM3 * 0.68);

      // Separated Non-IT Yard Area Breakdown (m²)
      const yardBreakdown = {
        cduPumpSqm: Math.round((extCduUnits * (selCdu.footprintSqm || 6.5)) + (pumpSkidsCount * 10) + (project.includeGlycolDosing ? 6 : 0)),
        coolerChillerSqm: Math.round((adiabaticUnits * (selCooler.footprintSqm || 24)) + (trimChillerUnits * 18)),
        waterTankSqm: Math.round(waterTankUnits * (selTank.footprintSqm || 12)),
        substationSqm: Math.round((transformerUnits * (selTrafo.footprintSqm || 14)) + (lvSwitchgearUnits * 8) + (project.includeHtVcb ? 10 : 0)),
        upsBessSqm: Math.round((upsContainersCount * (selUps.footprintSqm || 28)) + (batteryContainersCount * 36)),
        dgPesoSqm: Math.round((dgUnitsCount * (selDg.footprintSqm || 36)) + (dgUnitsCount > 0 ? Math.ceil(totalHsdFuelLitres / 2000) : 0)),
        adminStagingSqm: Math.round((project.includeAdminModule ? 40 : 0) + (project.includeStagingModule ? 35 : 0))
      };
      const totalNonItYardSqm = Object.values(yardBreakdown).reduce((a, b) => a + b, 0);
      const totalCampusOccupiedSqm = Math.round((totalItWhiteSpaceSqm + totalNonItYardSqm) * 1.25); // includes inter-skid service walkways

      const isHighSeismic = project.seismicZone === "Zone IV" || project.seismicZone === "Zone V";

      const getItemPrice = (key, qty, label, category, specs, customMasterUnitCost = null) => {
        const base = catMap[key] || { cost: 500000, make: "Standard OEM", model: "GEN-1", unit: "per unit" };
        const masterUnitCost = customMasterUnitCost !== null ? Number(customMasterUnitCost) : Number(base.cost || 0);
        const ov = project.dealOverrides?.[key];

        let dealUnitCost = masterUnitCost;
        let isOverridden = false;
        let discountPct = 0;

        if (ov) {
          if (ov.mode === "discount" && ov.discountPct !== undefined && ov.discountPct !== "") {
            discountPct = Number(ov.discountPct) || 0;
            dealUnitCost = Math.round(masterUnitCost * (1 - discountPct / 100));
            isOverridden = true;
          } else if (ov.mode === "price" && ov.specialPrice !== undefined && ov.specialPrice !== "") {
            dealUnitCost = Number(ov.specialPrice);
            discountPct = masterUnitCost > 0 ? Number((((masterUnitCost - dealUnitCost) / masterUnitCost) * 100).toFixed(1)) : 0;
            isOverridden = true;
          }
        }

        const rawCostTotal = dealUnitCost * qty;
        const withContingency = rawCostTotal * (1 + project.contingencyPct / 100);
        const sellingPreTax = withContingency / Math.max(0.05, 1 - project.marginPct / 100);
        const gstAmt = sellingPreTax * (project.gstPct / 100);
        return {
          key, category, label, specs,
          make: base.make, model: base.model, unit: base.unit || "unit",
          qty, masterUnitCost, unitCost: dealUnitCost,
          isOverridden, discountPct,
          validUntil: ov?.validUntil || "",
          comments: ov?.comments || "",
          rawCostTotal, withContingency, sellingPreTax, gstAmt,
          grandTotalInclGst: sellingPreTax + gstAmt
        };
      };

      const bomItems = [];

      if (pods.length > 0) {
        const netShellSqm = Math.max(40, Math.round(pods.reduce((s, p) => s + p.shellAreaSqm, 0) - sharedWallSavingsSqm));
        if (project.bespokeContainerPriceInr !== "" && Number(project.bespokeContainerPriceInr) > 0) {
          bomItems.push(getItemPrice("containerPodShell", pods.length, `Modular IT Compute Containers (${pods.length} Pods, ${project.metallurgy})`, "Modular Enclosures & Civil", `${(pods[0].extLengthMm/1000).toFixed(2)}m L × ${(pods[0].extWidthMm/1000).toFixed(2)}m W | Dedicated White-Space`, Number(project.bespokeContainerPriceInr)));
        } else {
          bomItems.push(getItemPrice("shellPerSqm", netShellSqm, `Custom Modular IT Enclosures (${pods.length} Pods, ${project.metallurgy})`, "Modular Enclosures & Civil", `${project.hallTopology} | ${Math.round(totalItWhiteSpaceSqm)} m² White-Space`));
        }

        if (isHighSeismic || project.emiShielding) {
          bomItems.push(getItemPrice("seismicBracingPod", pods.length, `Seismic Reinforcement (${project.seismicZone}), EMI Shielding & Flex Loops`, "Modular Enclosures & Civil", `${project.seismicLabel} + Weather/Heat Proofing`));
        }

        const totalMeters = pods.reduce((s, p) => s + (p.extLengthMm / 1000) * 2, 0);
        bomItems.push(getItemPrice("buswayPerMeter", Math.round(totalMeters * (project.uptimeTier === "Tier IV" ? 2 : 1.5)), `Overhead Dual A/B Power Busways (${standards.buswayAmperageA}A)`, "Power Distribution & Transformation", `${project.uptimeTier} Redundant Overhead Busways`));
        if (project.includeIntelligentRpdu) {
          bomItems.push(getItemPrice("intelligentRpdu", activeRacks.length, "Intelligent 0U Metered/Switched Rack PDUs (Dual A/B Set)", "Power Distribution & Transformation", `${activeRacks.length} Dual-Feed Rack PDU Pairs`));
        }
        if (hasDlcRacks) {
          bomItems.push(getItemPrice("ss316HeaderPerMeter", Math.round(totalMeters * 2.2), "SS316L Supply/Return Coolant Headers & Isolation Valves", "Hydraulics, Piping & Water Storage", `${standards.coolantType} (${Math.round(totalFlowLpm)} LPM)`));
        }
      }

      if (extCduUnits > 0) bomItems.push(getItemPrice(selCdu.id, extCduUnits, selCdu.label, "Liquid Cooling & Heat Rejection", `Yard CDU Skid: ${Math.round(extCduRequiredKw)} kW (${cduCalc.activeN}+${cduCalc.redundantR})`));
      if (adiabaticUnits > 0) bomItems.push(getItemPrice(selCooler.id, adiabaticUnits, selCooler.label, "Liquid Cooling & Heat Rejection", `${coolingMode} (${coolerCalc.activeN}+${coolerCalc.redundantR})`));
      if (trimChillerUnits > 0) bomItems.push(getItemPrice("trimChiller500Kw", trimChillerUnits, "Peak Monsoon Mechanical Trim Chillers (500 kW)", "Liquid Cooling & Heat Rejection", `Handles ${trimChillerKw} kW peak wet-bulb trim`));
      if (airSideUnits > 0) {
        const airKey = project.airCoolingType === "RDHX" ? "rdhxUnit45Kw" : project.airCoolingType === "In-Row" ? "inRowCooler40Kw" : "roomDehumPac40Kw";
        bomItems.push(getItemPrice(airKey, airSideUnits, `Residual & Air-Side Cooling (${project.airCoolingType})`, "Liquid Cooling & Heat Rejection", `Handles ${Math.round(totalAirKw)} kW residual radiant & AC rack load`));
      }

      if (pumpSkidsCount > 0) bomItems.push(getItemPrice("primaryPumpSkid", pumpSkidsCount, `VFD Circulating Pump Skids (${project.pumpStagingMode})`, "Hydraulics, Piping & Water Storage", `${Math.round(totalFlowLpm)} LPM @ ${pumpDesignHeadBar} bar TDH + 50μ Strainer`));
      if (waterTankUnits > 0) bomItems.push(getItemPrice(selTank.id, waterTankUnits, `${selTank.label} (${totalWaterStorageKl} kL Total)`, "Hydraulics, Piping & Water Storage", `${project.waterAutonomyDays}-day peak evap buffer + loop fill`));
      if (hasDlcRacks && project.includeGlycolDosing && pods.length > 0) bomItems.push(getItemPrice("glycolDosingSkid", 1, "Automated PG25 Glycol Dosing, RO/DM & Expansion Vessel", "Hydraulics, Piping & Water Storage", `${standards.coolantType}`));

      if (transformerUnits > 0) bomItems.push(getItemPrice(selTrafo.id, transformerUnits, `${selTrafo.label} (${project.transformerType})`, "Power Distribution & Transformation", `${transformerUnits} × ${selTrafo.ratedCapacity} kVA (${totalFacilityPeakKva} kVA peak)`));
      if (project.includeHtVcb && transformerUnits > 0) bomItems.push(getItemPrice("htVcbPanel", Math.max(1, Math.ceil(transformerUnits / 2)), "11kV/33kV Indoor HT VCB Ring Main & Metering Panel", "Power Distribution & Transformation", "SF6/Vacuum Circuit Breaker Switchboard"));
      if (lvSwitchgearUnits > 0) bomItems.push(getItemPrice("lvSwitchgearPanel", lvSwitchgearUnits, "Main LV ACB Switchgear & Auto-Transfer Lineup", "Power Distribution & Transformation", `3200A Form-4B Drawout Switchboard`));

      if (upsContainersCount > 0) bomItems.push(getItemPrice(selUps.id, upsContainersCount, selUps.label, "Backup Power & Energy Storage", `${project.uptimeTier} Modular UPS (${upsCalc.activeN}+${upsCalc.redundantR})`));
      if (batteryContainersCount > 0) bomItems.push(getItemPrice("batteryContainer15Min", batteryContainersCount, `Containerized ${project.batteryChemistry} Battery Pods (${project.batteryRuntimeMin} min)`, "Backup Power & Energy Storage", `${Math.round(batteryKwhReq)} kWh (${project.upsRideThroughMode})`));
      if (dgUnitsCount > 0) bomItems.push(getItemPrice(selDg.id, dgUnitsCount, selDg.label, "Backup Power & Energy Storage", `${dgUnitsCount} × ${selDg.ratedCapacity} kVA (${totalHsdFuelLitres.toLocaleString()}L PESO fuel)`));

      if (project.includeIntegratedBms && pods.length > 0) bomItems.push(getItemPrice("integratedBmsPod", pods.length, "Integrated IBMS, DCIM, EPMS & PLC Telemetry Suite", "BMS, Fire Suppression & Security", "SCADA, branch power, CDU & thermal telemetry"));
      if (project.includeLeakRope && pods.length > 0) {
        const ropeMeters = Math.round(pods.reduce((s, p) => s + (p.extLengthMm / 1000) * 3, 0));
        bomItems.push(getItemPrice("leakDetectionRope", ropeMeters, "Addressable Conductive Liquid Leak Detection Rope & Panel", "BMS, Fire Suppression & Security", `${ropeMeters}m perimeter & manifold zone sensing`));
      }
      if (project.includeVesdaFire && pods.length > 0) bomItems.push(getItemPrice("vesdaFirePod", pods.length, `VESDA Aspirating Smoke + Novec 1230 Clean Agent (${novecGasKg} kg)`, "BMS, Fire Suppression & Security", "Early warning laser detection + clean-agent flooding"));
      if (project.includeCctvSecurity && pods.length > 0) bomItems.push(getItemPrice("cctvSecuritySite", Math.max(1, Math.ceil(pods.length / 2)), "IP CCTV Surveillance, 90-Day NVR & Biometric Access", "BMS, Fire Suppression & Security", "Internal aisle domes + perimeter PTZ & turnstiles"));

      if (project.includeAcousticBarrier) bomItems.push(getItemPrice("acousticBarrierMeter", 85, "CPCB Neighbor-Boundary Acoustic Louver & Barrier Wall", "Modular Enclosures & Civil", "Attenuates yard noise to <= 65 dBA at boundary"));
      if (project.includeAdminModule) bomItems.push(getItemPrice("adminSparesModule", 1, "Operations NOC, Admin & ESD Spares Workshop Container", "Modular Enclosures & Civil", "Operator consoles, diagnostic bench & spare manifolds"));
      if (project.includeStagingModule) bomItems.push(getItemPrice("stagingDockModule", 1, "Staging, Unloading Dock & Nitrogen Leak-Test Bay", "Modular Enclosures & Civil", "Hydraulic lift + heavy rack de-crating zone"));

      const plinthSqm = Math.round(totalItWhiteSpaceSqm + totalNonItYardSqm);
      if (plinthSqm > 0) {
        bomItems.push(getItemPrice("civilPlinthPerSqm", plinthSqm, "Elevated RCC Monsoon Plinths, Storm Drains & Canopy", "Modular Enclosures & Civil", `${project.regulatoryCode}`));
      }

      const hardwareCapexRaw = bomItems.reduce((s, it) => s + it.rawCostTotal, 0);

      if (project.includeInstallation && pods.length > 0) {
        bomItems.push(getItemPrice("installCommissionPod", pods.length, "Turnkey Site Rigging, Ganging, Hydro-Flush & IST (L1–L5)", "Services & AMC", "Crane lifting, inter-bay sealing & commissioning"));
      }
      if (project.includeAmcContract && totalDesignContKw > 0) {
        const mwQty = Number((totalDesignContKw / 1000).toFixed(2));
        const years = Number(project.amcYears) || 5;
        if (project.amcPricingBasis === "PctOfCapex") {
          const pct = Number(project.amcPctOfCapex) || 3.5;
          const annualBaseCost = Math.round(hardwareCapexRaw * (pct / 100));
          bomItems.push(getItemPrice("annualAmcOpsPerMw", years, `${years}-Year Managed O&M, AMC & Consumables (${pct}% of CapEx/yr)`, "Services & AMC", `${project.amcSupportModel} (${project.residentHeadcount} staff, ${years} yrs)`, annualBaseCost));
        } else {
          bomItems.push(getItemPrice("annualAmcOpsPerMw", Number((mwQty * years).toFixed(2)), `${years}-Year Managed O&M, Annual AMC & Consumables`, "Services & AMC", `${project.amcSupportModel} (${project.residentHeadcount} staff, ${years} yrs × ${mwQty} MW)`));
        }
      }

      (project.nonStandardWorks || []).forEach(nsw => {
        if ((Number(nsw.qty) || 0) > 0 && (Number(nsw.unitCostInr) || 0) > 0) {
          bomItems.push(getItemPrice(`nsw_${nsw.id}`, Number(nsw.qty), nsw.desc || "Non-Standard Site Work", "Non-Standard Works", `Custom BOQ (${nsw.unit})`, Number(nsw.unitCostInr)));
        }
      });

      const totals = bomItems.reduce((acc, it) => ({
        rawCost: acc.rawCost + it.rawCostTotal,
        contingency: acc.contingency + (it.withContingency - it.rawCostTotal),
        sellingPreTax: acc.sellingPreTax + it.sellingPreTax,
        gst: acc.gst + it.gstAmt,
        grandTotal: acc.grandTotal + it.grandTotalInclGst
      }), { rawCost: 0, contingency: 0, sellingPreTax: 0, gst: 0, grandTotal: 0 });

      const capexItems = bomItems.filter(i => i.category !== "Services & AMC");
      const servicesAmcItems = bomItems.filter(i => i.category === "Services & AMC");
      const capexSellingPreTax = capexItems.reduce((s, i) => s + i.sellingPreTax, 0);
      const servicesAmcPreTax = servicesAmcItems.reduce((s, i) => s + i.sellingPreTax, 0);

      const d1Factor = project.deploymentMode === "Phased" ? (project.day1SharePct || 50) / 100 : 1.0;
      const day1CapexPreTax = Math.round(capexSellingPreTax * (0.35 + 0.65 * d1Factor));
      const dayNCapexPreTax = Math.max(0, Math.round(capexSellingPreTax - day1CapexPreTax));

      const annualItKwh = totalActualKw * 8760;
      const annualFacilityKwh = annualItKwh * pueAnnualized;
      const annualPowerCostInr = annualFacilityKwh * (project.gridTariffInrKwh || 8.5);
      const annualWaterCostInr = annualWaterKl * (project.waterTariffInrKl || 65);
      const annualAmcCostInr = project.includeAmcContract ? (servicesAmcPreTax / Math.max(1, project.amcYears || 5)) : (capexSellingPreTax * 0.03);
      const annualTotalOpexInr = annualPowerCostInr + annualWaterCostInr + annualAmcCostInr;
      const fiveYearTcoInr = capexSellingPreTax + (annualTotalOpexInr * 5);

      const verts = project.parcelVertices || [];
      let area = 0;
      for (let i = 0; i < verts.length; i++) {
        const j = (i + 1) % verts.length;
        area += verts[i].x * verts[j].y - verts[j].x * verts[i].y;
      }
      const grossPlotSqm = Math.abs(area) / 2;
      const netBuildableSqm = Math.max(100, grossPlotSqm * 0.72);
      const plotUtilizationPct = Math.min(100, Math.round((totalCampusOccupiedSqm / Math.max(1, netBuildableSqm)) * 100));

      const sourceDba = dgUnitsCount > 0 ? 82 : 76;
      const attenuationDb = 20 * Math.log10(Math.max(2, project.setbackMeters)) + (project.includeAcousticBarrier ? 12 : 0);
      const boundaryNoiseDba = Math.round(sourceDba - attenuationDb);

      const scaleWks = Math.max(1, Math.ceil(totalDesignContKw / 5000));
      const ganttTasks = [
        { task: "1. Detailed Engineering, Statutory Approvals & Submittals", startWk: 1, durWk: 3 + scaleWks },
        { task: "2. Container Fabrication, Seismic Bracing & Factory Integration", startWk: 2, durWk: 6 + scaleWks },
        { task: "3. Site Civil Plinths, Trenches & Utility Grid Readiness", startWk: 3, durWk: 5 + scaleWks },
        { task: "4. Substation, Modular UPS, BESS, DGs & Cooling Yard", startWk: 5, durWk: 6 + scaleWks },
        { task: "5. Delivery, Crane Rigging, Inter-Bay Ganging & Hydro-Flush", startWk: 9 + scaleWks, durWk: 3 },
        { task: "6. Cold/Hot Commissioning, IST (L1–L5) & Handover", startWk: 12 + scaleWks, durWk: 2 }
      ];

      const validations = [];
      if (activeRacks.length === 0) {
        validations.push({ status: "FAIL", code: "VAL-00", title: "No IT Racks Configured", msg: "Add IT racks in Step 2 (or click Auto-Populate) to size containers, cooling, pumps, and power." });
      } else {
        validations.push({ status: "PASS", code: "VAL-00", title: "IT Compute Load Defined", msg: `${activeRacks.length} racks (${(dlcDesignKw/1000).toFixed(2)} MW DLC / ${(acDesignKw/1000).toFixed(2)} MW AC).` });
      }

      if (inletTempViolation) {
        validations.push({ status: "FAIL", code: "VAL-T1", title: "Coolant Supply Temp Exceeds Rack Inlet Limit", msg: `Target supply ${effectiveSupplyTempC}°C exceeds lowest active DLC rack ceiling (${governingMaxInletTempC}°C). Lower Target Supply Temp.` });
      } else if (hasDlcRacks) {
        validations.push({ status: "PASS", code: "VAL-T1", title: "Inlet Coolant Temperature Envelope Verified", msg: `Supply ${effectiveSupplyTempC}°C <= Governing Rack Limit ${governingMaxInletTempC}°C (${freeCoolMonths}m Free / ${adiabaticMonths}m Spray / ${trimChillerMonths}m Trim).` });
      }

      if (hasDlcRacks && (!project.includeLiquidLoop || !project.includePumpSkids || !project.includeWaterTanks)) {
        validations.push({ status: "FAIL", code: "VAL-01", title: "Incomplete DLC Hydraulic Loop", msg: "DLC racks require Liquid Heat Rejection, VFD Pump Skids, and Make-Up/Expansion Water Tanks enabled." });
      } else if (hasExtCduRacks && !project.includeExtCdu) {
        validations.push({ status: "FAIL", code: "VAL-02", title: "Missing Yard External CDUs", msg: "External-CDU racks require Yard Liquid CDUs enabled." });
      } else if (activeRacks.length > 0) {
        validations.push({ status: "PASS", code: "VAL-01", title: "DLC Hydraulic & Thermal Loop Verified", msg: `${Math.round(totalFlowLpm)} LPM @ ${pumpDesignHeadBar} bar TDH + ${totalWaterStorageKl} kL tank storage matched.` });
      }

      if (activeRacks.length > 0 && (!project.includeIntegratedBms || !project.includeVesdaFire)) {
        validations.push({ status: "WARNING", code: "VAL-03", title: "IBMS or VESDA Fire Suppression Unchecked", msg: "Mission-critical AI clusters require IBMS and VESDA + Novec 1230 suppression." });
      } else if (activeRacks.length > 0) {
        validations.push({ status: "PASS", code: "VAL-03", title: "IBMS, VESDA & Novec 1230 Verified", msg: `IBMS, leak ropes, VESDA laser smoke & ${novecGasKg} kg Novec 1230 clean agent active.` });
      }

      if (activeRacks.length > 0 && !project.includeUpsContainer) {
        validations.push({ status: "WARNING", code: "VAL-04", title: "Modular UPS Excluded", msg: `No Modular UPS configured for ${project.uptimeTier} facility.` });
      } else if (upsContainersCount > 0) {
        const upsUnitKva = selUps.ratedCapacity || 1000;
        const nPlus1Kva = Math.max(0, (upsContainersCount - 1) * upsUnitKva);
        if (project.uptimeTier !== "Tier II" && nPlus1Kva < upsCriticalLoadKva) {
          validations.push({ status: "WARNING", code: "VAL-04", title: "UPS N+1 Headroom Tight", msg: `N+1 capacity (${nPlus1Kva} kVA) is below critical load (${upsCriticalLoadKva} kVA).` });
        } else {
          validations.push({ status: "PASS", code: "VAL-04", title: "Substation, UPS & Checkpoint Ride-Through Verified", msg: `${upsContainersCount} × ${upsUnitKva} kVA UPS + ${project.batteryRuntimeMin} min ${project.batteryChemistry} (${Math.round(batteryKwhReq)} kWh).` });
        }
      }

      if (boundaryNoiseDba > 65 && !project.includeAcousticBarrier) {
        validations.push({ status: "WARNING", code: "VAL-06", title: "CPCB Boundary Noise Exceeds 65 dBA", msg: `Estimated boundary noise is ${boundaryNoiseDba} dBA at ${project.setbackMeters}m setback. Enable Acoustic Barrier Wall.` });
      } else if (pods.length > 0) {
        validations.push({ status: "PASS", code: "VAL-06", title: "Boundary Acoustic Envelope Verified", msg: `Estimated perimeter sound is ${boundaryNoiseDba} dBA (within CPCB 65 dBA industrial limit).` });
      }

      if (project.setbackMeters < 6.0) {
        validations.push({ status: "FAIL", code: "VAL-07", title: "NBC Fire-Tender Driveway Violation", msg: `Setback is ${project.setbackMeters}m. Indian NBC Part 4 requires >= 6.0m clear fire-tender access.` });
      } else {
        validations.push({ status: "PASS", code: "VAL-07", title: "NBC Setback & Parcel Fit Verified", msg: `${project.setbackMeters}m fire lane preserved; ${plotUtilizationPct}% net buildable plot utilized.` });
      }

      const failCount = validations.filter(v => v.status === "FAIL").length;
      const warnCount = validations.filter(v => v.status === "WARNING").length;

      return {
        activeRacks, dlcRacks, acRacks, pods, dlcPods, acPods,
        totalNameplatePeakKw, totalDesignContKw, totalActualKw, dlcDesignKw, acDesignKw,
        totalLiquidKw, totalAirKw,
        governingMaxInletTempC, effectiveSupplyTempC, inletTempViolation,
        monthlyProfile, freeCoolMonths, adiabaticMonths, trimChillerMonths, peakMonthWaterKl, annualWaterKl,
        totalFlowLpm, maxReqDeltaPBar, headerFrictionBar, cduDropBar, pumpDesignHeadBar, pumpSkidsCount, pumpCalc,
        reqWaterKl, totalWaterStorageKl, waterTankUnits, selTank,

        pueAnnualized, puePeakDesign, totalFacilityPeakKw, totalFacilityPeakKva,
        selTrafo, trafoCalc, transformerUnits, lvSwitchgearUnits,
        selUps, upsCalc, upsContainersCount, upsCriticalLoadKva,

        selDg, dgCalc, dgUnitsCount, dgDerateFactor, effectiveDgKva, totalHsdFuelLitres,

    function formatMoney(valInr, currency = "INR", standards = INITIAL_STANDARDS) {
      if (currency === "USD") {
        const v = valInr / (standards.usdRate || 84);
        return "$" + (v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : Math.round(v).toLocaleString("en-US"));
      }
      if (currency === "EUR") {
        const v = valInr / (standards.eurRate || 91);
        return "€" + (v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : Math.round(v).toLocaleString("en-US"));
      }
      if (valInr >= 1e7) return "₹" + (valInr / 1e7).toFixed(2) + " Cr";
      if (valInr >= 1e5) return "₹" + (valInr / 1e5).toFixed(2) + " L";
      return "₹" + Math.round(valInr).toLocaleString("en-IN");
    }

    // HIGH-RESOLUTION VECTOR-TO-PNG RENDERERS FOR EMBEDDED POWERPOINT DIAGRAMS
    // Pure White (#FFFFFF) Canvas, Brand Orange (#FF5539), Black/Charcoal Linework, Custom Equipment Colors + Legends
    function renderAshraeChartPng(project, eng) {
      const canvas = document.createElement("canvas");
      canvas.width = 1100;
      canvas.height = 420;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#FFFFFF";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const padL = 70, padR = 70, padT = 45, padB = 55;
      const plotW = canvas.width - padL - padR;
      const plotH = canvas.height - padT - padB;

      // Grid lines
      ctx.strokeStyle = "#E5E7EB";
      ctx.lineWidth = 1;
      for (let i = 0; i <= 5; i++) {
        const y = padT + (plotH * i) / 5;
        ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
        ctx.fillStyle = "#333333";
        ctx.font = "12px Roboto, sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(`${50 - i * 10}°C`, padL - 10, y + 4);
      }

      const prof = eng.monthlyProfile || [];
      const maxWater = Math.max(...prof.map(m => m.monthlyWaterKl), 100);
      const stepX = plotW / 12;

      // Water Consumption Bars (Right Axis)
      prof.forEach((m, idx) => {
        const x = padL + idx * stepX + stepX * 0.2;
        const bw = stepX * 0.6;
        const bh = (m.monthlyWaterKl / maxWater) * plotH * 0.85;
        ctx.fillStyle = m.mode === "FreeCooling" ? "#D1FAE5" : m.mode === "AdiabaticSpray" ? "#FED7AA" : "#FECACA";
        ctx.fillRect(x, padT + plotH - bh, bw, bh);
        ctx.fillStyle = "#333333";
        ctx.font = "bold 11px Roboto, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`${m.monthlyWaterKl}kL`, x + bw / 2, padT + plotH - bh - 6);
        ctx.fillText(m.month, x + bw / 2, padT + plotH + 22);
      });

      // Supply Limit Line (Effective Supply Temp - 3C approach)
      const limitTemp = Math.max(10, Math.min(50, eng.effectiveSupplyTempC - 3));
      const limitY = padT + plotH - (limitTemp / 50) * plotH;
      ctx.strokeStyle = "#000000";
      ctx.setLineDash([6, 4]);
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(padL, limitY); ctx.lineTo(padL + plotW, limitY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#000000";
      ctx.textAlign = "left";
      ctx.font = "bold 12px Roboto, sans-serif";
      ctx.fillText(`Facility Loop Limit (${limitTemp.toFixed(1)}°C = ${eng.effectiveSupplyTempC}°C Supply - 3°C Approach)`, padL + 8, limitY - 6);

      // Dry Bulb Line (Brand Orange)
      ctx.strokeStyle = "#FF5539";
      ctx.lineWidth = 3;
      ctx.beginPath();
      prof.forEach((m, idx) => {
        const x = padL + idx * stepX + stepX / 2;
        const y = padT + plotH - (Math.min(50, m.dryBulbC) / 50) * plotH;
        if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // Wet Bulb Line (Dark Slate)
      ctx.strokeStyle = "#1E293B";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      prof.forEach((m, idx) => {
        const x = padL + idx * stepX + stepX / 2;
        const y = padT + plotH - (Math.min(50, m.wetBulbC) / 50) * plotH;
        if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // Legend Header
      ctx.font = "bold 13px Roboto, sans-serif";
      ctx.fillStyle = "#FF5539"; ctx.textAlign = "left";
      ctx.fillText("— Peak Dry-Bulb (°C)", padL, 24);
      ctx.fillStyle = "#1E293B";
      ctx.fillText("— Coincident Wet-Bulb (°C)", padL + 175, 24);
      ctx.fillStyle = "#333333";
      ctx.fillText("Bars: Monthly Evaporation Water (kL) [Green=Free Cool | Amber=Adiabatic | Red=Trim Chiller]", padL + 385, 24);

      return canvas.toDataURL("image/png");
    }

                <button onClick={() => onNavigate("solution")} className="px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-xs font-bold">⚙ Tune Subsystems</button>

    function ThreeDStudio({ project, eng, palette, onUpdatePalette, onApplyTheme }) {
      const mountRef = useRef(null);
      const [viewScope, setViewScope] = useState("Hall");
      const [selectedPodIdx, setSelectedPodIdx] = useState(0);
      const [isLoadedMode, setIsLoadedMode] = useState(true);
      const [cameraPreset, setCameraPreset] = useState("Iso");
      const [layers, setLayers] = useState({
        shell: true,
        floorTransparent: true,
        plumbing: true,
        buswaysData: true,
        racks: true,
        yardEquipment: true
      });

      const cameraRef = useRef(null);
      const controlsRef = useRef(null);

      useEffect(() => {
        const el = mountRef.current;
        if (!el || !window.THREE) return;
        const width = el.clientWidth || 800;
        const height = el.clientHeight || 480;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0B1528);
        scene.fog = new THREE.FogExp2(0x0B1528, 0.007);

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 300);
        camera.position.set(18, 15, 22);
        cameraRef.current = camera;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        el.innerHTML = "";
        el.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.maxPolarAngle = Math.PI * 0.49;
        controlsRef.current = controls;

        scene.add(new THREE.AmbientLight(0xffffff, 0.72));
        const dir = new THREE.DirectionalLight(0xffffff, 0.9);
        dir.position.set(22, 32, 18);
        scene.add(dir);

        scene.add(new THREE.GridHelper(90, 90, 0x1E3A8A, 0x172554));

        const podsToRender = viewScope === "SinglePod"
          ? [eng.pods[selectedPodIdx] || eng.pods[0]].filter(Boolean)
          : eng.pods;

        const isGanged = viewScope === "Hall" && project.hallTopology !== "Isolated";
        const isUShaped = viewScope === "Hall" && project.hallTopology === "GangedUShaped";
        const spacing = isGanged ? 0.08 : 2.6;

        const matWall = new THREE.MeshStandardMaterial({
          color: new THREE.Color(palette.itPod || "#0F172A"),
          roughness: 0.45, metalness: 0.65, transparent: true, opacity: 0.25, side: THREE.DoubleSide
        });
        const matFrame = new THREE.MeshStandardMaterial({ color: 0xFF5539, roughness: 0.4, metalness: 0.5 });
        const matPlinth = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
        const matFloor = new THREE.MeshStandardMaterial({
          color: 0x475569, roughness: 0.5, metalness: 0.2,
          transparent: layers.floorTransparent,
          opacity: layers.floorTransparent ? 0.28 : 0.92
        });
        const matSupplyPipe = new THREE.MeshStandardMaterial({ color: 0x0EA5E9, roughness: 0.3, metalness: 0.7 });
        const matReturnPipe = new THREE.MeshStandardMaterial({ color: 0xFF5539, roughness: 0.3, metalness: 0.7 });
        const matBusA = new THREE.MeshStandardMaterial({ color: 0x2563EB });
        const matBusB = new THREE.MeshStandardMaterial({ color: 0xF97316 });
        const matFiberTray = new THREE.MeshStandardMaterial({ color: 0xFACC15 });

        const totalSpanW = podsToRender.reduce((acc, p) => acc + p.extWidthMm / 1000 + spacing, -spacing);
        let cursorX = -totalSpanW / 2;

        // Render Dedicated IT Compute Containers (100% White-Space)
        podsToRender.forEach((pod, pIdx) => {
          const L = pod.extLengthMm / 1000;
          const W = pod.extWidthMm / 1000;
          const H = pod.extHeightMm / 1000;
          const plenumH = project.plenumHeightMm / 1000;
          const plinthH = 0.45;

          const podGroup = new THREE.Group();
          if (isUShaped && podsToRender.length >= 3) {
            if (pIdx === 0) podGroup.position.set(-L * 0.65, 0, -3);
            else if (pIdx === podsToRender.length - 1) podGroup.position.set(L * 0.65, 0, -3);
            else {
              podGroup.rotation.y = Math.PI / 2;
              podGroup.position.set((pIdx - 1) * (W + 0.1), 0, -L * 0.75 - 3);
            }
          } else {
            podGroup.position.set(cursorX + W / 2, 0, -3);
            cursorX += W + spacing;
          }

          const plinth = new THREE.Mesh(new THREE.BoxGeometry(W + 0.3, plinthH, L + 0.3), matPlinth);
          plinth.position.y = plinthH / 2;
          podGroup.add(plinth);

          const floorDeck = new THREE.Mesh(new THREE.BoxGeometry(W - 0.15, 0.06, L - 0.15), matFloor);
          floorDeck.position.y = plinthH + plenumH;
          podGroup.add(floorDeck);

          if (layers.shell) {
            const skipLeftWall = isGanged && pIdx > 0 && !isUShaped;
            const skipRightWall = isGanged && pIdx < podsToRender.length - 1 && !isUShaped;
            if (!skipLeftWall) {
              const leftW = new THREE.Mesh(new THREE.BoxGeometry(0.08, H, L), matWall);
              leftW.position.set(-W / 2, plinthH + H / 2, 0);
              podGroup.add(leftW);
            }
            if (!skipRightWall) {
              const rightW = new THREE.Mesh(new THREE.BoxGeometry(0.08, H, L), matWall);
              rightW.position.set(W / 2, plinthH + H / 2, 0);
              podGroup.add(rightW);
            }
            const frontW = new THREE.Mesh(new THREE.BoxGeometry(W, H, 0.08), matWall);
            frontW.position.set(0, plinthH + H / 2, L / 2);
            podGroup.add(frontW);

            const backW = new THREE.Mesh(new THREE.BoxGeometry(W, H, 0.08), matWall);
            backW.position.set(0, plinthH + H / 2, -L / 2);
            podGroup.add(backW);

            [[-W/2, -L/2], [W/2, -L/2], [-W/2, L/2], [W/2, L/2]].forEach(([cx, cz]) => {
              const post = new THREE.Mesh(new THREE.BoxGeometry(0.16, H, 0.16), matFrame);
              post.position.set(cx, plinthH + H / 2, cz);
              podGroup.add(post);
            });
          }

          if (layers.plumbing) {
            [-W * 0.26, W * 0.26].forEach(rx => {
              const sup = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, L - 0.4, 14), matSupplyPipe);
              sup.rotation.x = Math.PI / 2;
              sup.position.set(rx - 0.1, plinthH + plenumH * 0.45, 0);
              podGroup.add(sup);

              const ret = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, L - 0.4, 14), matReturnPipe);
              ret.rotation.x = Math.PI / 2;
              ret.position.set(rx + 0.1, plinthH + plenumH * 0.65, 0);
              podGroup.add(ret);
            });
          }

          if (layers.buswaysData) {
            const busY = plinthH + H - 0.35;
            [-W * 0.28, W * 0.28].forEach(rx => {
              const busA = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, L - 0.5), matBusA);
              busA.position.set(rx - 0.14, busY, 0);
              podGroup.add(busA);

              const busB = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, L - 0.5), matBusB);
              busB.position.set(rx + 0.14, busY, 0);
              podGroup.add(busB);

              const fiber = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.06, L - 0.5), matFiberTray);
              fiber.position.set(rx, busY - 0.22, 0);
              podGroup.add(fiber);
            });
          }

          if (isLoadedMode && layers.racks) {
            const renderRow = (rowRacks, sideSign) => {
              let zCursor = -L / 2 + 1.2;
              rowRacks.forEach(rk => {
                const rW = rk.widthMm / 1000;
                const rH = rk.heightMm / 1000;
                const rD = rk.depthMm / 1000;
                const rx = sideSign * (W * 0.27);
                const rz = zCursor + rW / 2;
                const rackCol = rk.isDlc ? palette.dlcRack : palette.acRack;

                const cabinet = new THREE.Mesh(
                  new THREE.BoxGeometry(rD, rH, rW),
                  new THREE.MeshStandardMaterial({ color: new THREE.Color(rackCol), roughness: 0.35, metalness: 0.45 })
                );
                cabinet.position.set(rx, plinthH + plenumH + 0.08 + rH / 2, rz);
                podGroup.add(cabinet);

                if (rk.isDlc) {
                  const pipeY = rk.plumbingEntry === "Top" ? (plinthH + H - 0.5) : (plinthH + plenumH * 0.55);
                  const pipeH = rk.plumbingEntry === "Top" ? 0.6 : (plenumH + 0.25);
                  const drop = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, pipeH, 10), matSupplyPipe);
                  drop.position.set(rx, pipeY, rz);
                  podGroup.add(drop);
                }
                zCursor += rW + 0.08;
              });
            };
            renderRow(pod.rowA || [], -1);
            renderRow(pod.rowB || [], 1);
          }

          scene.add(podGroup);
        });

        // Render Separated Non-IT Technical Yard Equipment (Grey Space)
        if (viewScope === "Hall" && layers.yardEquipment) {
          const yardZ = (podsToRender[0]?.extLengthMm || 12000) / 2000 + 3.5;
          const addYardBlock = (x, z, w, h, l, hexCol) => {
            const m = new THREE.Mesh(
              new THREE.BoxGeometry(w, h, l),
              new THREE.MeshStandardMaterial({ color: new THREE.Color(hexCol), roughness: 0.4, metalness: 0.35 })
            );
            m.position.set(x, h / 2 + 0.25, z);
            scene.add(m);
          };
          if (eng.extCduUnits > 0 || eng.pumpSkidsCount > 0) addYardBlock(-11, yardZ, 3.6, 2.8, 6.5, palette.cduPump);
          if (eng.adiabaticUnits > 0 || eng.waterTankUnits > 0) addYardBlock(-5.5, yardZ, 4.5, 3.0, 8.0, palette.coolerTank);
          if (eng.transformerUnits > 0) addYardBlock(0.5, yardZ, 4.0, 2.9, 6.0, palette.transformer);
          if (eng.upsContainersCount > 0 || eng.batteryContainersCount > 0) addYardBlock(6.0, yardZ, 3.2, 3.2, 11.0, palette.upsBess);
          if (eng.dgUnitsCount > 0) addYardBlock(11.5, yardZ, 3.6, 3.4, 11.0, palette.dgSet);
          if (project.includeAdminModule || project.includeStagingModule) addYardBlock(-16.5, yardZ, 3.4, 3.2, 10.0, palette.adminStage);
        }

        let animId;
        const animate = () => {
          animId = requestAnimationFrame(animate);
          controls.update();
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(animId);
          renderer.dispose();
        };
      }, [project, eng, viewScope, selectedPodIdx, isLoadedMode, layers, palette]);

      const applyPreset = (preset) => {
        setCameraPreset(preset);
        const cam = cameraRef.current;
        const ctrl = controlsRef.current;
        if (!cam || !ctrl) return;
        ctrl.target.set(0, 2, 0);
        if (preset === "Iso") cam.position.set(18, 15, 22);
        else if (preset === "Top") cam.position.set(0, 32, 0.1);
        else if (preset === "Aisle") cam.position.set(0, 2.4, 9);
        else if (preset === "Plenum") {
          setLayers(l => ({ ...l, floorTransparent: true }));
          cam.position.set(6, 1.3, 7);
          ctrl.target.set(0, 0.8, -3);
        } else if (preset === "Rear") cam.position.set(-14, 6, -16);
        ctrl.update();
      };

      const toggleLayer = (k) => setLayers(prev => ({ ...prev, [k]: !prev[k] }));

      return (
        <div className="bg-white rounded-xl card-shadow border border-slate-200 overflow-hidden">
          <div className="navy-bg text-white p-4 flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 className="text-lg font-bold">Interactive 360° 3D Container & Yard Studio</h2>
              <p className="text-xs text-slate-300">Strict IT White-Space vs. Non-IT Technical Yard Separation • Live Area (m²) & Custom Color Picker</p>
            </div>
            <div className="flex flex-wrap gap-2">
              <div className="bg-slate-900/60 p-1 rounded-lg flex">
                <button onClick={() => setViewScope("Hall")} className={`px-3 py-1.5 rounded text-xs font-bold ${viewScope === "Hall" ? "coral-bg text-white" : "text-slate-300"}`}>
                  Campus + Yard ({eng.pods.length} IT Pods)
                </button>
                <button onClick={() => setViewScope("SinglePod")} className={`px-3 py-1.5 rounded text-xs font-bold ${viewScope === "SinglePod" ? "coral-bg text-white" : "text-slate-300"}`}>
                  Single IT Pod
                </button>
              </div>
              {viewScope === "SinglePod" && eng.pods.length > 0 && (
                <select value={selectedPodIdx} onChange={e => setSelectedPodIdx(Number(e.target.value))} className="bg-slate-800 text-white text-xs rounded-lg px-2.5 py-1.5 border border-slate-600">
                  {eng.pods.map((p, idx) => (
                    <option key={p.id} value={idx}>{p.label} ({Math.round(p.designContKw)} kW | {Math.round(p.floorFootprintSqm)} m²)</option>
                  ))}
                </select>
              )}
              <div className="bg-slate-900/60 p-1 rounded-lg flex">
                <button onClick={() => setIsLoadedMode(false)} className={`px-3 py-1.5 rounded text-xs font-bold ${!isLoadedMode ? "bg-amber-500 text-slate-950" : "text-slate-300"}`}>
                  Empty Shell
                </button>
                <button onClick={() => setIsLoadedMode(true)} className={`px-3 py-1.5 rounded text-xs font-bold ${isLoadedMode ? "bg-emerald-500 text-slate-950" : "text-slate-300"}`}>
                  Loaded Cluster
                </button>
              </div>
            </div>
          </div>

          <ColorLegendBar palette={palette} onUpdatePalette={onUpdatePalette} onApplyTheme={onApplyTheme} eng={eng} />

          <div className="bg-slate-100 px-4 py-2 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2 text-xs">
            <div className="flex items-center gap-1.5 flex-shrink-0">
              <span className="font-bold text-slate-600 mr-1">Camera:</span>
              {["Iso", "Top", "Aisle", "Plenum", "Rear"].map(pr => (
                <button key={pr} onClick={() => applyPreset(pr)} className={`px-2.5 py-1 rounded font-medium ${cameraPreset === pr ? "navy-bg text-white" : "bg-white border border-slate-300 text-slate-700"}`}>
                  {pr === "Plenum" ? "Underfloor Plenum" : pr}
                </button>
              ))}
            </div>
            <div className="flex flex-wrap items-center gap-1.5">
              <span className="font-bold text-slate-600 mr-1">Layers:</span>
              {[
                ["shell", "IT Shell"],
                ["floorTransparent", "Glass Floor"],
                ["plumbing", "SS316 Headers"],
                ["buswaysData", "Busways & Fiber"],
                ["racks", "IT Racks"],
                ["yardEquipment", "Non-IT Yard Equipment"]
              ].map(([k, lbl]) => (
                <button key={k} onClick={() => toggleLayer(k)} className={`px-2 py-1 rounded font-medium border ${layers[k] ? "bg-blue-50 border-blue-500 text-blue-900" : "bg-white border-slate-300 text-slate-400"}`}>
                  {layers[k] ? "✓ " : ""}{lbl}
                </button>
              ))}
            </div>
          </div>

          {eng.pods.length === 0 ? (
            <div className="h-[420px] bg-slate-950 text-slate-300 flex flex-col items-center justify-center p-6 text-center">
              <p className="text-base font-bold text-white">No IT Racks Placed Yet</p>
              <p className="text-xs text-slate-400 mt-1 max-w-md">Open the Requirements Wizard (Step 2) to add IT compute racks—the 3D container & yard layout will generate automatically.</p>
            </div>
          ) : (
            <div ref={mountRef} className="w-full h-[460px] bg-slate-950 cursor-grab active:cursor-grabbing" />
          )}
        </div>
      );
    }

    function ParcelLayoutPlanner({ project, eng, onUpdateProject, palette, onUpdatePalette, onApplyTheme }) {
      const [statusMsg, setStatusMsg] = useState("");
      const verts = project.parcelVertices || [];
      const minX = Math.min(...verts.map(v => v.x), 0);
      const maxX = Math.max(...verts.map(v => v.x), 110);
      const minY = Math.min(...verts.map(v => v.y), 0);
      const maxY = Math.max(...verts.map(v => v.y), 90);
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;

      const loadPresetShape = (shape) => {
        if (shape === "IrregularTrapezoid") {
          onUpdateProject({ parcelShape: shape, parcelVertices: [{ x: 0, y: 0 }, { x: 110, y: 0 }, { x: 128, y: 78 }, { x: 16, y: 92 }] });
        } else if (shape === "LShaped") {
          onUpdateProject({ parcelShape: shape, parcelVertices: [{ x: 0, y: 0 }, { x: 125, y: 0 }, { x: 125, y: 48 }, { x: 64, y: 48 }, { x: 64, y: 95 }, { x: 0, y: 95 }] });
        } else if (shape === "PentagonPlot") {
          onUpdateProject({ parcelShape: shape, parcelVertices: [{ x: 10, y: 0 }, { x: 105, y: 5 }, { x: 125, y: 55 }, { x: 68, y: 96 }, { x: 0, y: 62 }] });
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const txt = ev.target.result;
          try {
            if (file.name.endsWith(".json") || file.name.endsWith(".geojson")) {
              const gj = JSON.parse(txt);
              const coords = gj.features?.[0]?.geometry?.coordinates?.[0] || gj.geometry?.coordinates?.[0];
              if (coords && coords.length >= 3) {
                const lon0 = coords[0][0], lat0 = coords[0][1];
                const pts = coords.slice(0, -1).map(([lon, lat]) => ({
                  x: Math.round((lon - lon0) * 111320 * Math.cos(lat0 * Math.PI / 180)),
                  y: Math.round((lat - lat0) * 110540)
                }));
                const offX = Math.min(...pts.map(p => p.x));
                const offY = Math.min(...pts.map(p => p.y));
                onUpdateProject({ parcelShape: "CustomGeoJSON", parcelVertices: pts.map(p => ({ x: p.x - offX, y: p.y - offY })) });
                setStatusMsg(`Imported ${pts.length} survey vertices from ${file.name}`);
              }
            } else if (file.name.endsWith(".kml")) {
              const match = txt.match(/<coordinates>([\s\S]*?)<\/coordinates>/i);
              if (match) {
                const rawPts = match[1].trim().split(/\s+/).map(pair => pair.split(",").map(Number));
                const lon0 = rawPts[0][0], lat0 = rawPts[0][1];
                const pts = rawPts.slice(0, -1).map(([lon, lat]) => ({
                  x: Math.round((lon - lon0) * 111320 * Math.cos(lat0 * Math.PI / 180)),
                  y: Math.round((lat - lat0) * 110540)
                }));
                const offX = Math.min(...pts.map(p => p.x));
                const offY = Math.min(...pts.map(p => p.y));
                onUpdateProject({ parcelShape: "CustomKML", parcelVertices: pts.map(p => ({ x: p.x - offX, y: p.y - offY })) });
                setStatusMsg(`Imported ${pts.length} vertices from KML survey`);
              }
            }
          } catch (err) {
            setStatusMsg("Could not parse KML/GeoJSON coordinates.");
          }
        };
        reader.readAsText(file);
      };

      const polyStr = verts.map(v => `${v.x},${v.y}`).join(" ");

    function App() {
      const [screen, setScreen] = useState("home");
      const [navHistory, setNavHistory] = useState([]);
      const [projects, setProjects] = useState(() => [makeSampleProject(INITIAL_STANDARDS)]);
      const [editingId, setEditingId] = useState("proj-15mw-sample");
      const [skus, setSkus] = useState(INITIAL_SKUS);
      const [containerCatalog, setContainerCatalog] = useState(INITIAL_CONTAINER_CATALOG);
      const [nonItCatalog, setNonItCatalog] = useState(INITIAL_NON_IT_CATALOG);
      const [standards, setStandards] = useState(INITIAL_STANDARDS);
      const [palette, setPalette] = useState(COLOR_THEMES.projector);
      const [logoDataUrl, setLogoDataUrl] = useState("");
      const [clientId, setClientId] = useState(DEFAULT_CLIENT_ID);
      const [driveToken, setDriveToken] = useState("");
      const [driveStatus, setDriveStatus] = useState("Local Ready");

      // Google Drive Folder Browser & Creator State
      const [showDriveModal, setShowDriveModal] = useState(false);
      const [driveModalMode, setDriveModalMode] = useState("save"); // "save" | "open"
      const [driveFolderStack, setDriveFolderStack] = useState([{ id: "root", name: "My Drive" }]);
      const [driveFolderList, setDriveFolderList] = useState([]);
      const [driveFileList, setDriveFileList] = useState([]);
      const [newFolderName, setNewFolderName] = useState("");

      // External Supply Chain Intelligence State (loaded from mdc_supply_intel.json)
      const [supplyIntel, setSupplyIntel] = useState({
        schemaVersion: "MDC_SUPPLY_INTEL_V9",
        lastRefreshed: "2026-11-17",
        items: []
      });
      const [intelCatFilter, setIntelCatFilter] = useState("UPS");
      const [intelRatingFilter, setIntelRatingFilter] = useState("");
      const [intelUrlInput, setIntelUrlInput] = useState("./mdc_supply_intel.json");

      const [wizardTab, setWizardTab] = useState(0);
      const [wizardMode, setWizardMode] = useState("create");
      const [paramTab, setParamTab] = useState("skus");
      const [nonItCatFilter, setNonItCatFilter] = useState("ALL");
      const [weatherLoading, setWeatherLoading] = useState(false);
      const [weatherMsg, setWeatherMsg] = useState("");
      const [bulkLoadValue, setBulkLoadValue] = useState(220);

      const [quoteModalItem, setQuoteModalItem] = useState(null);
      const [quoteForm, setQuoteForm] = useState({ mode: "discount", discountPct: 0, specialPrice: 0, validUntil: "", comments: "" });

      const navigateTo = (nextScreen) => {
        if (nextScreen === screen) return;
        setNavHistory(prev => [...prev, screen]);
        setScreen(nextScreen);
      };

      const goBack = () => {
        if (navHistory.length === 0) {
          setScreen("home");
          return;
        }
        const prevScreen = navHistory[navHistory.length - 1];
        setNavHistory(prev => prev.slice(0, -1));
        setScreen(prevScreen);
      };

      useEffect(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.projects?.length) setProjects(parsed.projects.map(p => sanitizeProject(p, parsed.standards || INITIAL_STANDARDS)));
            if (parsed.editingId) setEditingId(parsed.editingId);
            if (parsed.skus?.length) setSkus(parsed.skus);
            if (parsed.containerCatalog?.length) setContainerCatalog(parsed.containerCatalog);
            if (parsed.nonItCatalog?.length) setNonItCatalog(parsed.nonItCatalog);
            if (parsed.standards) setStandards({ ...INITIAL_STANDARDS, ...parsed.standards });
            if (parsed.palette) setPalette({ ...COLOR_THEMES.projector, ...parsed.palette });
            if (parsed.supplyIntel?.items) setSupplyIntel(parsed.supplyIntel);
            if (parsed.logoDataUrl) setLogoDataUrl(parsed.logoDataUrl);
            if (parsed.clientId) setClientId(parsed.clientId);
          }
        } catch (e) {}
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ projects, editingId, skus, containerCatalog, nonItCatalog, standards, palette, supplyIntel, logoDataUrl, clientId }));
        } catch (e) {}
      }, [projects, editingId, skus, containerCatalog, nonItCatalog, standards, palette, supplyIntel, logoDataUrl, clientId]);

      const currentProject = useMemo(
        () => sanitizeProject(projects.find(p => p.id === editingId) || projects[0], standards),
        [projects, editingId, standards]
      );

      const eng = useMemo(
        () => computeEngineering(currentProject, skus, nonItCatalog, standards),
        [currentProject, skus, nonItCatalog, standards]
      );

      const updateCurrentProject = (patch) => {
        setProjects(prev => prev.map(p => p.id === currentProject.id ? { ...p, ...patch, updatedAt: new Date().toISOString().slice(0, 10) } : p));
      };

      const updatePaletteKey = (k, hex) => setPalette(prev => ({ ...prev, [k]: hex }));
      const applyColorTheme = (themeKey) => {
        if (COLOR_THEMES[themeKey]) setPalette({ ...COLOR_THEMES[themeKey] });
      };

      const autoOptimizeBuildingBlocks = () => {
        const pickBest = (group, demand) => {
          const options = nonItCatalog.filter(i => i.group === group && i.ratedCapacity > 0);
          if (options.length === 0) return null;
          if (demand <= 0) return options[0].id;
          let best = options[0];
          let bestScore = Infinity;
          options.forEach(opt => {
            const calc = calcRedundantUnits(demand, opt.ratedCapacity, currentProject.uptimeTier);
            const count = group === "dg" ? Math.max(2, calc.total) : calc.total;
            const totalCost = count * opt.cost;
            const totalFootprint = count * (opt.footprintSqm || 15);
            const score = totalCost + (totalFootprint * 25000);
            if (score < bestScore) {
              bestScore = score;
              best = opt;
            }
          });
          return best.id;
        };

        const q = (currentProject.cityQuery || "").trim();
        if (!q) return;
        setWeatherLoading(true);
        setWeatherMsg("Fetching live climate & seismic zone...");
        try {
          const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`);
          const geoData = await geoRes.json();
          const place = geoData.results?.[0];
          if (!place) {
            const seis = classifySeismicZone(q, 20, 78);
            updateCurrentProject({ seismicZone: seis.zone, seismicZFactor: seis.zFactor, seismicLabel: seis.label });
            setWeatherMsg(`City coordinates not found; applied ${seis.label}. You can adjust Dry/Wet Bulb manually.`);
            setWeatherLoading(false);
            return;
          }
          const { latitude, longitude, elevation, name, country, admin1 } = place;
          const wRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=temperature_2m_max&current=relative_humidity_2m,temperature_2m&timezone=auto`);
          const wData = await wRes.json();
          const maxForecast = Math.max(...(wData.daily?.temperature_2m_max || [38]));
          const peakDryBulb = Number(Math.max(maxForecast, 34).toFixed(1));
          const rh = wData.current?.relative_humidity_2m || 65;
          const T = peakDryBulb;
          const tw = T * Math.atan(0.151977 * Math.pow(rh + 8.313659, 0.5)) + Math.atan(T + rh) - Math.atan(rh - 1.676331) + 0.00391838 * Math.pow(rh, 1.5) * Math.atan(0.023101 * rh) - 4.686035;
          const peakWetBulb = Number(Math.max(18, Math.min(peakDryBulb - 2, tw)).toFixed(1));
          const seis = classifySeismicZone(`${name} ${admin1 || ""}`, latitude, longitude);

          updateCurrentProject({
            cityQuery: `${name}${admin1 ? ", " + admin1 : ""}${country ? " (" + country + ")" : ""}`,
            lat: Number(latitude.toFixed(2)),
            lon: Number(longitude.toFixed(2)),
            elevationM: Math.round(elevation || 0),
            peakDryBulb,
            peakWetBulb,
            relHumidityPct: rh,
            monthlyClimate: synthesizeMonthlyClimate(peakDryBulb, peakWetBulb, rh),
            seismicZone: seis.zone,
            seismicZFactor: seis.zFactor,
            seismicLabel: seis.label
          });
          setWeatherMsg(`✓ Resolved ${name}: ${peakDryBulb}°C DB, ${peakWetBulb}°C WB, Elev ${Math.round(elevation || 0)}m, ${seis.label}`);
        } catch (e) {
          const seis = classifySeismicZone(q, 20, 78);
          updateCurrentProject({ seismicZone: seis.zone, seismicZFactor: seis.zFactor, seismicLabel: seis.label });
          setWeatherMsg(`Offline mode: Applied ${seis.label}. Adjust Dry/Wet Bulb manually below.`);

        const targetKw = (Number(currentProject.targetItMw) || 1.5) * 1000;
        const dlcList = skus.filter(s => s.coolingType === "DLC");
        const primaryDlc = dlcList[0];
        const secondaryDlc = dlcList[1];
        const acSku = skus.find(s => s.coolingType === "AC");
        const nextQty = {};
        skus.forEach(s => nextQty[s.id] = 0);

        if (primaryDlc) {
          const dlcShareKw = acSku ? targetKw * 0.94 : targetKw;
          const pKw = primaryDlc.peakKw * (primaryDlc.continuousFactor || 0.94);
          if (secondaryDlc && targetKw >= 6000) {
            nextQty[primaryDlc.id] = Math.max(1, Math.round((dlcShareKw * 0.68) / pKw));
            const sKw = secondaryDlc.peakKw * (secondaryDlc.continuousFactor || 0.94);
            nextQty[secondaryDlc.id] = Math.max(1, Math.round((dlcShareKw * 0.32) / sKw));
          } else {
            nextQty[primaryDlc.id] = Math.max(1, Math.round(dlcShareKw / pKw));
          }
        }
        if (acSku) {
          const acShareKw = Math.max(50, targetKw * 0.06);
          const aKw = acSku.peakKw * (acSku.continuousFactor || 0.90);
          nextQty[acSku.id] = Math.max(2, Math.round(acShareKw / aKw));

        updateRackQuantitiesWithAutoCooling(nextQty);
