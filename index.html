          {!compact && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5 text-xs">
              {(auditTab === "uptime" ? (eng.uptimeChecks || []) : auditTab === "bis" ? (eng.bisChecks || []) : [...(eng.uptimeChecks || []), ...(eng.bisChecks || []), ...eng.validations]).map((v, i) => (
                <div key={i} className={`p-3 rounded-lg border flex items-start gap-2.5 ${ragCardBg(v.status)}`}>
                  <span className={`px-2 py-0.5 rounded text-[10px] font-black flex-shrink-0 ${ragBadge(v.status)}`}>
                    {v.status === "GREEN" ? "GREEN • PASS" : v.status === "AMBER" ? "AMBER • WARN" : v.status === "RED" ? "RED • FAIL" : v.status}
                  </span>
                  <div>
                    <div className="font-bold text-slate-900">{v.code}: {v.title}</div>
                    <div className="text-slate-600 mt-0.5">{v.msg}</div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function ThreeDStudio({ project, eng, palette, onUpdatePalette, onApplyTheme }) {
      const mountRef = useRef(null);
      const [viewScope, setViewScope] = useState("Hall");
      const [selectedPodIdx, setSelectedPodIdx] = useState(0);
      const [isLoadedMode, setIsLoadedMode] = useState(true);
      const [cameraPreset, setCameraPreset] = useState("Iso");
      const [layers, setLayers] = useState({
        shell: true,
        floorTransparent: true,
        plumbing: true,
        buswaysData: true,
        racks: true,
        yardEquipment: true
      });

      const cameraRef = useRef(null);
      const controlsRef = useRef(null);

      useEffect(() => {
        const el = mountRef.current;
        if (!el || !window.THREE) return;
        const width = el.clientWidth || 800;
        const height = el.clientHeight || 480;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0B1528);
        scene.fog = new THREE.FogExp2(0x0B1528, 0.007);

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 300);
        camera.position.set(18, 15, 22);
        cameraRef.current = camera;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        el.innerHTML = "";
        el.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.maxPolarAngle = Math.PI * 0.49;
        controlsRef.current = controls;

        scene.add(new THREE.AmbientLight(0xffffff, 0.72));
        const dir = new THREE.DirectionalLight(0xffffff, 0.9);
        dir.position.set(22, 32, 18);
        scene.add(dir);

        scene.add(new THREE.GridHelper(90, 90, 0x1E3A8A, 0x172554));

        const podsToRender = viewScope === "SinglePod"
          ? [eng.pods[selectedPodIdx] || eng.pods[0]].filter(Boolean)
          : eng.pods;

        const isGanged = viewScope === "Hall" && project.hallTopology !== "Isolated";
        const isUShaped = viewScope === "Hall" && project.hallTopology === "GangedUShaped";
        const spacing = isGanged ? 0.08 : 2.6;

        const activeShellColor = (project.brandingMode && project.brandingMode !== "standard" && project.exteriorColorHex)
          ? project.exteriorColorHex
          : (palette.itPod || "#0F172A");
        const matWall = new THREE.MeshStandardMaterial({
          color: new THREE.Color(activeShellColor),
          roughness: 0.45, metalness: 0.65, transparent: true, opacity: 0.30, side: THREE.DoubleSide
        });
        const matFrame = new THREE.MeshStandardMaterial({ color: 0xFF5539, roughness: 0.4, metalness: 0.5 });
        const matPlinth = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
        const matFloor = new THREE.MeshStandardMaterial({
          color: 0x475569, roughness: 0.5, metalness: 0.2,
          transparent: layers.floorTransparent,
          opacity: layers.floorTransparent ? 0.28 : 0.92
        });
        const matSupplyPipe = new THREE.MeshStandardMaterial({ color: 0x0EA5E9, roughness: 0.3, metalness: 0.7 });
        const matReturnPipe = new THREE.MeshStandardMaterial({ color: 0xFF5539, roughness: 0.3, metalness: 0.7 });
        const matBusA = new THREE.MeshStandardMaterial({ color: 0x2563EB });
        const matBusB = new THREE.MeshStandardMaterial({ color: 0xF97316 });
        const matFiberTray = new THREE.MeshStandardMaterial({ color: 0xFACC15 });

        const totalSpanW = podsToRender.reduce((acc, p) => acc + p.extWidthMm / 1000 + spacing, -spacing);
        let cursorX = -totalSpanW / 2;

        // Render Dedicated IT Compute Containers (100% White-Space)
        podsToRender.forEach((pod, pIdx) => {
          const L = pod.extLengthMm / 1000;
          const W = pod.extWidthMm / 1000;
          const H = pod.extHeightMm / 1000;
          const plenumH = project.plenumHeightMm / 1000;
          const plinthH = 0.45;

          const podGroup = new THREE.Group();
          if (isUShaped && podsToRender.length >= 3) {
            if (pIdx === 0) podGroup.position.set(-L * 0.65, 0, -3);
            else if (pIdx === podsToRender.length - 1) podGroup.position.set(L * 0.65, 0, -3);
            else {
              podGroup.rotation.y = Math.PI / 2;
              podGroup.position.set((pIdx - 1) * (W + 0.1), 0, -L * 0.75 - 3);
            }
          } else {
            podGroup.position.set(cursorX + W / 2, 0, -3);
            cursorX += W + spacing;
          }

          const plinth = new THREE.Mesh(new THREE.BoxGeometry(W + 0.3, plinthH, L + 0.3), matPlinth);
          plinth.position.y = plinthH / 2;
          podGroup.add(plinth);

          const floorDeck = new THREE.Mesh(new THREE.BoxGeometry(W - 0.15, 0.06, L - 0.15), matFloor);
          floorDeck.position.y = plinthH + plenumH;
          podGroup.add(floorDeck);

          if (layers.shell) {
            const skipLeftWall = isGanged && pIdx > 0 && !isUShaped;
            const skipRightWall = isGanged && pIdx < podsToRender.length - 1 && !isUShaped;
            if (!skipLeftWall) {
              const leftW = new THREE.Mesh(new THREE.BoxGeometry(0.08, H, L), matWall);
              leftW.position.set(-W / 2, plinthH + H / 2, 0);
              podGroup.add(leftW);
            }
            if (!skipRightWall) {
              const rightW = new THREE.Mesh(new THREE.BoxGeometry(0.08, H, L), matWall);
              rightW.position.set(W / 2, plinthH + H / 2, 0);
              podGroup.add(rightW);
            }
            const frontW = new THREE.Mesh(new THREE.BoxGeometry(W, H, 0.08), matWall);
            frontW.position.set(0, plinthH + H / 2, L / 2);
            podGroup.add(frontW);

            const backW = new THREE.Mesh(new THREE.BoxGeometry(W, H, 0.08), matWall);
            backW.position.set(0, plinthH + H / 2, -L / 2);
            podGroup.add(backW);

            [[-W/2, -L/2], [W/2, -L/2], [-W/2, L/2], [W/2, L/2]].forEach(([cx, cz]) => {
              const post = new THREE.Mesh(new THREE.BoxGeometry(0.16, H, 0.16), matFrame);
              post.position.set(cx, plinthH + H / 2, cz);
              podGroup.add(post);
            });
          }

          if (layers.plumbing) {
            [-W * 0.26, W * 0.26].forEach(rx => {
              const sup = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, L - 0.4, 14), matSupplyPipe);
              sup.rotation.x = Math.PI / 2;
              sup.position.set(rx - 0.1, plinthH + plenumH * 0.45, 0);
              podGroup.add(sup);

              const ret = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, L - 0.4, 14), matReturnPipe);
              ret.rotation.x = Math.PI / 2;
              ret.position.set(rx + 0.1, plinthH + plenumH * 0.65, 0);
              podGroup.add(ret);
            });
          }

          if (layers.buswaysData) {
            const busY = plinthH + H - 0.35;
            [-W * 0.28, W * 0.28].forEach(rx => {
              const busA = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, L - 0.5), matBusA);
              busA.position.set(rx - 0.14, busY, 0);
              podGroup.add(busA);

              const busB = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, L - 0.5), matBusB);
              busB.position.set(rx + 0.14, busY, 0);
              podGroup.add(busB);

              const fiber = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.06, L - 0.5), matFiberTray);
              fiber.position.set(rx, busY - 0.22, 0);
              podGroup.add(fiber);
            });
          }

          if (isLoadedMode && layers.racks) {
            const renderRow = (rowRacks, sideSign) => {
              let zCursor = -L / 2 + 1.2;
              rowRacks.forEach(rk => {
                const rW = rk.widthMm / 1000;
                const rH = rk.heightMm / 1000;
                const rD = rk.depthMm / 1000;
                const rx = sideSign * (W * 0.27);
                const rz = zCursor + rW / 2;
                const rackCol = rk.isDlc ? palette.dlcRack : palette.acRack;

                const cabinet = new THREE.Mesh(
                  new THREE.BoxGeometry(rD, rH, rW),
                  new THREE.MeshStandardMaterial({ color: new THREE.Color(rackCol), roughness: 0.35, metalness: 0.45 })
                );
                cabinet.position.set(rx, plinthH + plenumH + 0.08 + rH / 2, rz);
                podGroup.add(cabinet);

                if (rk.isDlc) {
                  const pipeY = rk.plumbingEntry === "Top" ? (plinthH + H - 0.5) : (plinthH + plenumH * 0.55);
                  const pipeH = rk.plumbingEntry === "Top" ? 0.6 : (plenumH + 0.25);
                  const drop = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, pipeH, 10), matSupplyPipe);
                  drop.position.set(rx, pipeY, rz);
                  podGroup.add(drop);
                }
                zCursor += rW + 0.08;
              });
            };
            renderRow(pod.rowA || [], -1);
            renderRow(pod.rowB || [], 1);

            // Render Internal White-Space PAC Unit, Internal CDU Tower & Internal LV Switchgear/PDU Cabinet
            const baseY = plinthH + plenumH + 0.08;
            // 1. White-Space Precision Air Cooler (PAC) at rear-left utility bay
            const pacMesh = new THREE.Mesh(
              new THREE.BoxGeometry(0.95, 2.2, 1.1),
              new THREE.MeshStandardMaterial({ color: new THREE.Color(palette.coolerTank || "#059669"), roughness: 0.35 })
            );
            pacMesh.position.set(-W * 0.28, baseY + 1.1, L / 2 - 1.1);
            podGroup.add(pacMesh);

            // 2. Internal White-Space Liquid CDU Tower at rear-right utility bay (Zero Yard CDUs)
            const cduMesh = new THREE.Mesh(
              new THREE.BoxGeometry(0.85, 2.2, 1.1),
              new THREE.MeshStandardMaterial({ color: new THREE.Color(palette.cduPump || "#0284C7"), roughness: 0.35 })
            );
            cduMesh.position.set(W * 0.28, baseY + 1.1, L / 2 - 1.1);
            podGroup.add(cduMesh);

            // 3. Internal Container LV Distribution Switchboard / Tap-Off Panel near front vestibule
            const swgMesh = new THREE.Mesh(
              new THREE.BoxGeometry(0.65, 2.1, 0.9),
              new THREE.MeshStandardMaterial({ color: new THREE.Color(palette.transformer || "#7C3AED"), roughness: 0.35 })
            );
            swgMesh.position.set(-W * 0.28, baseY + 1.05, -L / 2 + 0.85);
            podGroup.add(swgMesh);
          }

          scene.add(podGroup);
        });

        // Render 3-Zone Spatial Separation:
        // Zone A: Admin/Staging co-located beside IT Pods; Zone B: Containerized UPS/BESS (8m away); Zone C: Open-Pad Trafos, Canopy DGs, Coolers/Pumps (15m away for EMI/Noise/Vibration)
        if (viewScope === "Hall" && layers.yardEquipment) {
          const basePodLen = (podsToRender[0]?.extLengthMm || 12000) / 1000;
          const addYardBlock = (x, z, w, h, l, hexCol) => {
            const m = new THREE.Mesh(
              new THREE.BoxGeometry(w, h, l),
              new THREE.MeshStandardMaterial({ color: new THREE.Color(hexCol), roughness: 0.4, metalness: 0.35 })
            );
            m.position.set(x, h / 2 + 0.25, z);
            scene.add(m);
          };
          // Zone A: Co-located Admin & Staging adjacent to IT cluster
          if (project.includeAdminModule || project.includeStagingModule) {
            addYardBlock(-totalSpanW / 2 - 3.6, -3, 3.4, 3.2, Math.min(12, basePodLen), palette.adminStage);
          }
          // Zone B: Containerized UPS & BESS Pods (8m EMI/Fire separation from IT Pods)
          const zoneBZ = basePodLen / 2 + 5.5;
          if (eng.upsContainersCount > 0 || eng.batteryContainersCount > 0) {
            addYardBlock(-4.0, zoneBZ, 3.4, 3.2, 11.0, palette.upsBess);
            if (eng.upsContainersCount + eng.batteryContainersCount > 2) {
              addYardBlock(1.0, zoneBZ, 3.4, 3.2, 11.0, palette.upsBess);
            }
          }
          // Zone C: Open Outdoor Power & Cooling Yard (>=14m away from IT Pods for EMI, Noise & Vibration Isolation)
          const zoneCZ = basePodLen / 2 + 13.5;
          if (eng.extCduUnits > 0 || eng.pumpSkidsCount > 0) addYardBlock(-11.5, zoneCZ, 3.8, 2.4, 6.5, palette.cduPump);
          if (eng.adiabaticUnits > 0 || eng.waterTankUnits > 0) addYardBlock(-5.5, zoneCZ, 4.8, 2.8, 8.0, palette.coolerTank);
          if (eng.transformerUnits > 0) addYardBlock(1.0, zoneCZ, 4.2, 2.6, 5.5, palette.transformer);
          if (eng.dgUnitsCount > 0) addYardBlock(8.0, zoneCZ, 4.0, 3.4, 11.5, palette.dgSet);
        }

        let animId;
        const animate = () => {
          animId = requestAnimationFrame(animate);
          controls.update();
          renderer.render(scene, camera);
        };
        animate();

        return () => {
          cancelAnimationFrame(animId);
          renderer.dispose();
        };
      }, [project, eng, viewScope, selectedPodIdx, isLoadedMode, layers, palette]);

      const applyPreset = (preset) => {
        setCameraPreset(preset);
        const cam = cameraRef.current;
        const ctrl = controlsRef.current;
        if (!cam || !ctrl) return;
        ctrl.target.set(0, 2, 0);
        if (preset === "Iso") cam.position.set(18, 15, 22);
        else if (preset === "Top") cam.position.set(0, 32, 0.1);
        else if (preset === "Aisle") cam.position.set(0, 2.4, 9);
        else if (preset === "Plenum") {
          setLayers(l => ({ ...l, floorTransparent: true }));
          cam.position.set(6, 1.3, 7);
          ctrl.target.set(0, 0.8, -3);
        } else if (preset === "Rear") cam.position.set(-14, 6, -16);
        ctrl.update();
      };

      const toggleLayer = (k) => setLayers(prev => ({ ...prev, [k]: !prev[k] }));

      return (
        <div className="bg-white rounded-xl card-shadow border border-slate-200 overflow-hidden">
          <div className="navy-bg text-white p-4 flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 className="text-lg font-bold">Interactive 360° 3D Container & Yard Studio</h2>
              <p className="text-xs text-slate-300">Strict IT White-Space vs. Non-IT Technical Yard Separation • Live Area (m²) & Custom Color Picker</p>
            </div>
            <div className="flex flex-wrap gap-2">
              <div className="bg-slate-900/60 p-1 rounded-lg flex">
                <button onClick={() => setViewScope("Hall")} className={`px-3 py-1.5 rounded text-xs font-bold ${viewScope === "Hall" ? "coral-bg text-white" : "text-slate-300"}`}>
                  Campus + Yard ({(eng?.pods?.length ?? 0)} IT Pods)
                </button>
                <button onClick={() => setViewScope("SinglePod")} className={`px-3 py-1.5 rounded text-xs font-bold ${viewScope === "SinglePod" ? "coral-bg text-white" : "text-slate-300"}`}>
                  Single IT Pod
                </button>
              </div>
              {viewScope === "SinglePod" && (eng?.pods?.length ?? 0) > 0 && (
                <select value={selectedPodIdx} onChange={e => setSelectedPodIdx(Number(e.target.value))} className="bg-slate-800 text-white text-xs rounded-lg px-2.5 py-1.5 border border-slate-600">
                  {eng.pods.map((p, idx) => (
                    <option key={p.id} value={idx}>{p.label} ({Math.round(p.designContKw)} kW | {Math.round(p.floorFootprintSqm)} m²)</option>
                  ))}
                </select>
              )}
              <div className="bg-slate-900/60 p-1 rounded-lg flex">
                <button onClick={() => setIsLoadedMode(false)} className={`px-3 py-1.5 rounded text-xs font-bold ${!isLoadedMode ? "bg-amber-500 text-slate-950" : "text-slate-300"}`}>
                  Empty Shell
                </button>
                <button onClick={() => setIsLoadedMode(true)} className={`px-3 py-1.5 rounded text-xs font-bold ${isLoadedMode ? "bg-emerald-500 text-slate-950" : "text-slate-300"}`}>
                  Loaded Cluster
                </button>
              </div>
            </div>
          </div>

          <ColorLegendBar palette={palette} onUpdatePalette={onUpdatePalette} onApplyTheme={onApplyTheme} eng={eng} />

          <div className="bg-slate-100 px-4 py-2 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2 text-xs">
            <div className="flex items-center gap-1.5 flex-shrink-0">
              <span className="font-bold text-slate-600 mr-1">Camera:</span>
              {["Iso", "Top", "Aisle", "Plenum", "Rear"].map(pr => (
                <button key={pr} onClick={() => applyPreset(pr)} className={`px-2.5 py-1 rounded font-medium ${cameraPreset === pr ? "navy-bg text-white" : "bg-white border border-slate-300 text-slate-700"}`}>
                  {pr === "Plenum" ? "Underfloor Plenum" : pr}
                </button>
              ))}
            </div>
            <div className="flex flex-wrap items-center gap-1.5">
              <span className="font-bold text-slate-600 mr-1">Layers:</span>
              {[
                ["shell", "IT Shell"],
                ["floorTransparent", "Glass Floor"],
                ["plumbing", "SS316 Headers"],
                ["buswaysData", "Busways & Fiber"],
                ["racks", "IT Racks"],
                ["yardEquipment", "Non-IT Yard Equipment"]
              ].map(([k, lbl]) => (
                <button key={k} onClick={() => toggleLayer(k)} className={`px-2 py-1 rounded font-medium border ${layers[k] ? "bg-blue-50 border-blue-500 text-blue-900" : "bg-white border-slate-300 text-slate-400"}`}>
                  {layers[k] ? "✓ " : ""}{lbl}
                </button>
              ))}
            </div>
          </div>

          {(eng?.pods?.length ?? 0) === 0 ? (
            <div className="h-[420px] bg-slate-950 text-slate-300 flex flex-col items-center justify-center p-6 text-center">
              <p className="text-base font-bold text-white">No IT Racks Placed Yet</p>
              <p className="text-xs text-slate-400 mt-1 max-w-md">Open the Requirements Wizard (Step 2) to add IT compute racks—the 3D container & yard layout will generate automatically.</p>
            </div>
          ) : (
            <div ref={mountRef} className="w-full h-[460px] bg-slate-950 cursor-grab active:cursor-grabbing" />
          )}
        </div>
      );
    }

    function ParcelLayoutPlanner({ project, eng, onUpdateProject, palette, onUpdatePalette, onApplyTheme }) {
      const [statusMsg, setStatusMsg] = useState("");
      const verts = project.parcelVertices || [];
      const minX = Math.min(...verts.map(v => v.x), 0);
      const maxX = Math.max(...verts.map(v => v.x), 110);
      const minY = Math.min(...verts.map(v => v.y), 0);
      const maxY = Math.max(...verts.map(v => v.y), 90);
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;

      const loadPresetShape = (shape) => {
        if (shape === "IrregularTrapezoid") {
          onUpdateProject({ parcelShape: shape, parcelVertices: [{ x: 0, y: 0 }, { x: 110, y: 0 }, { x: 128, y: 78 }, { x: 16, y: 92 }] });
        } else if (shape === "LShaped") {
          onUpdateProject({ parcelShape: shape, parcelVertices: [{ x: 0, y: 0 }, { x: 125, y: 0 }, { x: 125, y: 48 }, { x: 64, y: 48 }, { x: 64, y: 95 }, { x: 0, y: 95 }] });
        } else if (shape === "PentagonPlot") {
          onUpdateProject({ parcelShape: shape, parcelVertices: [{ x: 10, y: 0 }, { x: 105, y: 5 }, { x: 125, y: 55 }, { x: 68, y: 96 }, { x: 0, y: 62 }] });
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const txt = ev.target.result;
          try {
            if (file.name.endsWith(".json") || file.name.endsWith(".geojson")) {
              const gj = JSON.parse(txt);
              const coords = gj.features?.[0]?.geometry?.coordinates?.[0] || gj.geometry?.coordinates?.[0];
              if (coords && coords.length >= 3) {
                const lon0 = coords[0][0], lat0 = coords[0][1];
                const pts = coords.slice(0, -1).map(([lon, lat]) => ({
                  x: Math.round((lon - lon0) * 111320 * Math.cos(lat0 * Math.PI / 180)),
                  y: Math.round((lat - lat0) * 110540)
                }));
                const offX = Math.min(...pts.map(p => p.x));
                const offY = Math.min(...pts.map(p => p.y));
                onUpdateProject({ parcelShape: "CustomGeoJSON", plotAreaInput: "", parcelVertices: pts.map(p => ({ x: p.x - offX, y: p.y - offY })) });
                setStatusMsg(`Imported ${pts.length} survey vertices from ${file.name}`);
              }
            } else if (file.name.endsWith(".kml")) {
              const match = txt.match(/<coordinates>([\s\S]*?)<\/coordinates>/i);
              if (match) {
                const rawPts = match[1].trim().split(/\s+/).map(pair => pair.split(",").map(Number));
                const lon0 = rawPts[0][0], lat0 = rawPts[0][1];
                const pts = rawPts.slice(0, -1).map(([lon, lat]) => ({
                  x: Math.round((lon - lon0) * 111320 * Math.cos(lat0 * Math.PI / 180)),
                  y: Math.round((lat - lat0) * 110540)
                }));
                const offX = Math.min(...pts.map(p => p.x));
                const offY = Math.min(...pts.map(p => p.y));
                onUpdateProject({ parcelShape: "CustomKML", plotAreaInput: "", parcelVertices: pts.map(p => ({ x: p.x - offX, y: p.y - offY })) });
                setStatusMsg(`Imported ${pts.length} vertices from KML survey`);
              }
            }
          } catch (err) {
            setStatusMsg("Could not parse KML/GeoJSON coordinates.");
          }
        };
        reader.readAsText(file);
      };

      const polyStr = verts.map(v => `${v.x},${v.y}`).join(" ");

      return (
        <div className="bg-white rounded-xl card-shadow border border-slate-200 overflow-hidden space-y-4">
          <div className="p-4 pb-0 flex flex-wrap items-center justify-between gap-3">
            <div>
              <h3 className="text-base font-bold navy-text">Total Campus & Yard Layout Planner (Acres / m² & 3-Zone Isolation)</h3>
              <p className="text-xs text-slate-500">Zone A: IT Pods + Admin/Staging • Zone B: Containerized UPS/BESS • Zone C: Open Outdoor Trafos, Canopy DGs & Cooling (&gt;=12m away)</p>
            </div>
            <div className="flex flex-wrap gap-1.5">
              <button onClick={() => loadPresetShape("IrregularTrapezoid")} className="px-2.5 py-1 text-xs font-bold rounded border border-slate-300 hover:bg-slate-50">Trapezoid</button>
              <button onClick={() => loadPresetShape("LShaped")} className="px-2.5 py-1 text-xs font-bold rounded border border-slate-300 hover:bg-slate-50">L-Shaped</button>
              <button onClick={() => loadPresetShape("PentagonPlot")} className="px-2.5 py-1 text-xs font-bold rounded border border-slate-300 hover:bg-slate-50">5-Sided</button>

    function App() {
      const [screen, setScreen] = useState("home");
      const [navHistory, setNavHistory] = useState([]);
      const [projects, setProjects] = useState(() => [makeSampleProject(INITIAL_STANDARDS)]);

      const [driveToken, setDriveToken] = useState("");
      const [driveStatus, setDriveStatus] = useState("Local Ready");
      const [lastSavedAt, setLastSavedAt] = useState(() => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
      const [saveToast, setSaveToast] = useState("");
      const [cityMatches, setCityMatches] = useState([]);

      // Google Drive Folder Browser & Creator State
      const [showDriveModal, setShowDriveModal] = useState(false);
      const [driveModalMode, setDriveModalMode] = useState("save"); // "save" | "open"
      const [driveFolderStack, setDriveFolderStack] = useState([{ id: "root", name: "My Drive" }]);
      const [driveFolderList, setDriveFolderList] = useState([]);
      const [driveFileList, setDriveFileList] = useState([]);
      const [newFolderName, setNewFolderName] = useState("");

      // External Supply Chain Intelligence State (loaded from mdc_supply_intel.json)
      const [supplyIntel, setSupplyIntel] = useState(() => DEFAULT_SUPPLY_INTEL_V12);
      const [intelCatFilter, setIntelCatFilter] = useState("Transformers (K-Factor)");
      const [intelRatingFilter, setIntelRatingFilter] = useState("");
      const [intelUrlInput, setIntelUrlInput] = useState("./mdc_supply_intel.json");

      const [wizardTab, setWizardTab] = useState(0);
      const [wizardMode, setWizardMode] = useState("create");
      const [paramTab, setParamTab] = useState("skus");
      const [nonItCatFilter, setNonItCatFilter] = useState("ALL");
      const [weatherLoading, setWeatherLoading] = useState(false);
      const [weatherMsg, setWeatherMsg] = useState("");
      const [bulkLoadValue, setBulkLoadValue] = useState(220);

      const [quoteModalItem, setQuoteModalItem] = useState(null);
      const [quoteForm, setQuoteForm] = useState({ mode: "discount", discountPct: 0, specialPrice: 0, validUntil: "", comments: "" });

      const navigateTo = (nextScreen) => {
        if (nextScreen === screen) return;
        setNavHistory(prev => [...prev, screen]);
        setScreen(nextScreen);
      };

      const goBack = () => {
        if (navHistory.length === 0) {
          setScreen("home");
          return;
        }
        const prevScreen = navHistory[navHistory.length - 1];
        setNavHistory(prev => prev.slice(0, -1));
        setScreen(prevScreen);
      };

      useEffect(() => {
        try {
          const parsed = WorkspaceStorageAdapter.loadState(null);
          if (parsed) {
            if (parsed.projects?.length) setProjects(parsed.projects.map(p => sanitizeProject(p, parsed.standards || INITIAL_STANDARDS)));
            if (parsed.editingId) setEditingId(parsed.editingId);
            if (parsed.skus?.length) setSkus(parsed.skus);
            if (parsed.containerCatalog?.length) setContainerCatalog(parsed.containerCatalog);
            if (parsed.nonItCatalog?.length) setNonItCatalog(parsed.nonItCatalog);
            if (parsed.standards) setStandards({ ...INITIAL_STANDARDS, ...parsed.standards });
            if (parsed.palette) setPalette({ ...COLOR_THEMES.projector, ...parsed.palette });
            if (parsed.supplyIntel?.items) setSupplyIntel(parsed.supplyIntel);
            if (parsed.logoDataUrl) setLogoDataUrl(parsed.logoDataUrl);
            if (parsed.clientId) setClientId(parsed.clientId);
          }
        } catch (e) {}
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ projects, editingId, skus, containerCatalog, nonItCatalog, standards, palette, supplyIntel, logoDataUrl, clientId }));
          setLastSavedAt(new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
        } catch (e) {}
      }, [projects, editingId, skus, containerCatalog, nonItCatalog, standards, palette, supplyIntel, logoDataUrl, clientId]);

      const currentProject = useMemo(
        () => sanitizeProject(projects.find(p => p.id === editingId) || projects[0], standards),
        [projects, editingId, standards]
      );

      const eng = useMemo(
        () => computeEngineeringV12(currentProject, skus, nonItCatalog, standards),
        [currentProject, skus, nonItCatalog, standards]
      );

      const updateCurrentProject = (patch) => {
        setProjects(prev => prev.map(p => p.id === currentProject.id ? { ...p, ...patch, updatedAt: new Date().toISOString().slice(0, 10) } : p));
      };

      const deleteProject = (id) => {
        if (!confirm("Are you sure you want to delete this saved deal/JSON?")) return;
        const remaining = projects.filter(p => p.id !== id);
        if (remaining.length === 0) {
          const fresh = makeBlankProject("proj-" + Date.now(), 1, standards);
          setProjects([fresh]);
          setEditingId(fresh.id);
          saveDraftNow("Deal deleted — reset to clean blank project");
        } else {
          setProjects(remaining);
          if (editingId === id) {
            setEditingId(remaining[0].id);
          }
          saveDraftNow("Deal deleted successfully");
        }
      };

      const saveDraftNow = (customMsg = "All progress saved to browser storage ✓") => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ projects, editingId, skus, containerCatalog, nonItCatalog, standards, palette, supplyIntel, logoDataUrl, clientId }));
          const t = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
          setLastSavedAt(t);
          setSaveToast(`${customMsg} (${t})`);
          setTimeout(() => setSaveToast(""), 3500);
        } catch (e) {}
      };

      const updatePaletteKey = (k, hex) => setPalette(prev => ({ ...prev, [k]: hex }));
      const applyColorTheme = (themeKey) => {
        if (COLOR_THEMES[themeKey]) setPalette({ ...COLOR_THEMES[themeKey] });
      };

      const autoOptimizeBuildingBlocks = () => {
        const pickBest = (group, demand) => {
          const options = nonItCatalog.filter(i => i.group === group && i.ratedCapacity > 0);
          if (options.length === 0) return null;
          if (demand <= 0) return options[0].id;
          let best = options[0];
          let bestScore = Infinity;
          options.forEach(opt => {
            const calc = calcRedundantUnits(demand, opt.ratedCapacity, currentProject.uptimeTier);
            const count = group === "dg" ? Math.max(2, calc.total) : calc.total;
            const totalCost = count * opt.cost;
            const totalFootprint = count * (opt.footprintSqm || 15);
            const score = totalCost + (totalFootprint * 25000);
            if (score < bestScore) {
              bestScore = score;
              best = opt;
            }
          });
          return best.id;
        };

        updateCurrentProject({
          selectedTrafoId: pickBest("trafo", eng.totalFacilityPeakKva) || currentProject.selectedTrafoId,
          selectedUpsId: pickBest("ups", eng.upsCriticalLoadKva) || currentProject.selectedUpsId,
          selectedDgId: pickBest("dg", eng.totalFacilityPeakKva) || currentProject.selectedDgId,
          selectedCoolerId: pickBest("cooler", eng.totalLiquidKw) || currentProject.selectedCoolerId,
          selectedCduId: pickBest("cdu", eng.extCduRequiredKw) || currentProject.selectedCduId,
          selectedTankId: pickBest("tank", eng.reqWaterKl || 25) || currentProject.selectedTankId,
          solutionQtyOverrides: {}
        });
      };

      const openSpecialQuoteDialog = (bomItem) => {
        const existing = currentProject.dealOverrides?.[bomItem.key];
        setQuoteModalItem(bomItem);
        setQuoteForm({
          mode: existing?.mode || "discount",
          discountPct: existing?.discountPct ?? 0,
          specialPrice: existing?.specialPrice ?? bomItem.unitCost,
          validUntil: existing?.validUntil || "",
          comments: existing?.comments || ""
        });
      };

      const saveSpecialQuote = () => {
        if (!quoteModalItem) return;
        const nextOverrides = {
          ...(currentProject.dealOverrides || {}),
          [quoteModalItem.key]: {
            mode: quoteForm.mode,
            discountPct: Number(quoteForm.discountPct) || 0,
            specialPrice: Number(quoteForm.specialPrice) || 0,
            validUntil: quoteForm.validUntil,
            comments: quoteForm.comments
          }
        };
        updateCurrentProject({ dealOverrides: nextOverrides });
        setQuoteModalItem(null);
      };

      const clearSpecialQuote = () => {
        if (!quoteModalItem) return;
        const nextOverrides = { ...(currentProject.dealOverrides || {}) };
        delete nextOverrides[quoteModalItem.key];
        updateCurrentProject({ dealOverrides: nextOverrides });
        setQuoteModalItem(null);

      const applySelectedCityMatch = async (place) => {
        const { latitude, longitude, elevation, name, country, admin1 } = place;
        const elev = Math.round(elevation || 0);
        const est = estimateSummerDesignClimate(latitude, longitude, elev);
        const seis = classifySeismicZone(`${name} ${admin1 || ""}`, latitude, longitude);

        let finalDb = est.peakDryBulb;
        let finalWb = est.peakWetBulb;
        let finalRh = est.relHumidityPct;
        let climateSource = "ASHRAE Elevation/Latitude Model";

        // Attempt deterministic 5-year historical May-June summer peak lookup via Open-Meteo Archive API
        try {
          const archUrl = `https://archive-api.open-meteo.com/v1/archive?latitude=${latitude.toFixed(4)}&longitude=${longitude.toFixed(4)}&start_date=2025-05-01&end_date=2025-06-30&daily=temperature_2m_max,relative_humidity_2m_mean&timezone=auto`;
          const aRes = await fetch(archUrl);
          if (aRes.ok) {
            const aData = await aRes.json();
            const maxTemps = (aData.daily?.temperature_2m_max || []).filter(v => typeof v === "number");
            const rhs = (aData.daily?.relative_humidity_2m_mean || []).filter(v => typeof v === "number");
            if (maxTemps.length > 10) {
              maxTemps.sort((a, b) => b - a);
              // 99th percentile summer peak (2nd hottest day in May-June)
              finalDb = Number(Math.max(18, maxTemps[1] || maxTemps[0]).toFixed(1));
              finalRh = rhs.length ? Math.round(rhs.reduce((a, b) => a + b, 0) / rhs.length) : est.relHumidityPct;
              const T = finalDb;
              const tw = T * Math.atan(0.151977 * Math.pow(finalRh + 8.313659, 0.5)) + Math.atan(T + finalRh) - Math.atan(finalRh - 1.676331) + 0.00391838 * Math.pow(finalRh, 1.5) * Math.atan(0.023101 * finalRh) - 4.686035;
              finalWb = Number(Math.max(10, Math.min(finalDb - 2.0, tw)).toFixed(1));
              climateSource = "Open-Meteo ERA5 Summer Peak";
            }
          }
        } catch (err) {}

        updateCurrentProject({
          cityQuery: `${name}${admin1 ? ", " + admin1 : ""}${country ? " (" + country + ")" : ""}`,
          lat: Number(latitude.toFixed(2)),
          lon: Number(longitude.toFixed(2)),
          elevationM: elev,
          peakDryBulb: finalDb,
          peakWetBulb: finalWb,
          relHumidityPct: finalRh,
          monthlyClimate: synthesizeMonthlyClimate(finalDb, finalWb, finalRh),
          seismicZone: seis.zone,
          seismicZFactor: seis.zFactor,
          seismicLabel: seis.label,
          includeGasScrubber: /delhi|noida|gurgaon|vadodara|ahmedabad|mumbai|chennai|kolkata/i.test(name),
          exteriorRalLabel: /mumbai|chennai|kolkata|kochi|mangalore|visakhapatnam/i.test(name) ? "RAL 5002 Marine C5-M Coating" : currentProject.exteriorRalLabel
        });
        setCityMatches([]);
        setWeatherMsg(`✓ Resolved ${name}${admin1 ? ", " + admin1 : ""}: ${finalDb}°C DB / ${finalWb}°C WB (${climateSource}), Elev ${elev}m, ${seis.label}`);
      };

      const fetchCityWeatherAndSeismic = async () => {
        const rawQ = (currentProject.cityQuery || "").trim();
        if (!rawQ) return;
        const cleanQ = rawQ.split(",")[0].trim();
        setWeatherLoading(true);
        setWeatherMsg("Resolving deterministic city coordinates & summer design climate...");
        setCityMatches([]);
        try {
          const lowerQ = cleanQ.toLowerCase();
          const queries = [cleanQ];
          if (lowerQ === "dharamshala" || lowerQ === "dharamsala") {
            queries.push("Dharamsala", "Dharamshala");
          }
          let combined = [];
          for (const qItem of Array.from(new Set(queries))) {
            const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(qItem)}&count=10&language=en&format=json`);
            const geoData = await geoRes.json();
            if (Array.isArray(geoData.results)) combined = [...combined, ...geoData.results];
          }
          const seen = new Set();
          const unique = combined.filter(p => {
            if (seen.has(p.id)) return false;
            seen.add(p.id);
            return true;
          });

          // Deterministic ranking: 1) India match, 2) Populated city/district HQ (PPLC/PPLA/PPLA2/PPL) over ADM polygons, 3) Population, 4) GeoNames ID tie-breaker
          const featureRank = (fc = "") => {
            if (fc === "PPLC") return 5;
            if (fc === "PPLA") return 4;
            if (fc === "PPLA2") return 3;
            if (fc === "PPL" || fc === "PPLA3") return 2;
            return 1;
          };
          unique.sort((a, b) => {
            const aIn = a.country_code === "IN" ? 1 : 0;
            const bIn = b.country_code === "IN" ? 1 : 0;
            if (aIn !== bIn) return bIn - aIn;
            const fDiff = featureRank(b.feature_code) - featureRank(a.feature_code);
            if (fDiff !== 0) return fDiff;
            const pDiff = (b.population || 0) - (a.population || 0);
            if (pDiff !== 0) return pDiff;
            return (a.id || 0) - (b.id || 0);
          });

          if (unique.length === 0) {
            const seis = classifySeismicZone(cleanQ, 20, 78);
            updateCurrentProject({ seismicZone: seis.zone, seismicZFactor: seis.zFactor, seismicLabel: seis.label });
            setWeatherMsg(`City coordinates not found; applied ${seis.label}. Adjust Dry/Wet Bulb manually.`);
            setWeatherLoading(false);
            return;
          }

          await applySelectedCityMatch(unique[0]);
          if (unique.length > 1) {
            setCityMatches(unique.slice(0, 5));
          }
        } catch (e) {
          const seis = classifySeismicZone(cleanQ, 20, 78);
          updateCurrentProject({ seismicZone: seis.zone, seismicZFactor: seis.zFactor, seismicLabel: seis.label });
          setWeatherMsg(`Offline mode: Applied ${seis.label}. Adjust Dry/Wet Bulb manually below.`);
        }
        setWeatherLoading(false);
      };

        const targetKw = (Number(currentProject.targetItMw) || 1.5) * 1000;
        const dlcList = skus.filter(s => s.coolingType === "DLC");
        const primaryDlc = dlcList[0];
        const secondaryDlc = dlcList[1];
        const acSku = skus.find(s => s.coolingType === "AC");
        const nextQty = {};
        skus.forEach(s => nextQty[s.id] = 0);

        if (primaryDlc) {
          const dlcShareKw = acSku ? targetKw * 0.94 : targetKw;
          const pKw = primaryDlc.peakKw * (primaryDlc.continuousFactor || 0.94);
          if (secondaryDlc && targetKw >= 6000) {
            nextQty[primaryDlc.id] = Math.max(1, Math.round((dlcShareKw * 0.68) / pKw));
            const sKw = secondaryDlc.peakKw * (secondaryDlc.continuousFactor || 0.94);
            nextQty[secondaryDlc.id] = Math.max(1, Math.round((dlcShareKw * 0.32) / sKw));
          } else {
            nextQty[primaryDlc.id] = Math.max(1, Math.round(dlcShareKw / pKw));
          }
        }
        if (acSku) {
          const acShareKw = Math.max(50, targetKw * 0.06);
          const aKw = acSku.peakKw * (acSku.continuousFactor || 0.90);
          nextQty[acSku.id] = Math.max(2, Math.round(acShareKw / aKw));

                              <th className="p-2.5">Weight (kg)</th>
                              <th className="p-2.5">Dimensions L×W×D (mm)</th>
                              <th className="p-2.5">CDU Integrated?</th>
                              <th className="p-2.5">Pwr / Plumb</th>
                              <th className="p-2.5">LPM/kW & ΔP</th>
                              <th className="p-2.5">Action</th>
                            </tr>
                          </thead>
                          <tbody>
                            {skus.map((s, idx) => {
                              const updateSku = (patch) => setSkus(prev => prev.map((x, i) => i === idx ? { ...x, ...patch } : x));
                              return (
                                <tr key={s.id} className="border-b border-slate-200 hover:bg-slate-50">
                                  <td className="p-2"><input type="text" value={s.name} onChange={e => updateSku({ name: e.target.value })} className="w-44 border rounded px-2 py-1 font-bold navy-text" /></td>
                                  <td className="p-2">
                                    <select value={s.coolingType} onChange={e => updateSku({ coolingType: e.target.value, liquidSplitPct: e.target.value === "AC" ? 0 : (s.liquidSplitPct || 90), plumbingEntry: e.target.value === "AC" ? "None" : "Bottom" })} className="border rounded px-1.5 py-1 font-bold">
                                      <option value="DLC">DLC</option>
                                      <option value="AC">AC</option>
                                    </select>
                                  </td>
                                  <td className="p-2"><input type="number" value={s.peakKw} onChange={e => updateSku({ peakKw: Number(e.target.value) })} className="w-14 border rounded px-1.5 py-1 font-bold" /></td>
                                  <td className="p-2"><input type="number" min="0" max="100" disabled={s.coolingType === "AC"} value={s.coolingType === "AC" ? 0 : s.liquidSplitPct} onChange={e => updateSku({ liquidSplitPct: Number(e.target.value) })} className="w-12 border rounded px-1 py-1 disabled:bg-slate-100" /></td>
                                  <td className="p-2"><input type="number" step="0.5" value={s.maxInletTempC || 35} onChange={e => updateSku({ maxInletTempC: Number(e.target.value) })} className="w-14 border rounded px-1.5 py-1 font-bold text-sky-900" /></td>
                                  <td className="p-2"><input type="number" value={s.weightKg} onChange={e => updateSku({ weightKg: Number(e.target.value) })} className="w-16 border rounded px-1.5 py-1" /></td>
                                  <td className="p-2">
                                    <div className="flex items-center gap-1">
                                      <input type="number" value={s.heightMm} onChange={e => updateSku({ heightMm: Number(e.target.value) })} className="w-14 border rounded px-1 py-1" />
                                      <span>×</span>
                                      <input type="number" value={s.widthMm} onChange={e => updateSku({ widthMm: Number(e.target.value) })} className="w-12 border rounded px-1 py-1" />
                                      <span>×</span>
                                      <input type="number" value={s.depthMm} onChange={e => updateSku({ depthMm: Number(e.target.value) })} className="w-14 border rounded px-1 py-1" />
                                    </div>
                                  </td>
                                  <td className="p-2">
                                    <select disabled={s.coolingType === "AC"} value={s.cduIntegrated ? "Yes" : "No"} onChange={e => updateSku({ cduIntegrated: e.target.value === "Yes" })} className="border rounded px-1.5 py-1 disabled:bg-slate-100">
                                      <option value="Yes">Yes</option>
                                      <option value="No">No (Yard CDU)</option>
                                    </select>
                                  </td>
                                  <td className="p-2">
                                    <div className="flex gap-1">
                                      <select value={s.powerEntry} onChange={e => updateSku({ powerEntry: e.target.value })} className="border rounded px-1 py-1">
                                        <option value="Top">Top</option><option value="Bottom">Bot</option>
                                      </select>
                                      <select disabled={s.coolingType === "AC"} value={s.plumbingEntry} onChange={e => updateSku({ plumbingEntry: e.target.value })} className="border rounded px-1 py-1 disabled:bg-slate-100">
                                        <option value="Top">Top</option><option value="Bottom">Bot</option><option value="None">None</option>
                                      </select>
                                    </div>
                                  </td>
                                  <td className="p-2">
                                    <div className="flex items-center gap-1">
                                      <input type="number" step="0.05" disabled={s.coolingType === "AC"} value={s.flowLpmPerKw} onChange={e => updateSku({ flowLpmPerKw: Number(e.target.value) })} className="w-12 border rounded px-1 py-1" />
                                      <input type="number" step="0.1" disabled={s.coolingType === "AC"} value={s.reqDeltaPBar} onChange={e => updateSku({ reqDeltaPBar: Number(e.target.value) })} className="w-12 border rounded px-1 py-1" />
                                    </div>
                                  </td>
                                  <td className="p-2">
                                    <button onClick={() => setSkus(prev => prev.filter((_, i) => i !== idx))} className="px-2 py-1 rounded bg-red-50 text-red-700 hover:bg-red-100 font-bold">Del</button>
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {paramTab === "containers" && (
                    <div className="p-5 space-y-3 text-xs">
                      <div className="flex items-center justify-between">
                        <p className="text-slate-600">Standard and promoted bespoke container shells with starting per-pod baseline costs:</p>
                        <button
                          onClick={() => setContainerCatalog(prev => [...prev, {
                            id: "cnt-" + Date.now(),
                            name: "Custom 14.0m Sovereign Pod",
                            lengthMm: 14000, widthMm: 4200, heightMm: 3900,
                            metallurgy: "Corten-A SPA-H", wallMm: 2.5, roofMm: 3.0, floorMm: 5.0,
                            plenumMm: 750, topClearanceMm: 1000,
                            baseCostInr: 8400000
                          }])}
                          className="px-3.5 py-2 rounded-lg coral-bg text-white font-bold"
                        >
                          + Add Container Shell
                        </button>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        {containerCatalog.map((c, idx) => {
                          const updateCnt = (patch) => setContainerCatalog(prev => prev.map((x, i) => i === idx ? { ...x, ...patch } : x));
                          return (
                            <div key={c.id} className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
                              <div className="flex items-center justify-between gap-2">
                                <input type="text" value={c.name} onChange={e => updateCnt({ name: e.target.value })} className="font-bold navy-text text-sm border rounded px-2 py-1 bg-white flex-1" />
                                <button onClick={() => setContainerCatalog(prev => prev.filter((_, i) => i !== idx))} className="px-2 py-1 rounded bg-red-50 text-red-700 font-bold">Delete</button>
                              </div>
                              <div className="grid grid-cols-4 gap-2">
                                <div><span className="text-slate-400 block">Length (mm)</span><input type="number" value={c.lengthMm} onChange={e => updateCnt({ lengthMm: Number(e.target.value) })} className="w-full border rounded px-2 py-1 bg-white" /></div>
                                <div><span className="text-slate-400 block">Width (mm)</span><input type="number" value={c.widthMm} onChange={e => updateCnt({ widthMm: Number(e.target.value) })} className="w-full border rounded px-2 py-1 bg-white" /></div>
                                <div><span className="text-slate-400 block">Height (mm)</span><input type="number" value={c.heightMm} onChange={e => updateCnt({ heightMm: Number(e.target.value) })} className="w-full border rounded px-2 py-1 bg-white" /></div>
                                <div><span className="text-slate-400 block">Base Cost (₹)</span><input type="number" value={c.baseCostInr} onChange={e => updateCnt({ baseCostInr: Number(e.target.value) })} className="w-full border rounded px-2 py-1 bg-white font-mono font-bold text-emerald-800" /></div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  {paramTab === "nonit" && (
                    <div className="p-5 space-y-4 text-xs">
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <div className="flex flex-wrap gap-1.5">
                          {nonItCategories.map(cat => (
                            <button
                              key={cat}
                              onClick={() => setNonItCatFilter(cat)}
                              className={`px-2.5 py-1.5 rounded-lg font-bold border ${nonItCatFilter === cat ? "navy-bg text-white border-[#002870]" : "bg-slate-50 border-slate-300 text-slate-700"}`}
                            >
                              {cat}
                            </button>
                          ))}
                        </div>
                        <button
                          onClick={() => setNonItCatalog(prev => [{
                            id: "custom-nonit-" + Date.now(),
                            group: "custom",
                            category: nonItCatFilter === "ALL" ? "Power Distribution & Transformation" : nonItCatFilter,
                            label: "New Non-IT Building Block / Service",
                            ratedCapacity: 1000,
                            capacityUnit: "kVA",
                            footprintSqm: 15,
                            unit: "per unit",
                            cost: 1250000,
                            make: "Approved OEM",
                            model: "STD-MODEL"
                          }, ...prev])}
                          className="px-3.5 py-2 rounded-lg coral-bg text-white font-bold"
                        >
                          + Add Non-IT Item / Service
                        </button>
                      </div>

                      <div className="overflow-x-auto border border-slate-200 rounded-xl">
                        <table className="w-full text-left border-collapse">
                          <thead>
                            <tr className="bg-slate-100 border-b border-slate-200">
                              <th className="p-2.5">Category</th>
                              <th className="p-2.5">Equipment / Service Description</th>
                              <th className="p-2.5">Rated Cap.</th>
                              <th className="p-2.5">Footprint (m²)</th>
                              <th className="p-2.5">OEM Make & Model</th>
                              <th className="p-2.5">Unit Basis</th>
                              <th className="p-2.5 text-right">Master Starting Cost (₹)</th>
                              <th className="p-2.5">Action</th>
                            </tr>
                          </thead>
                          <tbody>
                            {nonItCatalog
                              .filter(item => nonItCatFilter === "ALL" || item.category === nonItCatFilter)
                              .map((item) => {
                                const updateItem = (patch) => setNonItCatalog(prev => prev.map(x => x.id === item.id ? { ...x, ...patch } : x));
                                return (
                                  <tr key={item.id} className="border-b border-slate-200 hover:bg-slate-50">
                                    <td className="p-2">
                                      <select value={item.category} onChange={e => updateItem({ category: e.target.value })} className="border rounded px-1.5 py-1 bg-white max-w-[165px]">
                                        {nonItCategories.filter(c => c !== "ALL").map(c => <option key={c} value={c}>{c}</option>)}
                                      </select>
                                    </td>
                                    <td className="p-2"><input type="text" value={item.label} onChange={e => updateItem({ label: e.target.value })} className="w-60 border rounded px-2 py-1 font-bold navy-text" /></td>
                                    <td className="p-2">
                                      <div className="flex items-center gap-1">
                                        <input type="number" value={item.ratedCapacity || 1} onChange={e => updateItem({ ratedCapacity: Number(e.target.value) })} className="w-16 border rounded px-1.5 py-1" />
                                        <span className="text-slate-400">{item.capacityUnit}</span>
                                      </div>
                                    </td>
                                    <td className="p-2"><input type="number" value={item.footprintSqm || 0} onChange={e => updateItem({ footprintSqm: Number(e.target.value) })} className="w-14 border rounded px-1.5 py-1" /></td>
                                    <td className="p-2">
                                      <div className="flex gap-1">
                                        <input type="text" value={item.make} onChange={e => updateItem({ make: e.target.value })} className="w-24 border rounded px-1.5 py-1" />
                                        <input type="text" value={item.model} onChange={e => updateItem({ model: e.target.value })} className="w-24 border rounded px-1.5 py-1" />
                                      </div>
                                    </td>
                                    <td className="p-2"><input type="text" value={item.unit} onChange={e => updateItem({ unit: e.target.value })} className="w-24 border rounded px-1.5 py-1" /></td>
                                    <td className="p-2 text-right"><input type="number" value={item.cost} onChange={e => updateItem({ cost: Number(e.target.value) })} className="w-28 border rounded px-2 py-1 text-right font-mono font-bold text-emerald-800" /></td>
                                    <td className="p-2">
                                      <button onClick={() => setNonItCatalog(prev => prev.filter(x => x.id !== item.id))} className="px-2 py-1 rounded bg-red-50 text-red-700 font-bold">Delete</button>
                                    </td>
                                  </tr>
                                );
                              })}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}

                  {paramTab === "branding" && (
                    <div className="p-6 space-y-6 text-sm">
                      <div className="grid grid-cols-2 md:grid-cols-5 gap-3 bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs">
                        <div><label className="block font-bold">Default Annual AMC %</label><input type="number" step="0.25" value={standards.defaultAmcPctOfCapex} onChange={e => setStandards(s => ({ ...s, defaultAmcPctOfCapex: Number(e.target.value) }))} className="w-full border rounded px-2 py-1 bg-white mt-1 font-bold" /></div>
                        <div><label className="block font-bold">Grid Tariff (₹/kWh)</label><input type="number" step="0.5" value={standards.gridTariffInrKwh} onChange={e => setStandards(s => ({ ...s, gridTariffInrKwh: Number(e.target.value) }))} className="w-full border rounded px-2 py-1 bg-white mt-1" /></div>
                        <div><label className="block font-bold">Water Tariff (₹/kL)</label><input type="number" value={standards.waterTariffInrKl} onChange={e => setStandards(s => ({ ...s, waterTariffInrKl: Number(e.target.value) }))} className="w-full border rounded px-2 py-1 bg-white mt-1" /></div>
                        <div><label className="block font-bold">Default Margin %</label><input type="number" value={standards.defaultMarginPct} onChange={e => setStandards(s => ({ ...s, defaultMarginPct: Number(e.target.value) }))} className="w-full border rounded px-2 py-1 bg-white mt-1" /></div>
                        <div><label className="block font-bold">Default GST %</label><input type="number" value={standards.defaultGstPct} onChange={e => setStandards(s => ({ ...s, defaultGstPct: Number(e.target.value) }))} className="w-full border rounded px-2 py-1 bg-white mt-1" /></div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="space-y-3 p-4 bg-slate-50 rounded-xl border border-slate-200">
                          <h3 className="font-bold navy-text">Company Logo (Header & Top-Right of PowerPoint Slides)</h3>
                          <input type="file" accept="image/*" onChange={handleLogoUpload} className="block text-xs" />
                          {logoDataUrl && <img src={logoDataUrl} alt="Logo Preview" className="h-12 w-auto object-contain bg-white p-1 rounded border" />}
                        </div>
                        <div className="space-y-3 p-4 bg-slate-50 rounded-xl border border-slate-200">
                          <h3 className="font-bold navy-text">Google Drive OAuth Client ID (Syncs Deals + Master JSON)</h3>
                          <input type="text" value={clientId} onChange={e => setClientId(e.target.value)} className="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs font-mono bg-white" />
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          </main>

          {/* EXPLICIT SAVE / OPEN WORKSPACE MODAL (LOCAL DIRECTORY + GOOGLE DRIVE FOLDER BROWSER) */}
          <V12WorkspaceSaveOpenModal
            isOpen={showDriveModal}
            onClose={() => setShowDriveModal(false)}
            mode={driveModalMode}
            currentProject={currentProject}
            skus={skus}
            containerCatalog={containerCatalog}
            nonItCatalog={nonItCatalog}
            standards={standards}
            driveToken={driveToken}
            onGoogleSignIn={handleGoogleSignIn}
            driveFolderStack={driveFolderStack}
            setDriveFolderStack={setDriveFolderStack}
            driveFolderList={driveFolderList}
            driveFileList={driveFileList}
            fetchDriveFolderContents={fetchDriveFolderContents}
            newFolderName={newFolderName}
            setNewFolderName={setNewFolderName}
            createDriveSubfolder={createDriveSubfolder}
            saveToSelectedDriveFolder={saveToSelectedDriveFolder}
            loadFileFromGoogleDrive={loadFileFromGoogleDrive}
            deleteFileFromGoogleDrive={deleteFileFromGoogleDrive}
            onImportLocalFile={importDealFromLocalFile}
          />

          {/* DEAL-LEVEL SPECIAL VENDOR PRICING DIALOG BOX */}
          {quoteModalItem && (
            <div className="fixed inset-0 bg-slate-950/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 space-y-4 text-xs">
                <div className="flex items-start justify-between gap-3 border-b border-slate-200 pb-3">
                  <div>
                    <span className="px-2 py-0.5 rounded bg-amber-100 text-amber-900 font-black uppercase text-[10px]">Deal-Level Special Vendor Quote</span>
                    <h3 className="text-base font-bold navy-text mt-1">{quoteModalItem.label}</h3>
                    <p className="text-slate-500">Applies strictly to <strong>{currentProject.name}</strong> — Master Catalog remains untouched.</p>
                  </div>
                  <button onClick={() => setQuoteModalItem(null)} className="text-slate-400 hover:text-slate-700 font-bold text-base">✕</button>
                </div>

                <div className="p-3 bg-slate-50 rounded-lg border border-slate-200 flex justify-between items-center">
                  <span className="text-slate-600 font-medium">Master Catalog Starting Cost:</span>
                  <span className="font-mono font-bold text-sm navy-text">₹{Math.round(quoteModalItem.masterUnitCost).toLocaleString("en-IN")}</span>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={() => setQuoteForm(f => ({ ...f, mode: "discount" }))}
                    className={`py-2 px-3 rounded-lg font-bold border ${quoteForm.mode === "discount" ? "navy-bg text-white border-[#002870]" : "bg-white border-slate-300 text-slate-700"}`}
                  >
                    Option A: Discount % off Master
                  </button>
                  <button
                    onClick={() => setQuoteForm(f => ({ ...f, mode: "price" }))}
                    className={`py-2 px-3 rounded-lg font-bold border ${quoteForm.mode === "price" ? "coral-bg text-white border-[#FF5539]" : "bg-white border-slate-300 text-slate-700"}`}
                  >
                    Option B: Direct Special Price (₹)
                  </button>
                </div>

                {quoteForm.mode === "discount" ? (
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Vendor Discount (%)</label>
                      <input
                        type="number" step="0.5"
                        value={quoteForm.discountPct}
                        onChange={e => {
                          const d = Number(e.target.value);
                          const calcPrice = Math.round(quoteModalItem.masterUnitCost * (1 - d / 100));
                          setQuoteForm(f => ({ ...f, discountPct: d, specialPrice: calcPrice }));
                        }}
                        className="w-full border border-slate-300 rounded-lg px-3 py-2 font-mono font-bold"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Resulting Deal Unit Price (₹)</label>
                      <div className="w-full border border-slate-200 bg-slate-100 rounded-lg px-3 py-2 font-mono font-bold text-emerald-800">
                        ₹{Math.round(quoteModalItem.masterUnitCost * (1 - (Number(quoteForm.discountPct) || 0) / 100)).toLocaleString("en-IN")}
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Negotiated Deal Unit Price (₹)</label>
                      <input
                        type="number"
                        value={quoteForm.specialPrice}
                        onChange={e => {
                          const p = Number(e.target.value);
                          const d = quoteModalItem.masterUnitCost > 0 ? Number((((quoteModalItem.masterUnitCost - p) / quoteModalItem.masterUnitCost) * 100).toFixed(1)) : 0;
                          setQuoteForm(f => ({ ...f, specialPrice: p, discountPct: d }));
                        }}
                        className="w-full border border-slate-300 rounded-lg px-3 py-2 font-mono font-bold"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Effective Variance vs. Master</label>
                      <div className="w-full border border-slate-200 bg-slate-100 rounded-lg px-3 py-2 font-mono font-bold text-amber-800">
                        {quoteModalItem.masterUnitCost > 0
                          ? `${(((quoteModalItem.masterUnitCost - (Number(quoteForm.specialPrice) || 0)) / quoteModalItem.masterUnitCost) * 100).toFixed(1)}% off Master`
                          : "Custom Rate"}
                      </div>
                    </div>
                  </div>
                )}

                <div>
                  <label className="block font-bold text-slate-700 mb-1">Vendor Quote Validity Date</label>
                  <input
                    type="date"
                    value={quoteForm.validUntil}
                    onChange={e => setQuoteForm(f => ({ ...f, validUntil: e.target.value }))}
                    className="w-full border border-slate-300 rounded-lg px-3 py-2"
                  />
                </div>

                <div>
                  <label className="block font-bold text-slate-700 mb-1">Commercial Background, Vendor Ref & Terms / Comments</label>
                  <textarea
                    rows="3"
                    placeholder="e.g., OEM Q4 project bid #VT-409; includes 3-yr extended warranty & free site supervision; valid for PO before month-end..."
                    value={quoteForm.comments}
                    onChange={e => setQuoteForm(f => ({ ...f, comments: e.target.value }))}
                    className="w-full border border-slate-300 rounded-lg px-3 py-2"
                  />
                </div>

                <div className="flex items-center justify-between pt-3 border-t border-slate-200">
                  <button onClick={clearSpecialQuote} className="px-3 py-2 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-50 font-bold">
                    ↺ Revert to Master Baseline
                  </button>
                  <div className="flex gap-2">
                    <button onClick={() => setQuoteModalItem(null)} className="px-3.5 py-2 rounded-lg border border-slate-300 font-bold">Cancel</button>
                    <button onClick={saveSpecialQuote} className="px-4 py-2 rounded-lg coral-bg text-white font-bold">Save Deal Quote</button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
